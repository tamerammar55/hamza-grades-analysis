<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a49">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تحليل الدرجات">
<title>منصة تحليل الدرجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f5; --paper:#ffffff; --paper-2:#f6f8fb; --ink:#17212e; --ink-2:#334155; --muted:#5d6878; --line:#dbe1e8; --line-2:#c3ccd7;
  --navy:#14365d; --navy-2:#1f4e85; --navy-soft:#e8eff8; --gold:#b08a2e;
  --exc:#1d7a4e; --exc-soft:#e1f2e9; --mid:#2a62a6; --mid-soft:#e4edf8; --weak:#b0701a; --weak-soft:#fbefdc; --fail:#b3322d; --fail-soft:#f8e1df;
  --h1:#b7e1c6; --h2:#e2f0c4; --h3:#fbe9ac; --h4:#f8cfa3; --h5:#f1b0aa;
  --side:#0f2a49; --side-ink:#c9d6e6; --side-ink-2:#8ea4bf;
  --r:10px; --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c121b; --paper:#141c27; --paper-2:#1a2431; --ink:#e4e9f0; --ink-2:#c5cfdb; --muted:#93a1b3; --line:#263242; --line-2:#344457;
  --navy:#8fb6e6; --navy-2:#6d9fdc; --navy-soft:#1b2a3d; --gold:#d9b45a;
  --exc:#5ccf93; --exc-soft:#173527; --mid:#7fb0ec; --mid-soft:#18283c; --weak:#e6a54f; --weak-soft:#33260f; --fail:#f07d76; --fail-soft:#3a1a19;
  --h1:#1d4a33; --h2:#2b4325; --h3:#4a4120; --h4:#4e3220; --h5:#55252a;
  --side:#0a1624;
}}
:root[data-theme="dark"]{
  --bg:#0c121b; --paper:#141c27; --paper-2:#1a2431; --ink:#e4e9f0; --ink-2:#c5cfdb; --muted:#93a1b3; --line:#263242; --line-2:#344457;
  --navy:#8fb6e6; --navy-2:#6d9fdc; --navy-soft:#1b2a3d; --gold:#d9b45a;
  --exc:#5ccf93; --exc-soft:#173527; --mid:#7fb0ec; --mid-soft:#18283c; --weak:#e6a54f; --weak-soft:#33260f; --fail:#f07d76; --fail-soft:#3a1a19;
  --h1:#1d4a33; --h2:#2b4325; --h3:#4a4120; --h4:#4e3220; --h5:#55252a;
  --side:#0a1624;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

/* ===== الإطار ===== */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center}
.brand .mark{width:40px;height:40px;border-radius:9px;background:linear-gradient(140deg,#2a5d95,#14365d);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:0 0 40px}
.brand b{display:block;color:#fff;font-size:14.5px;line-height:1.3}
.brand small{color:var(--side-ink-2);font-size:11.5px}
.nav{padding:10px 10px 16px;flex:1}
.nav h4{margin:16px 10px 6px;font-size:11px;font-weight:600;color:var(--side-ink-2);letter-spacing:.2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:7px;padding:8px 11px;color:var(--side-ink);cursor:pointer;text-align:start;font-size:13.5px}
.nav button:hover:not(:disabled){background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:#fff;color:var(--side);font-weight:600}
.nav button:disabled{opacity:.35;cursor:default}
.nav svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-inline-start:auto;background:#c2412d;color:#fff;border-radius:999px;font-size:10.5px;padding:0 7px;font-weight:600}
.side-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--side-ink-2)}

.main{min-width:0;display:flex;flex-direction:column}
.toolbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:9px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .f{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 10px;background:var(--paper-2)}
.toolbar .f span{font-size:12px;color:var(--muted)}
.toolbar select{border:0;background:transparent;padding:4px 4px;font-weight:600;font-size:13px;cursor:pointer;max-width:200px}
.toolbar select:focus{outline:2px solid var(--navy-2);outline-offset:1px;border-radius:4px}
.toolbar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--navy-2);color:var(--navy-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-2);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--fail);border-color:var(--fail-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:none}
.view{padding:22px 20px 60px}

/* ===== ورقة التقرير ===== */
.sheet{background:var(--paper);max-width:1160px;margin:0 auto;border:1px solid var(--line);border-radius:6px;padding:30px 34px 36px;box-shadow:0 1px 3px rgba(20,40,70,.05)}
.sheet + .sheet{margin-top:20px}
.rh{padding-bottom:12px;border-bottom:3px double var(--navy)}
.rh-logo{text-align:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rh-logo img{max-width:100%;width:620px;height:auto;background:#fff;border-radius:6px;display:inline-block}
.rh-row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding-top:12px}
.rh-row .ttl{text-align:start}
.basis{margin-top:8px;font-size:11.5px;color:var(--muted)}
.rh .org{font-size:12px;line-height:1.7;color:var(--ink-2)}
.rh .org b{color:var(--ink);font-size:13px}
.rh .ttl{text-align:center}
.rh .ttl h1{margin:0;font-size:21px;color:var(--navy);font-weight:700;letter-spacing:-.2px}
.rh .ttl p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.rh .meta{justify-self:end;font-size:12px;color:var(--ink-2);display:grid;grid-template-columns:auto auto;gap:2px 10px}
.rh .meta span:nth-child(odd){color:var(--muted)}
.rh .meta span:nth-child(even){font-weight:600}
.r-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:14px 0 4px}
.r-tools .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.r-tools label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.r-tools select,.r-tools input{border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;background:var(--paper);font-size:13px}

.sec{margin-top:26px;break-inside:auto}
.sec>h2{display:flex;align-items:baseline;gap:10px;font-size:15.5px;margin:0 0 12px;color:var(--navy);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec>h2 .no{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--navy);color:#fff;font-size:12.5px;padding:0 6px}
.sec>h2 .hint{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:400}
.sub-h{font-size:13.5px;font-weight:700;color:var(--ink);margin:16px 0 8px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.cols>div{min-width:0}

/* مؤشرات */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}
.kpi{border:1px solid var(--line);border-top:3px solid var(--navy-2);border-radius:8px;padding:10px 12px;background:var(--paper)}
.kpi.t-exc{border-top-color:var(--exc)} .kpi.t-mid{border-top-color:var(--mid)} .kpi.t-weak{border-top-color:var(--weak)} .kpi.t-fail{border-top-color:var(--fail)}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:23px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted)}

/* جداول */
.tw{overflow-x:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{background:var(--navy);color:#fff;font-weight:600;font-size:12px;padding:8px 8px;text-align:center;border:1px solid var(--navy);white-space:nowrap}
.t td{padding:6px 8px;text-align:center;border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.t tbody tr:nth-child(even) td{background:var(--paper-2)}
.t td.l,.t th.l{text-align:start}
.t td.nm{text-align:start;white-space:normal;min-width:170px}
.t.dense th,.t.dense td{padding:5px 4px;font-size:12px}
.t.dense th{font-size:11px;white-space:normal}
.t.dense td.nm{min-width:150px;font-size:12.5px}
.chart-box{max-width:680px;margin:14px auto 0}
.t tbody.ft td{font-weight:700;background:var(--navy-soft)!important}
.t tbody.ft tr:first-child td{border-top:2px solid var(--navy)}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--navy-soft)}
.t .grp-row td{background:var(--navy-soft)!important;font-weight:700;text-align:start;color:var(--navy)}
.c-exc{color:var(--exc);font-weight:600} .c-mid{color:var(--mid);font-weight:600} .c-weak{color:var(--weak);font-weight:600} .c-fail{color:var(--fail);font-weight:700} .c-mut{color:var(--muted)}
.tag{display:inline-block;border-radius:5px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag.exc{background:var(--exc-soft);color:var(--exc)} .tag.mid{background:var(--mid-soft);color:var(--mid)} .tag.weak{background:var(--weak-soft);color:var(--weak)} .tag.fail{background:var(--fail-soft);color:var(--fail)} .tag.na{background:var(--paper-2);color:var(--muted);border:1px solid var(--line)}

/* أشرطة الترتيب */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) 1fr 62px;gap:10px;align-items:center;font-size:12.5px}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar .tr{height:14px;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;position:relative;overflow:hidden}
.bar .tr i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--navy-2)}
.bar .tr i.exc{background:var(--exc)} .bar .tr i.mid{background:var(--mid)} .bar .tr i.weak{background:var(--weak)} .bar .tr i.fail{background:var(--fail)}
.bar .vl{font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.bar.click{cursor:pointer} .bar.click:hover .lb{color:var(--navy-2);text-decoration:underline}
.axis{display:grid;grid-template-columns:minmax(110px,190px) 1fr 62px;gap:10px;font-size:10.5px;color:var(--muted);margin-top:2px}
.axis div{display:flex;justify-content:space-between}
/* أشرطة الفروق (موجبة/سالبة) */
.dv{display:grid;grid-template-columns:minmax(110px,190px) 1fr 62px;gap:10px;align-items:center;font-size:12.5px}
.dv .tr{height:14px;position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:3px}
.dv .tr .z{position:absolute;inset-block:-3px;inset-inline-start:50%;width:1px;background:var(--ink-2)}
.dv .tr i{position:absolute;inset-block:0}
/* شريط التكوين */
.stack{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--line);min-width:150px;background:var(--paper-2)}
.stack i{display:block;height:100%}
.stack i.exc{background:var(--exc)} .stack i.mid{background:var(--mid)} .stack i.weak{background:var(--weak)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
/* جدول حراري */
.heat td.h{font-weight:600;color:var(--ink)}
.h1{background:var(--h1)!important} .h2{background:var(--h2)!important} .h3{background:var(--h3)!important} .h4{background:var(--h4)!important} .h5{background:var(--h5)!important}
/* مخطط خطي */
.lc{width:100%;max-width:700px;height:auto;display:block;margin:0 auto}
.lc text{font-family:var(--font);fill:var(--muted);font-size:12px}
.lc .g{stroke:var(--line);stroke-width:1}
.lc .vt{fill:var(--ink);font-size:11.5px;font-weight:600}
.chart{margin:10px 0 6px;break-inside:avoid;page-break-inside:avoid}
.chart figcaption{font-size:12.5px;font-weight:700;color:var(--ink);margin:0 0 4px;text-align:center}
.ch{width:100%;max-width:760px;height:auto;display:block;margin:0 auto;overflow:visible}
.ch text{font-family:var(--font);fill:var(--muted);font-size:11px}
.ch .cl{fill:var(--ink-2);font-size:11px;font-weight:500}
.ch .cl.sm{font-size:8.5px}
.ch .vt{fill:var(--ink);font-weight:700}
.ch .iv{fill:#fff;font-size:10.5px;font-weight:700}
.ch .g{stroke:var(--line);stroke-width:1}
.ch .ax{stroke:var(--line-2);stroke-width:1.2}
.ch .tg{stroke:#b3322d;stroke-width:1.6;stroke-dasharray:6 4}
.ch .tgl{fill:#b3322d;font-size:10.5px;font-weight:700}
.ch .dc{fill:#14365d;font-size:22px;font-weight:700}
.ch .ds{fill:#5d6878;font-size:11px}
.dn{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.dsv{flex:0 0 180px;width:180px;height:180px;display:block}
.dsv text{font-family:var(--font)}
.dsv .dc{fill:var(--navy);font-size:22px;font-weight:700}
.dsv .ds{fill:var(--muted);font-size:11px}
.dn .dl{border-collapse:collapse;font-size:12.5px}
.dn .dl td{padding:4px 8px;border-bottom:1px solid var(--line)}
.dn .dl td:not(:first-child){text-align:center}
.dn .dl i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media screen and (max-width:960px){.chart-row{grid-template-columns:1fr}}
.range-form{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end}
.range-form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.range-form input,.range-form select{border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font:inherit;background:var(--paper);color:var(--ink)}
.range-form input[type=number]{width:96px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets .btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.hl{background:var(--gold)!important}

/* بطاقات الرفع */
.ws{max-width:1160px;margin:0 auto}
.ws h1{font-size:21px;color:var(--navy);margin:0 0 4px}
.ws>p{color:var(--muted);margin:0 0 18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:15px;color:var(--navy)}
.years{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ychip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:6px 6px 6px 12px;background:var(--paper);cursor:pointer;font-weight:600}
.ychip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.ychip small{font-weight:400;opacity:.8;font-size:11.5px}
.ychip .x{border:0;background:transparent;cursor:pointer;opacity:.6;padding:2px 4px;border-radius:4px}
.ychip .x:hover{opacity:1;background:rgba(0,0,0,.08)}
.addy{display:inline-flex;gap:6px}
.addy input{border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;width:130px;background:var(--paper)}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.up{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:10px}
.up.ok{border-color:var(--exc)}
.up .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.up .hd b{font-size:14.5px}
.up .hd small{display:block;color:var(--muted);font-size:12px}
.drop{display:block;border:1.5px dashed var(--line-2);border-radius:8px;padding:16px 10px;text-align:center;color:var(--muted);cursor:pointer;font-size:12.5px;background:var(--paper-2)}
.drop:hover,.drop.over{border-color:var(--navy-2);color:var(--navy-2);background:var(--navy-soft)}
.drop b{color:var(--navy-2)}
.files{display:flex;flex-direction:column;gap:4px;font-size:12px}
.files div{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--paper-2);word-break:break-all}
.up>.tag{align-self:flex-start}
.files em{display:block;font-style:normal;color:var(--muted);font-size:11.5px}
.warn{font-size:12px;color:var(--weak);background:var(--weak-soft);border-radius:6px;padding:6px 8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line-2);border-radius:8px;margin-top:18px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.search{border:1px solid var(--line-2);border-radius:8px;padding:7px 11px;min-width:280px;background:var(--paper)}
.profile{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--navy-soft);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:16px}
.profile h3{margin:0;font-size:18px;color:var(--navy)}
.profile .m{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.profile .big{text-align:center}
.profile .big .v{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.profile .big .l{font-size:12px;color:var(--muted)}
.sig{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px;font-size:12.5px;text-align:center;color:var(--ink-2)}
.sig div{border-top:1px solid var(--line-2);padding-top:6px}
.only-print{display:none}


/* تقرير اللجنة */
.to{display:grid;grid-template-columns:auto auto auto;justify-content:start;gap:4px 12px;margin-top:16px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper-2);font-size:13px}
.to span:first-child{grid-row:span 2;color:var(--muted);align-self:center}
.to span{color:var(--muted)}
.lead{font-size:13.5px;line-height:1.9;margin:14px 0 0;color:var(--ink-2)}

<script>
const CORE_SRC="// ===== القواعد والمستويات =====\nconst PASS = 50;                 // النجاح بنسبة 50% فأعلى\nconst EXC = 90, WEAK = 65;       // تصنيف المتفوقين (≥90) والضعاف (<65)؛ ما بينهما متوسط\nconst SPECIAL = /معذور|غائب|محروم/;\n\n// الباقات: نهاية الفصل تعتمد على التقييم الرئيسي من 50 درجة\nconst PKG = {\n  mid1: {label:'منتصف الفصل الأول', short:'منتصف1', long:'منتصف الفصل الأول (التقييم الرئيسي من 30)', keys:['main_m1'], max:30},\n  end1: {label:'نهاية الفصل الأول', short:'نهاية1', long:'نهاية الفصل الأول (التقييم الرئيسي من 50)', keys:['main_t1'], max:50},\n  mid2: {label:'منتصف الفصل الثاني', short:'منتصف2', long:'منتصف الفصل الثاني (التقييم الرئيسي من 30)', keys:['main_m2'], max:30},\n  end2: {label:'نهاية الفصل الثاني', short:'نهاية2', long:'نهاية الفصل الثاني (التقييم الرئيسي من 50)', keys:['main_t2'], max:50},\n  year: {label:'الدور الأول', short:'الدور الأول', long:'الدور الأول من 100 (الملف الرسمي)', keys:['fin'], max:100},\n};\nconst PKG_ORDER = ['mid1','end1','mid2','end2','year'];\nconst KEY_ORDER = ['main_m1','mid1','main_m2','mid2','main_t1','act_t1','app_t1','main_t2','act_t2','prac_t1','theo_t1','prac_t2','theo_t2'];\nconst KEY_LABEL = {fin:'الدور الأول',main_m1:'التقييم الرئيسي (منتصف1)',mid1:'منتصف1',main_m2:'التقييم الرئيسي (منتصف2)',mid2:'منتصف2',main_t1:'التقييم الرئيسي (الفصل1)',act_t1:'نشاط (الفصل1)',app_t1:'الملحق (الفصل1)',main_t2:'التقييم الرئيسي (الفصل2)',act_t2:'نشاط (الفصل2)',prac_t1:'عملي (الفصل1)',theo_t1:'نظري (الفصل1)',prac_t2:'عملي (الفصل2)',theo_t2:'نظري (الفصل2)'};\nconst KEY_MAX = {fin:100,main_m1:30,mid1:15,main_m2:30,mid2:15,main_t1:50,act_t1:50,app_t1:50,main_t2:50,act_t2:50,prac_t1:5,theo_t1:50,prac_t2:5,theo_t2:50};\n\n// ===== أدوات نصّية =====\nconst norm = s => String(s??'').replace(/[ً-ٟـ]/g,'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\\s+/g,' ').trim();\nconst normClass = s => { const m=String(s??'').match(/(\\d+)\\s*[\\/\\-]\\s*(\\d+)/); return m ? `${+m[1]}/${+m[2]}` : null; };\nconst gradeOf = c => { const m=String(c??'').match(/^\\s*(\\d+)/); return m ? +m[1] : null; };\nconst sameSubject = (a,b) => { const x=norm(a), y=norm(b); return x===y || (Math.min(x.length,y.length)>=8 && (x.startsWith(y)||y.startsWith(x))); };\nfunction cellInfo(v){ if(typeof v==='number' && isFinite(v)) return {v}; if(v==null) return null; const t=String(v).trim(); if(!t) return null; const n=Number(t); if(!isNaN(n)) return {v:n}; return {status:t}; }\nfunction fixRange(ws){ let r0=Infinity,c0=Infinity,r1=-1,c1=-1; Object.keys(ws).forEach(k=>{ if(k[0]==='!') return; const a=XLSX.utils.decode_cell(k); r0=Math.min(r0,a.r); c0=Math.min(c0,a.c); r1=Math.max(r1,a.r); c1=Math.max(c1,a.c); }); if(r1>=0) ws['!ref']=XLSX.utils.encode_range({s:{r:r0,c:c0},e:{r:r1,c:c1}}); }\nfunction majorityGrade(items){ const c={}; items.forEach(s=>{ if(s.grade!=null) c[s.grade]=(c[s.grade]||0)+1; }); const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return top ? +top[0] : null; }\n\nfunction keyOf(label, slot){\n  const t = norm(label);\n  if(t.includes('منتصف الفصل الاول')) return 'mid1';\n  if(t.includes('منتصف الفصل الثاني')) return 'mid2';\n  const sfx = {mid1:'m1', mid2:'m2', term1:'t1', term2:'t2'}[slot];\n  if(!sfx) return null;\n  if(t.startsWith('التقييم الرئيسي')) return 'main_'+sfx;\n  if(t.startsWith('نشاط الطالب'))    return 'act_'+sfx;\n  if(t.startsWith('الملحق'))         return 'app_'+sfx;\n  if(t.startsWith('الاختبار العملي')) return 'prac_'+sfx;\n  if(t.startsWith('الاختبار النظري')) return 'theo_'+sfx;\n  return null;\n}\n\n// العام الدراسي المكتوب في عنوان الملف (إن وُجد)\nfunction yearOf(rows, upto){ const t=rows.slice(0,upto).map(r=>(r||[]).map(x=>String(x??'')).join(' ')).join(' '); const m=t.match(/(20\\d{2})\\s*[-–\\/]\\s*(20\\d{2})/); return m ? `${m[1]}-${m[2]}` : null; }\n\nfunction parseSheet(rows, fileName, mtime, defSlot=null){\n  const r3 = (rows[2]||[]).map(x=>String(x??'').trim()), r3n = r3.map(norm);\n  const r4 = rows[3]||[];\n  if(!String(r4[0]??'').includes('الرقم')) return null;\n  const marks=[]; r4.forEach((h,c)=>{ if(c>=3){ const t=String(h??'').trim(); if(t) marks.push({c,t}); } });\n  if(marks.some(m=>m.t==='المجموع الكلي')) return null;\n  const has = s => r3n.some(x=>x.includes(s));\n  let slot=null;\n  if(has('منتصف الفصل الاول') && has('نهايه الفصل الاول')) slot='cons';\n  else if(has('منتصف الفصل الاول')) slot='mid1';\n  else if(has('منتصف الفصل الثاني') && !has('نهايه الفصل الثاني')) slot='mid2';\n  else if(has('نهايه الفصل الاول')) slot='term1';\n  else if(has('نهايه الفصل الثاني')) slot='term2';\n  else if(defSlot && has('التقييم الرئيسي')) slot=defSlot;   // فترة باسم آخر (مثل \"الاستعداد المدرسي\"): نعتمد بطاقة الاختبار\n  else return null;\n  const EXCL = /^(1S|الحالة|الشعبة الصفية|المجموع|المتوسط|الرقم|الاسم)$/;\n  const subjects=[];\n  marks.forEach((m,i)=>{\n    if(EXCL.test(m.t)) return;\n    const end = i+1<marks.length ? marks[i+1].c : r3.length;\n    const keyCols={};\n    for(let c=m.c;c<end;c++){ const k=keyOf(r3[c],slot); if(k && !(k in keyCols)) keyCols[k]=c; }\n    if(Object.keys(keyCols).length) subjects.push({label:m.t, keyCols});\n  });\n  if(!subjects.length) return null;\n  const students=[];\n  for(let r=4;r<rows.length;r++){\n    const row=rows[r]||[];\n    const id=String(row[0]??'').trim();\n    if(!/^\\d{5,}$/.test(id)) continue;\n    const cls=String(row[2]??'').trim();\n    const subj={};\n    subjects.forEach(S=>{\n      const comps={}; Object.entries(S.keyCols).forEach(([k,c])=>comps[k]=cellInfo(row[c]));\n      subj[S.label]={keys:Object.keys(S.keyCols), comps};\n    });\n    students.push({id, name:String(row[1]??'').trim(), cls, grade:gradeOf(cls), subj});\n  }\n  if(!students.length) return null;\n  return {file:fileName, mtime, slot, grade:majorityGrade(students), students, subjects:subjects.map(S=>S.label), layout:'combined', year:yearOf(rows,3), slotFromCard: !['mid1','mid2','term1','term2','cons'].includes(slot)||(defSlot===slot && !has(slot==='mid1'?'منتصف الفصل الاول':slot==='mid2'?'منتصف الفصل الثاني':slot==='term1'?'نهايه الفصل الاول':'نهايه الفصل الثاني'))};\n}\n\n// ===== شكل \"مادة لكل ورقة\" =====\n// العنوان: \"المادة:… - الفترة:…\" ثم صف رؤوس فيه الرقم والاسم والشعبة ومكوّنات التقييم\nconst COMP_RE = /^(التقييم الرئيسي|نشاط الطالب|الملحق|الاختبار العملي|الاختبار النظري)/;\nfunction periodSlot(text){\n  const t=norm(text);\n  const isMid=/منتصف/.test(t), isEnd=/نهايه/.test(t);\n  if(!isMid && !isEnd) return null;\n  const second=/الثاني|\\b2\\b|٢/.test(t), first=/الاول|\\b1\\b|١/.test(t);\n  if(!second && !first) return null;\n  return (isMid?'mid':'term') + (second?'2':'1');\n}\n// صف العناوين: فيه خانة \"الرقم\" وخانة \"الاسم\" (في أي عمود)\nfunction findHeader(rows){\n  for(let r=0;r<Math.min(rows.length,20);r++){\n    const row=(rows[r]||[]).map(norm);\n    let idCol=row.findIndex(x=>x==='الرقم'||x==='الرقم الشخصي'||x==='رقم الطالب'||x==='الرقم الوطني');\n    if(idCol<0) idCol=row.findIndex(x=>x.includes('الرقم'));\n    const nameCol=row.findIndex(x=>x==='الاسم'||x.startsWith('اسم الطالب')||x==='اسم');\n    if(idCol>=0 && nameCol>=0) return {r, idCol, nameCol};\n  }\n  return null;\n}\nfunction isSubjectSheet(rows){\n  const H=findHeader(rows); if(!H) return false;\n  return (rows[H.r]||[]).some(x=>COMP_RE.test(norm(x)) || periodSlot(x));\n}\nfunction parseSubjectSheet(rows, sheetName, fileName, mtime, why=[], defSlot=null){\n  const H=findHeader(rows); if(!H){ why.push('لا يوجد صف عناوين فيه \"الرقم\" و\"الاسم\"'); return null; }\n  const h=H.r, head=(rows[h]||[]).map(x=>String(x??'').trim());\n  const top=rows.slice(0,h).map(r=>(r||[]).map(x=>String(x??'')).join(' ')).join(' \\n ');\n  let subject=null, slot=null;\n  const m=top.match(/الماد[ةه]\\s*[:：]\\s*(.+?)\\s*(?:-\\s*الفتر|\\n|$)/); if(m) subject=m[1].trim();\n  const p=top.match(/الفتر[ةه]\\s*[:：]\\s*([^\\n]+)/); if(p) slot=periodSlot(p[1]);\n  if(!slot) for(const x of head){ const s2=periodSlot(x); if(s2 && s2.startsWith('term')) slot=s2; }\n  if(!slot) for(const x of head){ const s2=periodSlot(x); if(s2) slot=s2; }\n  if(!slot) slot=periodSlot(top);\n  if(!slot && defSlot) slot=defSlot;   // الفترة غير مكتوبة: نعتمد بطاقة الاختبار التي رُفع فيها الملف\n  if(!subject && sheetName && !/^sheet\\s*\\d*$/i.test(sheetName.trim())) subject=sheetName.trim();\n  if(!slot){ why.push(`لم تُحدَّد الفترة (منتصف/نهاية الفصل) في ورقة \"${sheetName}\"${p?` — المكتوب: \"${p[1].trim()}\"`:''}`); return null; }\n  if(!subject){ why.push(`لم يُحدَّد اسم المادة في ورقة \"${sheetName}\"`); return null; }\n  const nameCol=H.nameCol, idCol=H.idCol;\n  let clsCol=head.findIndex(x=>norm(x).startsWith('الشعبه')||norm(x)==='الصف');\n  const keyCols={};\n  head.forEach((x,c)=>{ if(c===idCol||c===nameCol||c===clsCol) return; const k=keyOf(x,slot); if(k && !(k in keyCols)) keyCols[k]=c; });\n  if(!Object.keys(keyCols).some(k=>/^(main|theo)_/.test(k))){ why.push(`لا يوجد عمود \"التقييم الرئيسي\" في ورقة \"${sheetName}\" — الأعمدة: ${head.filter(Boolean).join('، ')}`); return null; }\n  const students=[];\n  for(let r=h+1;r<rows.length;r++){\n    const row=rows[r]||[]; const id=String(row[idCol]??'').trim();\n    if(!/^\\d{5,}$/.test(id)) continue;\n    const cls=clsCol>=0 ? String(row[clsCol]??'').trim() : '';\n    const comps={}; Object.entries(keyCols).forEach(([k,c])=>comps[k]=cellInfo(row[c]));\n    students.push({id, name:String(row[nameCol]??'').trim(), cls, grade:gradeOf(cls), subj:{[subject]:{keys:Object.keys(keyCols), comps}}});\n  }\n  if(!students.length){ why.push(`ورقة \"${sheetName}\" لا تحتوي صفوف طلاب (رقم شخصي) تحت العناوين`); return null; }\n  return {file:fileName, mtime, slot, grade:majorityGrade(students), students, subjects:[subject], layout:'subject', year:yearOf(rows,h)};\n}\n// دمج أوراق المواد المنفصلة من نفس الملف في نتيجة واحدة لكل (اختبار + صف)\nfunction mergeParsed(list){\n  const by=new Map(), idx=new Map();\n  for(const p of list){\n    const k=p.slot+'|'+p.grade;\n    let m=by.get(k);\n    if(!m){ m={file:p.file, mtime:p.mtime, slot:p.slot, grade:p.grade, students:[], subjects:[], layout:p.layout, year:p.year}; by.set(k,m); idx.set(k,new Map()); }\n    const ix=idx.get(k);\n    for(const s of p.students){\n      let t=ix.get(s.id);\n      if(!t){ t={id:s.id, name:s.name, cls:s.cls, grade:s.grade, subj:{}}; ix.set(s.id,t); m.students.push(t); }\n      Object.assign(t.subj, s.subj);\n    }\n    m.subjects.push(...p.subjects); m.mtime=Math.max(m.mtime,p.mtime);\n  }\n  return [...by.values()];\n}\n// قراءة مصنّف كامل بأي شكل: شيت مجمّع، أو مادة لكل ورقة، أو قائمة معلمين\nfunction parseWorkbook(wb, fileName, mtime, defSlot=null){\n  const out={sheets:[], teachers:[], ignored:[], why:[]}, bySubject=[];\n  for(const name of wb.SheetNames){\n    const ws=wb.Sheets[name]; fixRange(ws);\n    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});\n    if(!rows.some(r=>(r||[]).some(x=>x!=null&&String(x).trim()!==''))){ out.ignored.push(name); continue; }\n    if(isTeacherSheet(rows)){ out.teachers.push(...parseTeachers(rows)); continue; }\n    if(isFinalSheet(rows)){ const p=parseFinal(rows,fileName,mtime,out.why); if(p) out.sheets.push(p); else out.ignored.push(name); continue; }\n    if(isSubjectSheet(rows)){ const p=parseSubjectSheet(rows,name,fileName,mtime,out.why,defSlot); if(p) bySubject.push(p); else out.ignored.push(name); continue; }\n    const p=parseSheet(rows,fileName,mtime,defSlot);\n    if(p){ out.sheets.push(p); continue; }\n    out.ignored.push(name);\n    // لم يُتعرّف على الورقة: نحاول شرح السبب\n    const H=findHeader(rows);\n    if(!H) out.why.push(`ورقة \"${name}\": لا يوجد صف عناوين فيه \"الرقم\" و\"الاسم\". أول سطر: ${(rows.find(r=>(r||[]).some(x=>x!=null&&String(x).trim()))||[]).filter(x=>x!=null&&String(x).trim()).slice(0,6).join(' | ')}`);\n    else { const head=(rows[H.r]||[]).filter(x=>x!=null&&String(x).trim()); out.why.push(`ورقة \"${name}\": صف العناوين لا يحتوي \"التقييم الرئيسي\" ولا فترة اختبار — الأعمدة: ${head.slice(0,12).join('، ')}`); }\n  }\n  out.sheets.push(...mergeParsed(bySubject));\n  return out;\n}\n\n// ===== ملف الدور الأول الرسمي =====\n// صف العناوين: الرقم، الاسم، الشعبة، ثم عمود لكل مادة (1S) وأسماء المواد في الصف الذي فوقه، ثم المجموع الكلي والمتوسط والحالة\nfunction isFinalSheet(rows){\n  const H=findHeader(rows); if(!H) return false;\n  const head=(rows[H.r]||[]).map(x=>norm(x)), above=(rows[H.r-1]||[]).map(x=>norm(x));\n  if(above.some(x=>COMP_RE.test(x)||periodSlot(x))) return false;   // صف فوقه مكوّنات تقييم = شيت رصد وليس نتيجة نهائية\n  return head.some(x=>x==='المجموع الكلي') || head.filter(x=>/^1s$/i.test(x)).length>=2;\n}\nfunction parseFinal(rows, fileName, mtime, why=[]){\n  const H=findHeader(rows); if(!H) return null;\n  const h=H.r, hn=(rows[h]||[]).map(x=>norm(x)), above=(rows[h-1]||[]).map(x=>String(x??'').trim());\n  const totC=hn.findIndex(x=>x==='المجموع الكلي'), avgC=hn.findIndex(x=>x==='المتوسط'), stC=hn.findIndex(x=>x==='الحاله'||x==='النتيجه');\n  const clsC=hn.findIndex(x=>x.startsWith('الشعبه'));\n  const stop=[totC,avgC,stC].filter(c=>c>=0).reduce((a,b)=>Math.min(a,b), hn.length);\n  const cols=[]; for(let c=Math.max(H.idCol,H.nameCol,clsC)+1;c<stop;c++){ const l=above[c]; if(l) cols.push({c,l}); }\n  if(!cols.length){ why.push('ملف الدور الأول: لم توجد أسماء المواد فوق أعمدة الدرجات'); return null; }\n  const top=rows.slice(0,h).map(r=>(r||[]).map(x=>String(x??'')).join(' ')).join(' ');\n  const students=[];\n  for(let r=h+1;r<rows.length;r++){\n    const row=rows[r]||[], id=String(row[H.idCol]??'').trim();\n    if(!/^\\d{5,}$/.test(id)) continue;\n    const cls=clsC>=0?String(row[clsC]??'').trim():'';\n    const subj={}; cols.forEach(x=>{ subj[x.l]={keys:['fin'], comps:{fin:cellInfo(row[x.c])}}; });\n    const num=c=>{ if(c<0) return null; const v=cellInfo(row[c]); return v&&'v' in v ? v.v : null; };\n    students.push({id, name:String(row[H.nameCol]??'').trim(), cls, grade:gradeOf(cls), subj,\n      final:{total:num(totC), avg:num(avgC), status:stC>=0?String(row[stC]??'').trim():''}});\n  }\n  if(!students.length){ why.push('ملف الدور الأول لا يحتوي صفوف طلاب'); return null; }\n  return {file:fileName, mtime, slot:'final', grade:majorityGrade(students), students, subjects:cols.map(x=>x.l), layout:'final', year:yearOf(rows,h), round:/الدور الثاني/.test(norm(top))?2:1};\n}\n\nfunction isTeacherSheet(rows){ const head=(rows[0]||[]).map(norm); return head.some(h=>h.includes('ماده')) && head.some(h=>h.includes('اسم المعلم')); }\nfunction parseTeachers(rows){\n  const out=[];\n  rows.slice(1).forEach(r=>{\n    const subject=String(r[0]??'').trim(), cls=normClass(r[1]), name=String(r[2]??'').trim();\n    if(subject && cls && name) out.push({subject, cls, name, email:String(r[3]??'').trim()});\n  });\n  return out;\n}\n\n// ===== تحليل البيانات (per year) =====\nfunction analyze(parsedSheets, teacherRowsByPkg){\n  const newest = {};\n  parsedSheets.forEach(p=>{ const k=p.grade+'|'+p.slot+'|'+(p.subjects||[]).map(norm).sort().join(','); if(!newest[k] || p.mtime>newest[k].mtime) newest[k]=p; });\n  const kept = Object.values(newest).sort((a,b)=>(a.slot==='cons'?0:1)-(b.slot==='cons'?0:1) || a.mtime-b.mtime);\n  const subjects=[];\n  const canon = label => { let c=subjects.find(x=>sameSubject(x,label)); if(!c){ subjects.push(label); c=label; } return c; };\n  const people = new Map();\n  kept.forEach(sheet=>{\n    sheet.students.forEach(st=>{\n      let P=people.get(st.id);\n      if(!P){ P={id:st.id,name:st.name,cls:st.cls,grade:st.grade,subj:{}}; people.set(st.id,P); }\n      P.name=st.name||P.name; P.cls=st.cls||P.cls; P.grade=st.grade??P.grade;\n      if(st.final) P.final=st.final;   // المجموع والمتوسط والحالة كما في ملف الدور الأول\n      Object.entries(st.subj).forEach(([label,rec])=>{\n        const c=canon(label);\n        const R = P.subj[c] = P.subj[c] || {keys:new Set(), comps:{}};\n        rec.keys.forEach(k=>R.keys.add(k));\n        Object.entries(rec.comps).forEach(([k,v])=>{ if(v!=null) R.comps[k]=v; else if(!(k in R.comps)) R.comps[k]=null; });\n      });\n    });\n  });\n  const students=[...people.values()];\n  students.forEach(P=>Object.values(P.subj).forEach(R=>{ R.pkg={}; PKG_ORDER.forEach(pk=>{ R.pkg[pk]=pkgCalc(R,pk); }); }));\n  const teachersByPkg = {};\n  Object.entries(teacherRowsByPkg).forEach(([pk,rows])=>{\n    const seen=new Set(), list=[];\n    rows.forEach(t=>{\n      const k=t.subject+'|'+t.cls+'|'+t.name; if(seen.has(k)) return; seen.add(k);\n      list.push({...t, subjectKey: subjects.find(x=>sameSubject(x,t.subject))||null});\n    });\n    teachersByPkg[pk]=list;\n  });\n  const availPkgs = PKG_ORDER.filter(pk=>students.some(P=>Object.values(P.subj).some(R=>R.pkg[pk])));\n  const displayKeys = KEY_ORDER.filter(k=>students.some(P=>Object.values(P.subj).some(R=>R.keys.has(k))));\n  const grades=[...new Set(students.map(s=>s.grade).filter(g=>g!=null))].sort((a,b)=>a-b);\n  const classes=[...new Set(students.map(s=>s.cls).filter(c=>c))].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));\n  const sources = kept.map(s=>({grade:s.grade, slot:s.slot, file:s.file}));\n  return {students, subjects, teachersByPkg, grades, classes, sources, displayKeys, availPkgs};\n}\n\n// التقييم الرئيسي للمادة: main_t1 إن وُجد، وإلا theo_t1 (العلوم تستخدم النظري من 50 بدلاً من التقييم الرئيسي)\n\n// المفتاح المعتمد لكل اختبار: التقييم الرئيسي، وإن لم يوجد (العلوم في نهاية الفصل) فالاختبار النظري\nconst PK_SFX = {mid1:'m1', end1:'t1', mid2:'m2', end2:'t2'};\nfunction mainKey(R, pk){ const x=PK_SFX[pk]; if(!x) return null; return R.keys.has('main_'+x) ? 'main_'+x : (R.keys.has('theo_'+x) ? 'theo_'+x : null); }\nfunction pkgCalc(R, pk){\n  const d=PKG[pk];\n  let keys;\n  if(pk==='year'){ keys = R.keys.has('fin') ? ['fin'] : null; }   // الدور الأول من الملف الرسمي فقط، دون حساب\n  else { const k=mainKey(R,pk); keys = k ? [k] : null; }\n  if(!keys) return null;\n  const cells = keys.map(k=>R.comps[k]);\n  const special = cells.map(c=>c&&c.status).find(s=>s&&SPECIAL.test(s)) || null;\n  let total=null;\n  if(cells.every(c=>c&&'v' in c)) total = cells.reduce((a,c)=>a+c.v,0);\n  const req=null;\n  const counted = !special && total!=null;\n  const pct = total!=null ? total/d.max*100 : null;\n  return {special, total, max:d.max, pct, counted, pass: counted ? pct>=PASS : null, req, keysUsed:keys};\n}\n\n";

const sameSubject = (a,b) => { const x=norm(a), y=norm(b); return x===y || (Math.min(x.length,y.length)>=8 && (x.startsWith(y)||y.startsWith(x))); };
function cellInfo(v){ if(typeof v==='number' && isFinite(v)) return {v}; if(v==null) return null; const t=String(v).trim(); if(!t) return null; const n=Number(t); if(!isNaN(n)) return {v:n}; return {status:t}; }
function fixRange(ws){ let r0=Infinity,c0=Infinity,r1=-1,c1=-1; Object.keys(ws).forEach(k=>{ if(k[0]==='!') return; const a=XLSX.utils.decode_cell(k); r0=Math.min(r0,a.r); c0=Math.min(c0,a.c); r1=Math.max(r1,a.r); c1=Math.max(c1,a.c); }); if(r1>=0) ws['!ref']=XLSX.utils.encode_range({s:{r:r0,c:c0},e:{r:r1,c:c1}}); }
function majorityGrade(items){ const c={}; items.forEach(s=>{ if(s.grade!=null) c[s.grade]=(c[s.grade]||0)+1; }); const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return top ? +top[0] : null; }

function keyOf(label, slot){
  const t = norm(label);
  if(t.includes('منتصف الفصل الاول')) return 'mid1';
  if(t.includes('منتصف الفصل الثاني')) return 'mid2';
  const sfx = {mid1:'m1', mid2:'m2', term1:'t1', term2:'t2'}[slot];
  if(!sfx) return null;
  if(t.startsWith('التقييم الرئيسي')) return 'main_'+sfx;
  if(t.startsWith('نشاط الطالب'))    return 'act_'+sfx;
  if(t.startsWith('الملحق'))         return 'app_'+sfx;
  if(t.startsWith('الاختبار العملي')) return 'prac_'+sfx;
  if(t.startsWith('الاختبار النظري')) return 'theo_'+sfx;
  return null;
}

// العام الدراسي المكتوب في عنوان الملف (إن وُجد)
function yearOf(rows, upto){ const t=rows.slice(0,upto).map(r=>(r||[]).map(x=>String(x??'')).join(' ')).join(' '); const m=t.match(/(20\d{2})\s*[-–\/]\s*(20\d{2})/); return m ? `${m[1]}-${m[2]}` : null; }

function parseSheet(rows, fileName, mtime, defSlot=null){
  const r3 = (rows[2]||[]).map(x=>String(x??'').trim()), r3n = r3.map(norm);
  const r4 = rows[3]||[];
  if(!String(r4[0]??'').includes('الرقم')) return null;
  const marks=[]; r4.forEach((h,c)=>{ if(c>=3){ const t=String(h??'').trim(); if(t) marks.push({c,t}); } });
  if(marks.some(m=>m.t==='المجموع الكلي')) return null;
  const has = s => r3n.some(x=>x.includes(s));
  let slot=null;
  if(has('منتصف الفصل الاول') && has('نهايه الفصل الاول')) slot='cons';
  else if(has('منتصف الفصل الاول')) slot='mid1';
  else if(has('منتصف الفصل الثاني') && !has('نهايه الفصل الثاني')) slot='mid2';
  else if(has('نهايه الفصل الاول')) slot='term1';
  else if(has('نهايه الفصل الثاني')) slot='term2';
  else if(defSlot && has('التقييم الرئيسي')) slot=defSlot;   // فترة باسم آخر (مثل "الاستعداد المدرسي"): نعتمد بطاقة الاختبار
  else return null;
  const EXCL = /^(1S|الحالة|الشعبة الصفية|المجموع|المتوسط|الرقم|الاسم)$/;
  const subjects=[];
  marks.forEach((m,i)=>{
    if(EXCL.test(m.t)) return;
    const end = i+1<marks.length ? marks[i+1].c : r3.length;
    const keyCols={};
    for(let c=m.c;c<end;c++){ const k=keyOf(r3[c],slot); if(k && !(k in keyCols)) keyCols[k]=c; }
    if(Object.keys(keyCols).length) subjects.push({label:m.t, keyCols});
  });
  if(!subjects.length) return null;
  const students=[];
  for(let r=4;r<rows.length;r++){
    const row=rows[r]||[];
    const id=String(row[0]??'').trim();
    if(!/^\d{5,}$/.test(id)) continue;
    const cls=String(row[2]??'').trim();
    const subj={};
    subjects.forEach(S=>{
      const comps={}; Object.entries(S.keyCols).forEach(([k,c])=>comps[k]=cellInfo(row[c]));
      subj[S.label]={keys:Object.keys(S.keyCols), comps};
    });
    students.push({id, name:String(row[1]??'').trim(), cls, grade:gradeOf(cls), subj});
  }
  if(!students.length) return null;
  return {file:fileName, mtime, slot, grade:majorityGrade(students), students, subjects:subjects.map(S=>S.label), layout:'combined', year:yearOf(rows,3), slotFromCard: !['mid1','mid2','term1','term2','cons'].includes(slot)||(defSlot===slot && !has(slot==='mid1'?'منتصف الفصل الاول':slot==='mid2'?'منتصف الفصل الثاني':slot==='term1'?'نهايه الفصل الاول':'نهايه الفصل الثاني'))};
}

// ===== شكل "مادة لكل ورقة" =====
// العنوان: "المادة:… - الفترة:…" ثم صف رؤوس فيه الرقم والاسم والشعبة ومكوّنات التقييم
const COMP_RE = /^(التقييم الرئيسي|نشاط الطالب|الملحق|الاختبار العملي|الاختبار النظري)/;
function periodSlot(text){
  const t=norm(text);
  const isMid=/منتصف/.test(t), isEnd=/نهايه/.test(t);
  if(!isMid && !isEnd) return null;
  const second=/الثاني|\b2\b|٢/.test(t), first=/الاول|\b1\b|١/.test(t);
  if(!second && !first) return null;
  return (isMid?'mid':'term') + (second?'2':'1');
}
// صف العناوين: فيه خانة "الرقم" وخانة "الاسم" (في أي عمود)
function findHeader(rows){
  for(let r=0;r<Math.min(rows.length,20);r++){
    const row=(rows[r]||[]).map(norm);
    let idCol=row.findIndex(x=>x==='الرقم'||x==='الرقم الشخصي'||x==='رقم الطالب'||x==='الرقم الوطني');
    if(idCol<0) idCol=row.findIndex(x=>x.includes('الرقم'));
    const nameCol=row.findIndex(x=>x==='الاسم'||x.startsWith('اسم الطالب')||x==='اسم');
    if(idCol>=0 && nameCol>=0) return {r, idCol, nameCol};
  }
  return null;
}
function isSubjectSheet(rows){
  const H=findHeader(rows); if(!H) return false;
  return (rows[H.r]||[]).some(x=>COMP_RE.test(norm(x)) || periodSlot(x));
}
function parseSubjectSheet(rows, sheetName, fileName, mtime, why=[], defSlot=null){
  const H=findHeader(rows); if(!H){ why.push('لا يوجد صف عناوين فيه "الرقم" و"الاسم"'); return null; }
  const h=H.r, head=(rows[h]||[]).map(x=>String(x??'').trim());
  const top=rows.slice(0,h).map(r=>(r||[]).map(x=>String(x??'')).join(' ')).join(' \n ');
  let subject=null, slot=null;
  const m=top.match(/الماد[ةه]\s*[:：]\s*(.+?)\s*(?:-\s*الفتر|\n|$)/); if(m) subject=m[1].trim();
  const p=top.match(/الفتر[ةه]\s*[:：]\s*([^\n]+)/); if(p) slot=periodSlot(p[1]);
  if(!slot) for(const x of head){ const s2=periodSlot(x); if(s2 && s2.startsWith('term')) slot=s2; }
  if(!slot) for(const x of head){ const s2=periodSlot(x); if(s2) slot=s2; }
  if(!slot) slot=periodSlot(top);
  if(!slot && defSlot) slot=defSlot;   // الفترة غير مكتوبة: نعتمد بطاقة الاختبار التي رُفع فيها الملف
  if(!subject && sheetName && !/^sheet\s*\d*$/i.test(sheetName.trim())) subject=sheetName.trim();
  if(!slot){ why.push(`لم تُحدَّد الفترة (منتصف/نهاية الفصل) في ورقة "${sheetName}"${p?` — المكتوب: "${p[1].trim()}"`:''}`); return null; }
  if(!subject){ why.push(`لم يُحدَّد اسم المادة في ورقة "${sheetName}"`); return null; }
  const nameCol=H.nameCol, idCol=H.idCol;
  let clsCol=head.findIndex(x=>norm(x).startsWith('الشعبه')||norm(x)==='الصف');
  const keyCols={};
  head.forEach((x,c)=>{ if(c===idCol||c===nameCol||c===clsCol) return; const k=keyOf(x,slot); if(k && !(k in keyCols)) keyCols[k]=c; });
  if(!Object.keys(keyCols).some(k=>/^(main|theo)_/.test(k))){ why.push(`لا يوجد عمود "التقييم الرئيسي" في ورقة "${sheetName}" — الأعمدة: ${head.filter(Boolean).join('، ')}`); return null; }
  const students=[];
  for(let r=h+1;r<rows.length;r++){
    const row=rows[r]||[]; const id=String(row[idCol]??'').trim();
    if(!/^\d{5,}$/.test(id)) continue;
    const cls=clsCol>=0 ? String(row[clsCol]??'').trim() : '';
    const comps={}; Object.entries(keyCols).forEach(([k,c])=>comps[k]=cellInfo(row[c]));
    students.push({id, name:String(row[nameCol]??'').trim(), cls, grade:gradeOf(cls), subj:{[subject]:{keys:Object.keys(keyCols), comps}}});
  }
  if(!students.length){ why.push(`ورقة "${sheetName}" لا تحتوي صفوف طلاب (رقم شخصي) تحت العناوين`); return null; }
  return {file:fileName, mtime, slot, grade:majorityGrade(students), students, subjects:[subject], layout:'subject', year:yearOf(rows,h)};
}
// دمج أوراق المواد المنفصلة من نفس الملف في نتيجة واحدة لكل (اختبار + صف)
function mergeParsed(list){
  const by=new Map(), idx=new Map();
  for(const p of list){
    const k=p.slot+'|'+p.grade;
    let m=by.get(k);
    if(!m){ m={file:p.file, mtime:p.mtime, slot:p.slot, grade:p.grade, students:[], subjects:[], layout:p.layout, year:p.year}; by.set(k,m); idx.set(k,new Map()); }
    const ix=idx.get(k);
    for(const s of p.students){
      let t=ix.get(s.id);
      if(!t){ t={id:s.id, name:s.name, cls:s.cls, grade:s.grade, subj:{}}; ix.set(s.id,t); m.students.push(t); }
      Object.assign(t.subj, s.subj);
    }
    m.subjects.push(...p.subjects); m.mtime=Math.max(m.mtime,p.mtime);
  }
  return [...by.values()];
}
// قراءة مصنّف كامل بأي شكل: شيت مجمّع، أو مادة لكل ورقة، أو قائمة معلمين
function parseWorkbook(wb, fileName, mtime, defSlot=null){
  const out={sheets:[], teachers:[], ignored:[], why:[]}, bySubject=[];
  for(const name of wb.SheetNames){
    const ws=wb.Sheets[name]; fixRange(ws);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
    if(!rows.some(r=>(r||[]).some(x=>x!=null&&String(x).trim()!==''))){ out.ignored.push(name); continue; }
    if(isTeacherSheet(rows)){ out.teachers.push(...parseTeachers(rows)); continue; }
    if(isFinalSheet(rows)){ const p=parseFinal(rows,fileName,mtime,out.why); if(p) out.sheets.push(p); else out.ignored.push(name); continue; }
    if(isSubjectSheet(rows)){ const p=parseSubjectSheet(rows,name,fileName,mtime,out.why,defSlot); if(p) bySubject.push(p); else out.ignored.push(name); continue; }
    const p=parseSheet(rows,fileName,mtime,defSlot);
    if(p){ out.sheets.push(p); continue; }
    out.ignored.push(name);
    // لم يُتعرّف على الورقة: نحاول شرح السبب
    const H=findHeader(rows);
    if(!H) out.why.push(`ورقة "${name}": لا يوجد صف عناوين فيه "الرقم" و"الاسم". أول سطر: ${(rows.find(r=>(r||[]).some(x=>x!=null&&String(x).trim()))||[]).filter(x=>x!=null&&String(x).trim()).slice(0,6).join(' | ')}`);
    else { const head=(rows[H.r]||[]).filter(x=>x!=null&&String(x).trim()); out.why.push(`ورقة "${name}": صف العناوين لا يحتوي "التقييم الرئيسي" ولا فترة اختبار — الأعمدة: ${head.slice(0,12).join('، ')}`); }
  }
  out.sheets.push(...mergeParsed(bySubject));
  return out;
}

// ===== ملف الدور الأول الرسمي =====
// صف العناوين: الرقم، الاسم، الشعبة، ثم عمود لكل مادة (1S) وأسماء المواد في الصف الذي فوقه، ثم المجموع الكلي والمتوسط والحالة
function isFinalSheet(rows){
  const H=findHeader(rows); if(!H) return false;
  const head=(rows[H.r]||[]).map(x=>norm(x)), above=(rows[H.r-1]||[]).map(x=>norm(x));
  if(above.some(x=>COMP_RE.test(x)||periodSlot(x))) return false;   // صف فوقه مكوّنات تقييم = شيت رصد وليس نتيجة نهائية
  return head.some(x=>x==='المجموع الكلي') || head.filter(x=>/^1s$/i.test(x)).length>=2;
}
function parseFinal(rows, fileName, mtime, why=[]){
  const H=findHeader(rows); if(!H) return null;
  const h=H.r, hn=(rows[h]||[]).map(x=>norm(x)), above=(rows[h-1]||[]).map(x=>String(x??'').trim());
  const totC=hn.findIndex(x=>x==='المجموع الكلي'), avgC=hn.findIndex(x=>x==='المتوسط'), stC=hn.findIndex(x=>x==='الحاله'||x==='النتيجه');
  const clsC=hn.findIndex(x=>x.startsWith('الشعبه'));
  const stop=[totC,avgC,stC].filter(c=>c>=0).reduce((a,b)=>Math.min(a,b), hn.length);
  const cols=[]; for(let c=Math.max(H.idCol,H.nameCol,clsC)+1;c<stop;c++){ const l=above[c]; if(l) cols.push({c,l}); }
  if(!cols.length){ why.push('ملف الدور الأول: لم توجد أسماء المواد فوق أعمدة الدرجات'); return null; }
  const top=rows.slice(0,h).map(r=>(r||[]).map(x=>String(x??'')).join(' ')).join(' ');
  const students=[];
  for(let r=h+1;r<rows.length;r++){
    const row=rows[r]||[], id=String(row[H.idCol]??'').trim();
    if(!/^\d{5,}$/.test(id)) continue;
    const cls=clsC>=0?String(row[clsC]??'').trim():'';
    const subj={}; cols.forEach(x=>{ subj[x.l]={keys:['fin'], comps:{fin:cellInfo(row[x.c])}}; });
    const num=c=>{ if(c<0) return null; const v=cellInfo(row[c]); return v&&'v' in v ? v.v : null; };
    students.push({id, name:String(row[H.nameCol]??'').trim(), cls, grade:gradeOf(cls), subj,
      final:{total:num(totC), avg:num(avgC), status:stC>=0?String(row[stC]??'').trim():''}});
  }
  if(!students.length){ why.push('ملف الدور الأول لا يحتوي صفوف طلاب'); return null; }
  return {file:fileName, mtime, slot:'final', grade:majorityGrade(students), students, subjects:cols.map(x=>x.l), layout:'final', year:yearOf(rows,h), round:/الدور الثاني/.test(norm(top))?2:1};
}

function isTeacherSheet(rows){ const head=(rows[0]||[]).map(norm); return head.some(h=>h.includes('ماده')) && head.some(h=>h.includes('اسم المعلم')); }
function parseTeachers(rows){
  const out=[];
  rows.slice(1).forEach(r=>{
    const subject=String(r[0]??'').trim(), cls=normClass(r[1]), name=String(r[2]??'').trim();
    if(subject && cls && name) out.push({subject, cls, name, email:String(r[3]??'').trim()});
  });
  return out;
}

// ===== تحليل البيانات (per year) =====
function analyze(parsedSheets, teacherRowsByPkg){
  const newest = {};
  parsedSheets.forEach(p=>{ const k=p.grade+'|'+p.slot+'|'+(p.subjects||[]).map(norm).sort().join(','); if(!newest[k] || p.mtime>newest[k].mtime) newest[k]=p; });
  const kept = Object.values(newest).sort((a,b)=>(a.slot==='cons'?0:1)-(b.slot==='cons'?0:1) || a.mtime-b.mtime);
  const subjects=[];
  const canon = label => { let c=subjects.find(x=>sameSubject(x,label)); if(!c){ subjects.push(label); c=label; } return c; };
  const people = new Map();
  kept.forEach(sheet=>{
    sheet.students.forEach(st=>{
      let P=people.get(st.id);
      if(!P){ P={id:st.id,name:st.name,cls:st.cls,grade:st.grade,subj:{}}; people.set(st.id,P); }
      P.name=st.name||P.name; P.cls=st.cls||P.cls; P.grade=st.grade??P.grade;
      if(st.final) P.final=st.final;   // المجموع والمتوسط والحالة كما في ملف الدور الأول
      Object.entries(st.subj).forEach(([label,rec])=>{
        const c=canon(label);
        const R = P.subj[c] = P.subj[c] || {keys:new Set(), comps:{}};
        rec.keys.forEach(k=>R.keys.add(k));
        Object.entries(rec.comps).forEach(([k,v])=>{ if(v!=null) R.comps[k]=v; else if(!(k in R.comps)) R.comps[k]=null; });
      });
    });
  });
  const students=[...people.values()];
  students.forEach(P=>Object.values(P.subj).forEach(R=>{ R.pkg={}; PKG_ORDER.forEach(pk=>{ R.pkg[pk]=pkgCalc(R,pk); }); }));
  const teachersByPkg = {};
  Object.entries(teacherRowsByPkg).forEach(([pk,rows])=>{
    const seen=new Set(), list=[];
    rows.forEach(t=>{
      const k=t.subject+'|'+t.cls+'|'+t.name; if(seen.has(k)) return; seen.add(k);
      list.push({...t, subjectKey: subjects.find(x=>sameSubject(x,t.subject))||null});
    });
    teachersByPkg[pk]=list;
  });
  const availPkgs = PKG_ORDER.filter(pk=>students.some(P=>Object.values(P.subj).some(R=>R.pkg[pk])));
  const displayKeys = KEY_ORDER.filter(k=>students.some(P=>Object.values(P.subj).some(R=>R.keys.has(k))));
  const grades=[...new Set(students.map(s=>s.grade).filter(g=>g!=null))].sort((a,b)=>a-b);
  const classes=[...new Set(students.map(s=>s.cls).filter(c=>c))].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));
  const sources = kept.map(s=>({grade:s.grade, slot:s.slot, file:s.file}));
  return {students, subjects, teachersByPkg, grades, classes, sources, displayKeys, availPkgs};
}

// التقييم الرئيسي للمادة: main_t1 إن وُجد، وإلا theo_t1 (العلوم تستخدم النظري من 50 بدلاً من التقييم الرئيسي)

// المفتاح المعتمد لكل اختبار: التقييم الرئيسي، وإن لم يوجد (العلوم في نهاية الفصل) فالاختبار النظري
const PK_SFX = {mid1:'m1', end1:'t1', mid2:'m2', end2:'t2'};
function mainKey(R, pk){ const x=PK_SFX[pk]; if(!x) return null; return R.keys.has('main_'+x) ? 'main_'+x : (R.keys.has('theo_'+x) ? 'theo_'+x : null); }
function pkgCalc(R, pk){
  const d=PKG[pk];
  let keys;
  if(pk==='year'){ keys = R.keys.has('fin') ? ['fin'] : null; }   // الدور الأول من الملف الرسمي فقط، دون حساب
  else { const k=mainKey(R,pk); keys = k ? [k] : null; }
  if(!keys) return null;
  const cells = keys.map(k=>R.comps[k]);
  const special = cells.map(c=>c&&c.status).find(s=>s&&SPECIAL.test(s)) || null;
  let total=null;
  if(cells.every(c=>c&&'v' in c)) total = cells.reduce((a,c)=>a+c.v,0);
  const req=null;
  const counted = !special && total!=null;
  const pct = total!=null ? total/d.max*100 : null;
  return {special, total, max:d.max, pct, counted, pass: counted ? pct>=PASS : null, req, keysUsed:keys};
}


// ===== الإحصائيات (طبقة موحّدة لكل التقارير) =====
// تعريفات ثابتة في كل المنصة:
//   نسبة التحصيل = متوسط النسب المئوية للنتائج المحتسبة
//   نسبة النجاح  = النتائج الناجحة (≥50%) ÷ النتائج المحتسبة × 100
//   متفوق ≥90% ، متوسط 65% إلى أقل من 90% ، ضعيف أقل من 65% (والراسب أقل من 50% جزء من الضعاف)
//   الغائب والمعذور والمحروم لا يدخلون في النسب
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const stddev = a => { if(a.length<2) return null; const m=avg(a); return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1)); };
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const tierKey = p => p>=EXC ? 'exc' : (p>=WEAK ? 'mid' : 'weak');
const TIER_LABEL = {exc:'متفوق', mid:'متوسط', weak:'ضعيف'};
const RR = (s,label,pk) => { const R=s.subj[label]; return R && R.pkg && R.pkg[pk] ? R : null; };

// نتائج مادة لقائمة طلاب: [{st, p}]
function results(list, label, pk){
  const out=[];
  for(const s of list){ const R=s.subj[label]; const p=R && R.pkg && R.pkg[pk]; if(p) out.push({st:s, p}); }
  return out;
}
// كل نتائج المواد لقائمة طلاب
function resultsAll(list, labels, pk){ return labels.flatMap(l=>results(list,l,pk).map(x=>({...x, label:l}))); }

// التجميع الموحّد
function agg(ps){
  const a={taught:ps.length, n:0, pcts:[], pass:0, fail:0, exc:0, mid:0, weak:0, absent:0, excused:0, deprived:0, missing:0};
  for(const p of ps){
    // الغائب والمعذور والمحروم لا يدخلون في أي نسبة: النسب للحاضرين فقط
    if(p.special){ if(/غائب/.test(p.special)) a.absent++; else if(/محروم/.test(p.special)) a.deprived++; else a.excused++; continue; }
    if(!p.counted){ a.missing++; continue; }
    a.n++; a.pcts.push(p.pct);
    if(p.pass) a.pass++; else a.fail++;
    a[tierKey(p.pct)]++;
  }
  a.out = a.absent + a.excused + a.deprived;   // غير الحاضرين
  a.ach = avg(a.pcts); a.median = median(a.pcts); a.sd = stddev(a.pcts);
  a.min = a.n ? Math.min(...a.pcts) : null; a.max = a.n ? Math.max(...a.pcts) : null;
  const r = x => a.n ? x/a.n*100 : null;
  a.passRate = r(a.pass); a.excRate = r(a.exc); a.midRate = r(a.mid); a.weakRate = r(a.weak); a.failRate = r(a.fail);
  return a;
}
const aggSubject = (list,label,pk) => agg(results(list,label,pk).map(x=>x.p));
const aggAll = (list,labels,pk) => agg(resultsAll(list,labels,pk).map(x=>x.p));

// ملخص طالب في اختبار
function studentSum(s, pk){
  const ps = Object.values(s.subj).map(R=>R.pkg && R.pkg[pk]).filter(Boolean);
  const c = ps.filter(p=>p.counted);
  const total = c.reduce((x,p)=>x+p.total,0), max = c.reduce((x,p)=>x+p.max,0);
  // في الدور الأول: المجموع والمتوسط والحالة كما وردت في الملف الرسمي
  const off = (pk==='year' && s.final) ? s.final : null;
  const fails = c.filter(p=>!p.pass).length;
  const allPass = off && off.status ? /ناجح/.test(off.status) : (c.length>0 && fails===0);
  return {
    subjects: ps.length, counted: c.length,
    avg: avg(c.map(p=>p.pct)),
    total: off && off.total!=null ? off.total : (c.length?total:null), max: c.length?max:null,
    offAvg: off ? off.avg : null,
    status: off && off.status ? off.status : (!c.length ? '' : allPass ? 'ناجح' : 'راسب'),
    official: !!off,
    fails, exc: c.filter(p=>p.pct>=EXC).length, weak: c.filter(p=>p.pct<WEAK).length,
    special: ps.filter(p=>p.special).length,
    allPass, failed: (c.length>0 || off) && !allPass,
  };
}
// ملخص مجموعة طلاب (مستوى الطالب)
function studentsAgg(list, pk){
  const sums = list.map(s=>studentSum(s,pk)).filter(x=>x.counted);
  return {n:sums.length, avg:avg(sums.map(x=>x.avg)), allPass:sums.filter(x=>x.allPass).length,
          allPassRate: sums.length ? sums.filter(x=>x.allPass).length/sums.length*100 : null,
          withFail: sums.filter(x=>x.failed).length};
}
// ترتيب طالب داخل قائمة حسب متوسطه
function rankIn(list, s, pk){
  const v = studentSum(s,pk).avg; if(v==null) return null;
  const vals = list.map(x=>studentSum(x,pk).avg).filter(x=>x!=null);
  return {rank: vals.filter(x=>x>v+1e-9).length+1, of: vals.length};
}

// المعلمون لاختبار: الإجمالي السنوي يُنسب لآخر معلم درّس الشعبة في المادة
const PK_SEQ=['mid1','end1','mid2','end2'];
// مصدر قائمة المعلمين لاختبار: قائمته إن رُفعت، وإلا أقرب قائمة سابقة ثم لاحقة
function teacherSource(D, pk){
  const has=k=>(D.teachersByPkg[k]||[]).length>0;
  if(pk==='year') return ['final',...PK_SEQ.slice().reverse()].find(has)||null;
  if(has(pk)) return pk;
  const i=PK_SEQ.indexOf(pk);
  for(let j=i-1;j>=0;j--) if(has(PK_SEQ[j])) return PK_SEQ[j];
  for(let j=i+1;j<PK_SEQ.length;j++) if(has(PK_SEQ[j])) return PK_SEQ[j];
  return null;
}
function teachersFor(D, pk){
  if(pk!=='year'){ const src=teacherSource(D,pk); return src ? D.teachersByPkg[src] : []; }
  // الإجمالي السنوي يُنسب لآخر معلم درّس الشعبة في المادة
  const seen=new Map();
  for(const k of ['final','end2','mid2','end1','mid1']) for(const t of (D.teachersByPkg[k]||[])){
    const key=t.cls+'|'+(t.subjectKey||t.subject); if(!seen.has(key)) seen.set(key,t);
  }
  return [...seen.values()];
}
// تجميع المعلمين: كل معلم + مادة ← شعبه ونتائجها
function teacherAgg(D, list, pk){
  const by=new Map();
  for(const t of teachersFor(D,pk)){
    if(!t.subjectKey) continue;
    const studs=list.filter(s=>normClass(s.cls)===t.cls);
    const rs=results(studs,t.subjectKey,pk);
    if(!rs.length) continue;
    const k=t.name+'|'+t.subjectKey;
    let g=by.get(k);
    if(!g){ g={name:t.name, subject:t.subjectKey, email:t.email, classes:[], items:[]}; by.set(k,g); }
    g.classes.push({cls:studs[0].cls, a:agg(rs.map(x=>x.p)), items:rs});
    g.items.push(...rs);
  }
  return [...by.values()].map(g=>{
    g.classes.sort((x,y)=>String(x.cls).localeCompare(String(y.cls),'ar',{numeric:true}));
    return {...g, a:agg(g.items.map(x=>x.p))};
  }).sort((x,y)=>(y.a.ach??-1)-(x.a.ach??-1));
}

const BINS = [

];

// المقارنة بين اختبارين
function progression(list, labels, pkA, pkB){
  const subj={}, studs=[];
  for(const s of list){
    for(const l of labels){
      const a=RR(s,l,pkA)&&s.subj[l].pkg[pkA], b=RR(s,l,pkB)&&s.subj[l].pkg[pkB];
      if(a&&b&&a.counted&&b.counted) (subj[l]=subj[l]||[]).push(b.pct-a.pct);
    }
    const sa=studentSum(s,pkA), sb=studentSum(s,pkB);
    if(sa.counted && sb.counted) studs.push({st:s, a:sa.avg, b:sb.avg, d:sb.avg-sa.avg});
  }
  return {
    subjects: Object.entries(subj).map(([l,ds])=>({label:l, d:avg(ds), n:ds.length, up:ds.filter(x=>x>1).length, down:ds.filter(x=>x<-1).length})).sort((x,y)=>y.d-x.d),
    students: studs.sort((x,y)=>y.d-x.d),
  };
}

// درجة الخطورة 0–100 للإنذار المبكر
function riskOf(s, D, pk){
  const sm=studentSum(s,pk); if(!sm.counted) return {score:0, sm, reasons:[], edge:[], drop:[]};
  let score=0; const reasons=[];
  if(sm.fails>=3){score+=50; reasons.push(`راسب في ${sm.fails} مواد`);} else if(sm.fails===2){score+=35; reasons.push('راسب في مادتين');} else if(sm.fails===1){score+=20; reasons.push('راسب في مادة');}
  const weakOnly = sm.weak - sm.fails;
  if(weakOnly>=3){score+=20; reasons.push(`ضعيف في ${weakOnly} مواد`);} else if(weakOnly>=1){score+=10; reasons.push(weakOnly===1?'ضعيف في مادة':`ضعيف في ${weakOnly} مواد`);}
  if(sm.avg<WEAK){score+=20; reasons.push('متوسط عام أقل من 65%');} else if(sm.avg<75){score+=8;}
  const ps=D.availPkgs.filter(k=>k!=='year');
  if(ps.length>=2){
    const first=studentSum(s,ps[0]).avg, last=studentSum(s,ps[ps.length-1]).avg;
    if(first!=null && last!=null && last<first-5){ score+=15; reasons.push(`تراجع ${(first-last).toFixed(1)} نقطة`); }
  }
  if(sm.special){ score+=5; reasons.push('غياب/عذر'); }
  // إنذار استباقي: على حافة الرسوب (50–55%) أو تراجع حاد في مادة عن الاختبار السابق
  const seq=D.availPkgs.filter(k=>k!=='year'), pv = pk==='year' ? seq[seq.length-1] : seq[seq.indexOf(pk)-1];
  const edge=[], drop=[];
  for(const [l,R] of Object.entries(s.subj)){
    const p=R.pkg&&R.pkg[pk]; if(!p||!p.counted) continue;
    if(p.pass && p.pct<PASS+5) edge.push(l);
    const q=pv&&R.pkg&&R.pkg[pv]; if(q&&q.counted&&p.pct-q.pct<=-15) drop.push(l);
  }
  if(edge.length){ score+=Math.min(16,edge.length*8); reasons.push(`على حافة الرسوب في ${edge.join('، ')}`); }
  if(drop.length){ score+=10; reasons.push(`تراجع حاد (15 نقطة فأكثر) في ${drop.join('، ')}`); }
  return {score:Math.min(100,score), sm, reasons, edge, drop, pv};
}

function rankBars(items, opt={}){

const LEG_HEAT = `<div class="legend"><span><i class="h1"></i>90% فأكثر</span><span><i class="h2"></i>80 – 89.9</span><span><i class="h3"></i>65 – 79.9</span><span><i class="h4"></i>50 – 64.9</span><span><i class="h5"></i>أقل من 50</span></div>`;
function lineChart(series, labels){
  const all = series.flatMap(s=>s.data).filter(v=>v!=null);
  if(!all.length || labels.length<2) return '<p class="note">يحتاج اختبارين على الأقل.</p>';
  const W=640,H=250,pl=22,pr=48,pt=26,pb=34, pad=26, iw=W-pl-pr-2*pad, ih=H-pt-pb;
  const lo = floorOf(all), hi=100;
  // الترتيب الزمني من اليمين إلى اليسار
  const x = i => W-pr-pad - (labels.length===1 ? iw/2 : i*iw/(labels.length-1));
  const y = v => pt + ih - (v-lo)/(hi-lo)*ih;
  const step=(hi-lo)>50?25:(hi-lo)>20?10:5; const ticks=[]; for(let t=lo;t<=hi+1e-9;t+=step) ticks.push(t);
  let g = ticks.map(t=>`<line class="g" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${W-pr+8}" y="${y(t)+4}" text-anchor="start">${r1(t)}</text>`).join('');
  g += labels.map((l,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${esc(l)}</text>`).join('');
  // موضع رقم كل نقطة: الأعلى قيمة فوق نقطته، والأدنى تحتها، حتى لا تتداخل الأرقام
  const place = (si,i) => { const v=series[si].data[i]; const others=series.filter((s,k)=>k!==si && s.labels!==false).map(s=>s.data[i]).filter(o=>o!=null);
    if(!others.length) return -10; const isTop = others.every(o=>v>=o-1e-9) && !(others.some(o=>Math.abs(o-v)<1e-9) && si>0); return isTop ? -10 : 18; };
  const lines = series.map((s,si)=>{
    const pts = s.data.map((v,i)=>v==null?null:[x(i),y(v),v,i]).filter(Boolean);
    const path = pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.labels===false?1.8:2.4}" ${s.labels===false?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>${pts.map(p=>`<circle class="tp" data-tip="${esc(labels[p[3]])} — ${esc(s.name)}: ${r1(p[2])}%" cx="${p[0]}" cy="${p[1]}" r="${s.labels===false?3:4}" fill="${s.color}" stroke="var(--paper)" stroke-width="1.5"/>${s.labels===false?'':`<text class="vt" x="${p[0]}" y="${p[1]+place(si,p[3])}" text-anchor="middle" style="fill:${s.color}">${r1(p[2])}</text>`}`).join('')}`;
  }).join('');
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img">${g}${lines}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

const STORE = {

  async get(k){ const db=this.db||await this.open(); return new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); },
  async set(k,v){ const db=this.db||await this.open(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
};

const CARD_OF_SLOT = {mid1:'mid1', term1:'end1', mid2:'mid2', term2:'end2', final:'final'};
async function readCard(id, files){
  const card=CARDS.find(c=>c.id===id), Y=YEARS[currentYear], state=emptyCard();
  if(typeof XLSX==='undefined'){ state.warn.push('مكتبة قراءة Excel لم تُحمَّل. افتح الصفحة مع اتصال بالإنترنت مرة واحدة.'); Y.cards[id]=state; return; }
  const moved={};   // ملفات تخص اختبارات أخرى تُنقل إلى بطاقتها
  for(let fi=0; fi<files.length; fi++){
    const f=files[fi];
    busy(`جارٍ قراءة الملفات في الخلفية… ${fi+1} من ${files.length}`);
    try{
      const r=await parseFile(f, card.expect);
      const meta={name:f.name, what:[]};
      if(r.teachers.length){ state.teachers.push(...r.teachers); meta.what.push(`قائمة المعلمين (${r.teachers.length} سطر)`); }
      for(const p of r.sheets){
        const target = p.slot==='cons' ? id : CARD_OF_SLOT[p.slot];
        const desc = `الصف ${p.grade}: ${p.students.length} طالباً، ${p.subjects.length} ${p.subjects.length===1?'مادة':'مواد'}${p.layout==='subject'?' (مادة لكل ورقة)':''}${p.year?` — عام ${p.year}`:''}`;
        if(p.year && p.year!==currentYear) state.warn.push(`"${f.name}" مكتوب فيه العام الدراسي ${p.year}، والعام المفتوح ${currentYear}. إن كان الملف لعام آخر فامسح البطاقة وأضف ذلك العام ثم ارفعه فيه.`);
        if(p.slotFromCard) state.warn.push(`"${f.name}": اسم الفترة في الملف غير معتاد، فقُرئ على أنه ${CARDS.find(c=>c.id===id).title} حسب البطاقة.`);
        if(target===id){ state.sheets.push(p); meta.what.push(desc); }
        else { (moved[target]=moved[target]||[]).push({p, meta:{name:f.name, what:[desc+' — نُقل تلقائياً']}}); }
      }
      if(meta.what.length) state.files.push(meta);
      if(!r.sheets.length && !r.teachers.length) state.warn.push(`لم يُتعرّف على بيانات في "${f.name}".${r.why.length?' السبب: '+[...new Set(r.why)].slice(0,3).join(' · '):''}`);
    }catch(e){ state.warn.push(`تعذّرت قراءة "${f.name}": ${e.message}`); }
  }
  busy('');
  Y.cards[id]=state;
  for(const [cid,items] of Object.entries(moved)){
    const t=Y.cards[cid];
    items.forEach(x=>{ t.sheets=t.sheets.filter(q=>!(q.file===x.p.file && q.slot===x.p.slot && q.grade===x.p.grade)); t.sheets.push(x.p); t.files=t.files.filter(m=>m.name!==x.meta.name); t.files.push(x.meta); });
    state.moved=(state.moved||[]).concat(items.map(x=>`"${x.meta.name}" ← ${CARDS.find(c=>c.id===cid).title}`));
  }
}
function buildYear(y){
  const Y=YEARS[y]; const sheets=CARDS.flatMap(c=>Y.cards[c.id].sheets);
  const tb={}; CARDS.forEach(c=>tb[c.id]=Y.cards[c.id].teachers);
  Y.data = sheets.length ? analyze(sheets, tb) : null;
}
function syncFilters(){
  const d=D(); if(!d) return;
  if(!d.availPkgs.includes(st.pk)) st.pk = d.availPkgs.includes('year') ? 'year' : d.availPkgs[d.availPkgs.length-1];
  if(st.grade!=='all' && !d.grades.includes(+st.grade)) st.grade='all';
  if(st.cls!=='all' && !classesInGrade().includes(st.cls)) st.cls='all';
  const ps=d.availPkgs;
  if(!ps.includes(st.pkA)) st.pkA=ps[0];
  if(!ps.includes(st.pkB) || st.pkB===st.pkA) st.pkB=ps.filter(k=>k!==st.pkA && k!=='year').slice(-1)[0] || ps[ps.length-1];
}

      ${T('<th>الاختبار</th><th>الصفوف المرفوعة</th><th>أسطر قائمة المعلمين</th>', CARDS.map(c=>{
        const g=[...new Set(Y.cards[c.id].sheets.map(s=>s.grade))].sort();
        return `<tr><td class="l">${c.title}</td><td>${g.length?g.map(x=>'الصف '+x).join('، '):'<span class="c-mut">—</span>'}</td><td>${tCount[c.id]||'<span class="c-mut">—</span>'}</td></tr>`;}).join(''))}
      <div class="sub-h">حالة الرصد: نسبة الخانات المرصودة من التقييم الرئيسي</div>
      ${T('<th class="l">المادة</th>'+d.availPkgs.filter(k=>k!=='year').map(k=>`<th>${PK_SHORT[k]}</th>`).join(''), d.subjects.map(l=>`<tr><td class="l">${esc(l)}</td>${d.availPkgs.filter(k=>k!=='year').map(k=>{ const a=aggSubject(d.students,l,k); if(!a.taught) return '<td class="c-mut">—</td>'; const v=(a.n+a.out)/a.taught*100; return `<td class="${v>=99.5?'c-exc':v>0?'c-weak':'c-fail'}">${pc(v)} <small class="c-mut">(${a.n+a.out}/${a.taught})</small></td>`; }).join('')}</tr>`).join(''))}
      <p class="note">إن لم تُرفع قائمة معلمين لاختبار تُستخدم أقرب قائمة مرفوعة. المعتمد في كل الاختبارات هو التقييم الرئيسي: منتصف الفصل من 30، ونهاية الفصل من 50 (والاختبار النظري من 50 للعلوم). الدور الأول من 100 تؤخذ من ملف الدور الأول الرسمي كما هي، ولا تُحسب. تُنسب الدور الأول لآخر معلم درّس الشعبة في المادة.</p></div>`;
  }
  return `<div class="ws">
    <h1>الأعوام الدراسية وملفات الرصد</h1>
    <p>كل عام دراسي له ملفاته. تُحفظ البيانات على هذا الجهاز فقط، ولا تُرسل إلى أي خادم. للانتقال إلى جهاز آخر استخدم <a href="#backup">النسخة الاحتياطية</a> أسفل الصفحة.</p>
    <div class="panel"><h3>الأعوام الدراسية</h3>
      <div class="years">${chips}

      </div></div>
    <div class="panel"><h3>ملفات عام <bdi dir="ltr">${esc(currentYear)}</bdi></h3><div class="ups">${cards}</div></div>
    ${qualityBanner()}
    ${summary}
    ${typeof versionsPanel==='function'?versionsPanel():''}
    ${backupPanel()}
  </div>`;
}

function pExec(){
  const d=D(), list=scope(), labels=labelsIn(list), A=aggAll(list,labels,st.pk), S=studentsAgg(list,st.pk);
  const subs = labels.map(l=>({l, a:aggSubject(list,l,st.pk)})).sort((x,y)=>(y.a.ach??-1)-(x.a.ach??-1));
  const trend = d.availPkgs.map(k=>aggAll(list,labelsIn(list,k),k));
  const classes = [...new Set(list.map(s=>s.cls))].sort(byCls).map(c=>({c, a:aggAll(list.filter(s=>s.cls===c),labels,st.pk)})).sort((x,y)=>(y.a.ach??-1)-(x.a.ach??-1));
  const top = list.map(s=>({s, m:studentSum(s,st.pk)})).filter(x=>x.m.counted && x.m.allPass).sort((a,b)=>b.m.avg-a.m.avg).slice(0,10);
  const risk = list.map(s=>({s, r:riskOf(s,d,st.pk)})).filter(x=>x.r.score>0).sort((a,b)=>b.r.score-a.r.score).slice(0,10);
  return `<div class="sheet">${RH('لوحة القياس', 'ملخص مؤشرات الأداء الأكاديمي')}
  <div class="kpis">
    ${kpi('الطلاب', list.length, `الحاضرون ${S.n}`)}
    ${kpi('نسبة التحصيل', pc(A.ach), `${A.n} نتيجة للحاضرين`)}${kpi('غير محتسبين في النسب', A.out, `غائب ${A.absent} · معذور ${A.excused} · محروم ${A.deprived}`)}
    ${kpi('نسبة النجاح', pc(A.passRate), `${A.pass} ناجحة من ${A.n}`)}
    ${kpi('ناجحون في جميع المواد', pc(S.allPassRate), `${S.allPass} طالباً`)}
    ${kpi('متفوق ≥90%', pc(A.excRate), `${A.exc} نتيجة`, 'exc')}
    ${kpi('ضعيف &lt;65%', pc(A.weakRate), `${A.weak} نتيجة`, 'weak')}
    ${kpi('راسب', A.fail, `${S.withFail} طالباً`, 'fail')}
  </div>
  ${insightsBox(d,list,st.pk)}
  ${sec('أداء المواد', `<div class="cols"><div>${rankBars(subs.map(x=>({label:x.l, v:x.a.ach, act:'subject', key:x.l})))}</div><div>
    ${T('<th class="l">المادة</th><th>التحصيل</th><th>النجاح</th><th>التكوين</th>', subs.map(x=>`<tr class="click" data-act="subject" data-v="${esc(x.l)}"><td class="l">${esc(x.l)}</td><td class="${toneCls(x.a.ach)}">${pc(x.a.ach)}</td><td>${pc(x.a.passRate)}</td><td>${stack(x.a)}</td></tr>`).join(''))}${LEG_TIERS}</div></div>`, 'اضغط مادة لتقريرها')}
  ${sec('تطور المؤشرات عبر الاختبارات', `<div class="cols"><div>${lineChart([{name:'نسبة التحصيل',data:trend.map(a=>a.ach),color:'var(--navy-2)'},{name:'نسبة النجاح',data:trend.map(a=>a.passRate),color:'var(--exc)'}], d.availPkgs.map(k=>PK_SHORT[k]))}</div><div>
    ${T('<th class="l">الاختبار</th><th>التحصيل</th><th>النجاح</th><th>متفوق</th><th>ضعيف</th>', d.availPkgs.map((k,i)=>`<tr><td class="l">${PKG[k].label}</td><td class="${toneCls(trend[i].ach)}">${pc(trend[i].ach)}</td><td>${pc(trend[i].passRate)}</td><td>${pc(trend[i].excRate)}</td><td>${pc(trend[i].weakRate)}</td></tr>`).join(''))}</div></div>`)}
  ${classes.length>1 ? sec('ترتيب الشعب حسب نسبة التحصيل', rankBars(classes.map(x=>({label:'الشعبة '+x.c, v:x.a.ach, act:'cls', key:x.c}))), 'اضغط شعبة لتقريرها') : ''}
  ${sec('الطلاب', `<div class="cols"><div><div class="sub-h">أعلى 10 طلاب (ناجحون في جميع المواد)</div>
    ${T('<th>م</th><th class="l">الاسم</th><th>الشعبة</th><th>المتوسط</th>', top.map((x,i)=>`<tr class="click" data-act="student" data-v="${esc(x.s.id)}"><td>${i+1}</td><td class="nm">${esc(x.s.name)}</td><td>${esc(x.s.cls)}</td><td class="c-exc">${pc(x.m.avg)}</td></tr>`).join(''))}</div>
    <div><div class="sub-h">أعلى 10 حالات في الإنذار المبكر</div>
    ${risk.length?T('<th class="l">الاسم</th><th>الشعبة</th><th>الخطورة</th><th>المتوسط</th>', risk.map(x=>`<tr class="click" data-act="student" data-v="${esc(x.s.id)}"><td class="nm">${esc(x.s.name)}</td><td>${esc(x.s.cls)}</td><td class="${x.r.score>=60?'c-fail':'c-weak'}">${x.r.score}</td><td>${pc(x.r.sm.avg)}</td></tr>`).join('')):'<p class="note">لا توجد حالات.</p>'}</div></div>`)}
  </div>`;
}

// ---------- نتائج الدور الأول من 100 ----------
function pFinal(){
  const d=D();
  if(!d.availPkgs.includes('year')) return `<div class="sheet">${RH('نتائج الدور الأول من 100','')}${empty('لم يُرفع ملف الدور الأول لهذا العام','<br>ارفع ملف نتائج الدور الأول الرسمي (من 100) في بطاقة "الدور الأول من 100" بصفحة الأعوام والملفات.')}</div>`;
  const list=scope(); const meta=[['العام الدراسي',currentYear],['الاختبار','الدور الأول'],['النطاق',scopeName()],['تاريخ الإصدار',TODAY]];
  const classes=[...new Set(list.map(s=>s.cls))].sort(byCls);
  const labels=labelsIn(list,'year');
  const summary = classes.length>1 ? `<div class="sheet wide">${RH('نتائج الدور الأول من 100','من ملف الدور الأول الرسمي',meta)}
    ${sec('ملخص النتائج حسب الشعبة', T('<th>الشعبة</th><th>الطلاب</th><th>ناجحون</th><th>دور ثانٍ</th><th>نسبة النجاح</th><th>نسبة التحصيل</th>'+labels.map(l=>`<th style="white-space:normal">${esc(l)}</th>`).join(''),
      classes.map(c=>{ const L=list.filter(s=>s.cls===c), S=studentsAgg(L,'year'), A=aggAll(L,labels,'year');
        return `<tr class="click" data-act="cls" data-v="${esc(c)}"><td><b>${esc(c)}</b></td><td>${S.n}</td><td>${S.allPass}</td><td class="${S.withFail?'c-fail':''}">${S.withFail}</td><td>${pc(S.allPassRate)}</td><td class="${toneCls(A.ach)}">${pc(A.ach)}</td>${labels.map(l=>{const a=aggSubject(L,l,'year'); return `<td class="h ${heat(a.ach)}">${nf(a.ach)}</td>`;}).join('')}</tr>`; }).join(''), '', 'heat'))}
    ${LEG_HEAT}<p class="note">قيم المواد في الجدول متوسط الشعبة من 100. الطالب الناجح ناجح في جميع المواد المحتسبة.</p></div>` : '';
  const pages = classes.map(c=>{
    const L=list.filter(s=>s.cls===c).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    const sums=new Map(L.map(s=>[s.id,studentSum(s,'year')]));
    const key=m=>m.offAvg!=null?m.offAvg:m.avg;
    const avgs=[...sums.values()].map(key).filter(x=>x!=null);
    const rows=L.map((s,i)=>{
      const m=sums.get(s.id);
      const cells=labels.map(l=>{ const p=RR(s,l,'year')&&s.subj[l].pkg.year;
        if(!p) return '<td class="c-mut">–</td>';
        if(p.special) return `<td class="c-mut">${esc(p.special)}</td>`;
        if(!p.counted) return '<td class="c-mut">غ.م</td>';
        return `<td class="${p.pass?(p.pct>=EXC?'':'')+(p.pct<WEAK?'c-weak':''):'c-fail h5'}">${nf(p.total)}</td>`; }).join('');
      const k=key(m), rank = k==null?'–':avgs.filter(x=>x>k+1e-9).length+1;
      const res = !m.status ? '<span class="tag na">—</span>' : m.allPass ? `<span class="tag exc">${esc(m.status)}</span>` : `<span class="tag fail">${esc(m.status)}</span>`;
      return `<tr class="click" data-act="student" data-v="${esc(s.id)}"><td>${i+1}</td><td>${esc(s.id)}</td><td class="nm">${esc(s.name)}</td>${cells}<td><b>${nf(m.total)}</b></td><td>${m.offAvg!=null?nf(m.offAvg):pc(m.avg)}</td><td>${rank}</td><td>${res}</td></tr>`;
    }).join('');
    const foot = `<tr><td colspan="3" class="l">متوسط الشعبة</td>${labels.map(l=>`<td>${nf(aggSubject(L,l,'year').ach)}</td>`).join('')}<td colspan="4"></td></tr>
      <tr><td colspan="3" class="l">نسبة النجاح</td>${labels.map(l=>`<td>${pc(aggSubject(L,l,'year').passRate)}</td>`).join('')}<td colspan="4"></td></tr>`;
    return `<div class="sheet wide">${RH(`نتائج الدور الأول — الشعبة ${c}`,'من ملف الدور الأول الرسمي — كل مادة من 100',[['العام الدراسي',currentYear],['الشعبة',c],['عدد الطلاب',String(L.length)],['تاريخ الإصدار',TODAY]])}
      <div style="margin-top:10px">${T('<th>م</th><th>الرقم</th><th class="l">اسم الطالب</th>'+labels.map(l=>`<th>${esc(l)}</th>`).join('')+'<th>المجموع الكلي</th><th>المتوسط</th><th>الترتيب</th><th>الحالة</th>', rows, foot, 'dense')}</div>
      ${sig([['النائب الأكاديمي',SETTINGS.deputy],['مدير المدرسة',SETTINGS.principal]])}</div>`;
  }).join('');
  return summary + pages;
}

function pCompare(){
  const d=D(), labels=labelsIn(d.students);
  const gRows = d.grades.map(g=>{ const L=d.students.filter(s=>s.grade===g); return {g, L, A:aggAll(L,labels,st.pk), S:studentsAgg(L,st.pk)}; });
  const classes = classesInGrade();
  const cRows = classes.map(c=>{ const L=d.students.filter(s=>s.cls===c); return {c, L, A:aggAll(L,labels,st.pk), S:studentsAgg(L,st.pk)}; });
  const head = '<th>الطلاب</th><th>نسبة التحصيل</th><th>نسبة النجاح</th><th>ناجح في الكل</th><th>متفوق</th><th>متوسط</th><th>ضعيف</th><th>راسب</th><th>التكوين</th>';
  const cells = r => `<td>${r.S.n}</td><td class="${toneCls(r.A.ach)}">${pc(r.A.ach)}</td><td>${pc(r.A.passRate)}</td><td>${pc(r.S.allPassRate)}</td><td>${pc(r.A.excRate)}</td><td>${pc(r.A.midRate)}</td><td>${pc(r.A.weakRate)}</td><td class="${r.A.fail?'c-fail':''}">${r.A.fail}</td><td>${stack(r.A)}</td>`;
  const heatT = (rows, nameFn, act, first) => T(`<th class="l">${first}</th>`+labels.map(l=>`<th style="white-space:normal;min-width:64px">${esc(l)}</th>`).join('')+'<th>الكل</th>',
    rows.map(r=>`<tr ${act?`class="click" data-act="${act}" data-v="${esc(r.c)}"`:''}><td class="l"><b>${esc(nameFn(r))}</b></td>${labels.map(l=>{ const a=aggSubject(r.L,l,st.pk); return `<td class="h ${heat(a.ach)}">${nf(a.ach)}</td>`; }).join('')}<td class="h ${heat(r.A.ach)}"><b>${nf(r.A.ach)}</b></td></tr>`).join(''), '', 'heat');
  return `<div class="sheet">${RH('مقارنة الصفوف والشعب', PKG[st.pk].long, [['العام الدراسي',currentYear],['الاختبار',PKG[st.pk].label],['الشعب',st.grade==='all'?'جميع الصفوف':'الصف '+st.grade],['تاريخ الإصدار',TODAY]])}
  ${sec('مؤشرات الصفوف', T('<th class="l">الصف</th>'+head, gRows.map(r=>`<tr><td class="l"><b>الصف ${r.g}</b></td>${cells(r)}</tr>`).join(''))+LEG_TIERS)}
  ${sec('نسبة التحصيل: المواد × الصفوف', heatT(gRows, r=>'الصف '+r.g, '', 'الصف')+LEG_HEAT)}
  ${sec('ترتيب الشعب حسب نسبة التحصيل', rankBars([...cRows].sort((a,b)=>(b.A.ach??-1)-(a.A.ach??-1)).map(r=>({label:'الشعبة '+r.c, v:r.A.ach, act:'cls', key:r.c}))), 'اضغط شعبة لتقريرها')}
  ${sec('مؤشرات الشعب', T('<th class="l">الشعبة</th>'+head, cRows.map(r=>`<tr class="click" data-act="cls" data-v="${esc(r.c)}"><td class="l"><b>${esc(r.c)}</b></td>${cells(r)}</tr>`).join('')))}
  ${sec('نسبة التحصيل: المواد × الشعب', heatT(cRows, r=>r.c, 'cls', 'الشعبة')+LEG_HEAT)}
  </div>`;
}
