function subjectDetail(l){
  const d=D(), list=scope(), a=aggSubject(list,l,st.pk);
  const per=d.availPkgs.map(k=>aggSubject(list,l,k));
  const classes=[...new Set(list.map(s=>s.cls))].sort(byCls).map(c=>({c, a:aggSubject(list.filter(s=>s.cls===c),l,st.pk)})).filter(x=>x.a.taught);
  const teachers=teacherAgg(d,list,st.pk).filter(t=>t.subject===l);
  const b=bins(a.pcts);
  return `<div class="noprint" style="max-width:1160px;margin:0 auto 10px"><button class="btn sm" data-act="back">رجوع إلى المواد</button></div>
  <div class="sheet">${RH('تقرير مادة: '+l, PKG[st.pk].long)}
  <div class="kpis">${kpi('المختبرون',a.n)}${kpi('نسبة التحصيل',pc(a.ach))}${kpi('نسبة النجاح',pc(a.passRate))}${kpi('الوسيط',pc(a.median))}${kpi('متفوق',a.exc,pc(a.excRate),'exc')}${kpi('ضعيف',a.weak,pc(a.weakRate),'weak')}${kpi('راسب',a.fail,'','fail')}</div>
  ${(()=>{ const cats=d.availPkgs.map(k=>PK_SHORT[k]);
    const rows=d.availPkgs.map((k,i)=>{ const p=i>0?per[i-1]:null, df=p&&p.ach!=null&&per[i].ach!=null?per[i].ach-p.ach:null; return `<tr${k===st.pk?' style="font-weight:700;background:var(--navy-soft)"':''}><td class="l">${PKG[k].label}</td>${aggCells(per[i])}<td class="${df==null?'':df>=0?'c-exc':'c-fail'}">${sgn(df)}</td></tr>`; }).join('');
    return sec('المادة عبر الاختبارات', T('<th class="l">الاختبار</th>'+AGG_HEAD+'<th>التغيّر</th>', rows)

  const tools = `<div class="r-tools"><div class="grp"><label>المادة <select data-set="tierSubject"><option value="__all">جميع المواد (ملخص)</option>${labels.map(l=>`<option ${st.tierSubject===l?'selected':''}>${esc(l)}</option>`).join('')}</select></label></div></div>`;
  const A=aggAll(list,labels,st.pk);
  const kp = `<div class="kpis">${kpi('النتائج المحتسبة',A.n)}${kpi('متفوق ≥90%',A.exc,pc(A.excRate),'exc')}${kpi('متوسط 65–89.9%',A.mid,pc(A.midRate),'mid')}${kpi('ضعيف &lt;65%',A.weak,pc(A.weakRate),'weak')}${kpi('منهم راسب &lt;50%',A.fail,pc(A.failRate),'fail')}</div>`;
  if(st.tierSubject==='__all'){
    const classes=[...new Set(list.map(s=>s.cls))].sort(byCls);
    const matrix=(key)=>T('<th class="l">الشعبة</th>'+labels.map(l=>`<th style="white-space:normal;min-width:60px">${esc(l)}</th>`).join('')+'<th>المجموع</th>',
      classes.map(c=>{ const L=list.filter(s=>s.cls===c); const v=labels.map(l=>aggSubject(L,l,st.pk)[key]); return `<tr class="click" data-act="cls" data-v="${esc(c)}"><td class="l"><b>${esc(c)}</b></td>${v.map(x=>`<td class="${x?(key==='exc'?'c-exc':'c-weak'):'c-mut'}">${x||'·'}</td>`).join('')}<td><b>${v.reduce((p,q)=>p+q,0)}</b></td></tr>`; }).join(''));
    return `<div class="sheet">${RH('تصنيف الطلاب','متفوق ≥90% · متوسط 65%–89.9% · ضعيف أقل من 65%')}${tools}${kp}
    ${sec('التصنيف حسب المادة', T('<th class="l">المادة</th><th>المختبرون</th><th>متفوق</th><th>%</th><th>متوسط</th><th>%</th><th>ضعيف</th><th>%</th><th>منهم راسب</th><th>التكوين</th>',
      labels.map(l=>{const a=aggSubject(list,l,st.pk); return `<tr><td class="l">${esc(l)}</td><td>${a.n}</td><td class="c-exc">${a.exc}</td><td>${pc(a.excRate)}</td><td class="c-mid">${a.mid}</td><td>${pc(a.midRate)}</td><td class="c-weak">${a.weak}</td><td>${pc(a.weakRate)}</td><td class="${a.fail?'c-fail':''}">${a.fail}</td><td>${stack(a)}</td></tr>`;}).join(''))+LEG_TIERS+'<p class="note">اختر مادة من القائمة أعلاه لعرض أسماء الطلاب في كل فئة.</p>')}
    ${classes.length>1?sec('عدد الطلاب الضعاف: الشعبة × المادة', matrix('weak')):''}
    ${classes.length>1?sec('عدد الطلاب المتفوقين: الشعبة × المادة', matrix('exc')):''}
    </div>`;
  }
  const l=st.tierSubject, rs=results(list,l,st.pk).filter(x=>x.p.counted).sort((a,b)=>b.p.pct-a.p.pct);
  const a=aggSubject(list,l,st.pk);
  const group = (k,title) => { const g=rs.filter(x=>tierKey(x.p.pct)===k);
    return sec(`${title} (${g.length})`, g.length ? T('<th>م</th><th class="l">اسم الطالب</th><th>الشعبة</th><th>الدرجة</th><th>النسبة</th><th>الحالة</th>',

  const classes=[...new Set(list.map(s=>s.cls))].sort(byCls);
  return `<div class="sheet">${RH('تصنيف الطلاب — '+l, PKG[st.pk].label)}${tools}

  ${classes.length>1?sec('التصنيف حسب الشعبة', T('<th>الشعبة</th><th>المختبرون</th><th>متفوق</th><th>متوسط</th><th>ضعيف</th><th>راسب</th><th>التكوين</th>', classes.map(c=>{const x=aggSubject(list.filter(s=>s.cls===c),l,st.pk); return `<tr><td><b>${esc(c)}</b></td><td>${x.n}</td><td class="c-exc">${x.exc}</td><td class="c-mid">${x.mid}</td><td class="c-weak">${x.weak}</td><td class="${x.fail?'c-fail':''}">${x.fail}</td><td>${stack(x)}</td></tr>`;}).join(''))+LEG_TIERS):''}
  ${group('exc','الطلاب المتفوقون ≥90%')}
  ${group('mid','الطلاب متوسطو المستوى 65%–89.9%')}
  ${group('weak','الطلاب الضعاف أقل من 65%')}
  </div>`;
}

    <label>المادة <select data-set="crSubject"><option value="__all">جميع المواد</option>${labels.map(l=>`<option ${st.crSubject===l?'selected':''}>${esc(l)}</option>`).join('')}</select></label></div></div>`;

        return `<tr class="click" data-act="student" data-v="${esc(x.st.id)}"><td>${i+1}</td><td>${esc(x.st.id)}</td><td class="nm">${esc(x.st.name)}</td>${PKG[st.pk].keys.length>1||st.pk==='year'?`<td class="c-mut">${comp}</td>`:''}<td><bdi dir="ltr"><b>${p.total==null?'–':nf(p.total)}</b> / ${p.max}</bdi></td><td class="${toneCls(p.pct)}">${pc(p.pct)}</td><td>${tierTag(p)}</td></tr>`; }).join('')))}
    ${sig([['معلم المادة',teacherOfClass(d,c,st.crSubject,st.pk)],['منسق القسم',coordName(st.crSubject)],['النائب الأكاديمي',SETTINGS.deputy]])}</div>`;
  }
  const A=aggAll(L,labels,st.pk), S=studentsAgg(L,st.pk), GA=aggAll(gradeL,labels,st.pk);
  const subs=labels.map(l=>({l, a:aggSubject(L,l,st.pk), g:aggSubject(gradeL,l,st.pk)}));

  ${sig([['النائب الأكاديمي',SETTINGS.deputy],['مدير المدرسة',SETTINGS.principal]])}</div>`;
}

// ---------- المعلمون ----------
function pTeachers(){
  if(role()==='teacher'){ const d0=D(); return teacherDetail((d0&&d0.scoped&&d0.scoped.teacher)||me().n); }
  if(st.teacher) return teacherDetail(st.teacher);
  const d=D(), list=scope(), labels=labelsIn(list);
  const tabs=[['school','مستوى المدرسة'],['dept','مستوى القسم (المادة)'],['class','مستوى الشعبة'],['years','عبر الأعوام']];
  const tabBar=`<div class="tabs">${tabs.map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${st.tTab===k?'on':''}">${l}</button>`).join('')}</div>`;
  const ts=teachersFor(d,st.pk);
  if(!ts.length && st.tTab!=='years') return `<div class="sheet">${RH('تقارير المعلمين','')}${tabBar}${empty('لا توجد قائمة معلمين لهذا الاختبار','<br>ارفع قائمة المعلمين في بطاقة الاختبار نفسه من صفحة "الأعوام والملفات".')}</div>`;
  const G=teacherAgg(d,list,st.pk);
  const allA=aggAll(list,labels,st.pk), covered=G.reduce((x,g)=>x+g.a.n,0);
  const missing=[]; [...new Set(list.map(s=>s.cls))].sort(byCls).forEach(c=>labels.forEach(l=>{ if(!ts.some(t=>t.cls===normClass(c)&&t.subjectKey===l) && results(list.filter(s=>s.cls===c),l,st.pk).length) missing.push({c,l}); }));

    ${sec('ترتيب المعلمين على مستوى المدرسة', T('<th>م</th><th class="l">المعلم</th><th class="l">المادة</th><th>الشعب</th>'+AGG_HEAD+'<th>التكوين</th>',

  } else if(st.tTab==='dept'){
    sub='مقارنة المعلمين داخل كل قسم';
    const depts=labels.map(l=>({l, a:aggSubject(list,l,st.pk), g:G.filter(x=>x.subject===l)})).filter(x=>x.g.length);
    body = sec('ملخص الأقسام', T('<th class="l">القسم (المادة)</th><th>المعلمون</th>'+AGG_HEAD+'<th>الفارق بين المعلمين</th>',

      + depts.map(x=>sec(`قسم ${x.l}`, rankBars(x.g.map(g=>({label:g.name, v:g.a.ach, act:'teacher', key:g.name})), {lo:floorOf(x.g.map(g=>g.a.ach))})
        + T('<th class="l">المعلم</th><th class="l">الشعب</th>'+AGG_HEAD+'<th>مقابل القسم</th>', x.g.map(g=>{ const df=g.a.ach-x.a.ach; return `<tr class="click" data-act="teacher" data-v="${esc(g.name)}"><td class="l">${esc(g.name)}</td><td class="l">${esc(g.classes.map(c=>c.cls).join('، '))}</td>${aggCells(g.a)}<td class="${df>=0?'c-exc':'c-fail'}">${sgn(df)}</td></tr>`; }).join('')), `نسبة تحصيل القسم ${pc(x.a.ach)}`)).join('');
  } else if(st.tTab==='class'){
    sub='معلمو كل شعبة وأداؤهم';
    const classes=[...new Set(list.map(s=>s.cls))].sort(byCls);
    body = sec('المعلمون حسب الشعبة', T('<th class="l">المادة</th><th class="l">المعلم</th>'+AGG_HEAD+'<th>مقابل متوسط الصف</th>',
      classes.map(c=>{ const L=list.filter(s=>s.cls===c), gL=d.students.filter(s=>s.grade===gradeOf(c));

          return `<tr><td class="l">${esc(l)}</td><td class="l">${t?`<a href="#" data-act="teacher" data-v="${esc(t.name)}">${esc(t.name)}</a>`:'<span class="c-mut">غير محدد</span>'}</td>${aggCells(a)}<td class="${df==null?'':df>=0?'c-exc':'c-fail'}">${df==null?'–':sgn(df)}</td></tr>`; }).join('');
        return `<tr class="grp-row"><td colspan="10">الشعبة ${esc(c)} — نسبة التحصيل ${pc(aggAll(L,labels,st.pk).ach)}</td></tr>${rows}`; }).join('')));
  } else {

    }
  }
  const src=teacherSource(d,st.pk);
  const srcNote = (st.pk!=='year' && src && src!==st.pk) ? `<p class="note">لم تُرفع قائمة معلمين لاختبار ${PKG[st.pk].label}، فاستُخدمت قائمة ${PKG[src].label}.</p>` : '';
  return `<div class="sheet">${RH('تقارير المعلمين', sub)}${tabBar}${srcNote}${body}</div>`;
}
function teacherDetail(name){

  const hist=(upto.length?upto:d.availPkgs).map(k=>{ const g=teacherAgg(d,d.students,k).filter(x=>x.name===name); const items=g.flatMap(x=>x.items); return {k, g, a:agg(items.map(x=>x.p)), classes:g.flatMap(x=>x.classes.map(c=>c.cls))}; });

  const changes=[]; for(let i=1;i<hist.length;i++){ if(hist[i].k==='year'||!hist[i].g.length||!hist[i-1].g.length) continue; const a=new Set(hist[i-1].classes), b=new Set(hist[i].classes); const add=[...b].filter(x=>!a.has(x)), rem=[...a].filter(x=>!b.has(x)); if(add.length||rem.length) changes.push(`${PK_SHORT[hist[i].k]}: ${add.length?'أُضيفت '+add.join('، '):''}${add.length&&rem.length?' — ':''}${rem.length?'لم يعد يدرّس '+rem.join('، '):''}`); }

  <div class="profile"><div><h3>${esc(name)}</h3><div class="m"><span>المادة: ${esc(subjects.join('، '))}</span><span>الشعب (${PK_SHORT[cur.k]}): ${esc(cur.classes.join('، '))}</span>${email?`<span>${esc(email)}</span>`:''}</div></div>
    <div class="big"><div class="v">${pc(cur.a.ach)}</div><div class="l">نسبة التحصيل الإجمالية — ${pkName}</div></div></div>
  <div class="kpis">${kpi('الطلاب',cur.a.n)}${kpi('نسبة التحصيل',pc(cur.a.ach))}${kpi('نسبة النجاح',pc(cur.a.passRate),`${cur.a.pass} من ${cur.a.n}`)}${kpi('متفوق',cur.a.exc,pc(cur.a.excRate),'exc')}${kpi('متوسط',cur.a.mid,pc(cur.a.midRate),'mid')}${kpi('ضعيف',cur.a.weak,pc(cur.a.weakRate),'weak')}${kpi('راسب',cur.a.fail,'','fail')}</div>

}

  ${classes.length>1?sec('أوائل الشعب', T('<th>الشعبة</th><th class="l">الأول</th><th>المتوسط</th><th class="l">الثاني</th><th>المتوسط</th><th class="l">الثالث</th><th>المتوسط</th>',

  ${bands.map(([l,lo,hi])=>{ const arr=all.filter(x=>x.m.avg>=lo&&x.m.avg<hi); return sec(`${l} (${arr.length})`, arr.length?tbl(arr):'<p class="note">لا يوجد طلاب.</p>'); }).join('')}

// ---------- الإنذار المبكر ----------
function pRisk(){
  const d=D(), list=scope(), labels=labelsIn(list);
  const R=list.map(s=>({s, r:riskOf(s,d,st.pk)})).filter(x=>x.r.score>0).sort((a,b)=>b.r.score-a.r.score);
  const hi=R.filter(x=>x.r.score>=60), md=R.filter(x=>x.r.score>=30&&x.r.score<60), lo=R.filter(x=>x.r.score<30);
  const fails=resultsAll(list,labels,st.pk).filter(x=>x.p.counted&&!x.p.pass).sort((a,b)=>byCls(a.st.cls,b.st.cls)||a.st.name.localeCompare(b.st.name,'ar'));
  const lvl = v => v>=60?'<span class="tag fail">عالية</span>':v>=30?'<span class="tag weak">متوسطة</span>':'<span class="tag mid">منخفضة</span>';
  const rTable = arr => T('<th>م</th><th class="l">اسم الطالب</th><th>الشعبة</th><th>الدرجة</th><th>المستوى</th><th>المتوسط</th><th>راسب</th><th>ضعيف</th><th class="l">الأسباب</th>',
    arr.map((x,i)=>`<tr class="click" data-act="student" data-v="${esc(x.s.id)}"><td>${i+1}</td><td class="nm">${esc(x.s.name)}</td><td>${esc(x.s.cls)}</td><td><b>${x.r.score}</b></td><td>${lvl(x.r.score)}</td><td class="${toneCls(x.r.sm.avg)}">${pc(x.r.sm.avg)}</td><td class="${x.r.sm.fails?'c-fail':''}">${x.r.sm.fails}</td><td>${x.r.sm.weak}</td><td class="l" style="white-space:normal">${esc(x.r.reasons.join('، '))}</td></tr>`).join(''));
  let fRows=''; let last=null;
  fails.forEach(x=>{ if(x.st.cls!==last){ last=x.st.cls; fRows+=`<tr class="grp-row"><td colspan="5">الشعبة ${esc(last)}</td></tr>`; } fRows+=`<tr class="click" data-act="student" data-v="${esc(x.st.id)}"><td class="nm">${esc(x.st.name)}</td><td class="l">${esc(x.label)}</td><td><bdi dir="ltr">${nf(x.p.total)} / ${x.p.max}</bdi></td><td class="c-fail">${pc(x.p.pct)}</td><td>${nf(x.p.max*PASS/100 - x.p.total)}</td></tr>`; });
  return `<div class="sheet">${RH('الإنذار المبكر','الطلاب الذين يحتاجون تدخّلاً أكاديمياً')}
  <div class="kpis">${kpi('خطورة عالية (60+)',hi.length,'طالباً','fail')}${kpi('خطورة متوسطة (30–59)',md.length,'طالباً','weak')}${kpi('خطورة منخفضة',lo.length,'طالباً','mid')}${kpi('نتائج راسبة',fails.length,`${new Set(fails.map(x=>x.st.id)).size} طالباً`,'fail')}${kpi('على حافة الرسوب',R.filter(x=>!x.r.sm.fails&&x.r.edge.length).length,'ناجحون الآن','weak')}</div>
  <p class="note">درجة الخطورة (0–100) تجمع: عدد مواد الرسوب، عدد المواد الضعيفة، المتوسط العام، تراجع المتوسط بين أول وآخر اختبار، الغياب، والإنذار الاستباقي: النجاح بنسبة 50–55% (حافة الرسوب)، والتراجع 15 نقطة فأكثر في مادة عن الاختبار السابق.</p>
  ${sec('خطورة عالية ومتوسطة', (hi.length+md.length)?rTable([...hi,...md]):'<p class="note">لا توجد حالات.</p>')}
  ${proactiveSection(d, list, st.pk)}
  ${sec('النتائج الراسبة حسب الشعبة', fails.length?T('<th class="l">اسم الطالب</th><th class="l">المادة</th><th>الدرجة</th><th>النسبة</th><th>ينقصه للنجاح</th>', fRows):'<p class="note">لا توجد نتائج راسبة.</p>')}
  </div>`;

function buildWorkbook(list, pk){
  const d=D(), labels=labelsIn(list,pk), wb=XLSX.utils.book_new();
  const r=x=>x==null?'':r1(x);
  const add=(name,aoa)=>{ const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!views']=[{RTL:true}]; XLSX.utils.book_append_sheet(wb,ws,name); };
  const H=['الحاضرون','غائب','معذور','محروم','نسبة التحصيل %','نسبة النجاح %','متفوق','متوسط','ضعيف','راسب'];
  const C=a=>[a.n,a.absent,a.excused,a.deprived,r(a.ach),r(a.passRate),a.exc,a.mid,a.weak,a.fail];
  add('المواد',[['المادة',...H,'الوسيط','الانحراف'],...labels.map(l=>{const a=aggSubject(list,l,pk); return [l,...C(a),r(a.median),r(a.sd)];})]);
  const classes=[...new Set(list.map(s=>s.cls))].sort(byCls);
  add('الشعب',[['الشعبة',...H,'ناجح في الكل %'],...classes.map(c=>{const L=list.filter(s=>s.cls===c); return [c,...C(aggAll(L,labels,pk)),r(studentsAgg(L,pk).allPassRate)];})]);
  add('المعلمون',[['المعلم','المادة','الشعب',...H],...teacherAgg(d,list,pk).map(g=>[g.name,g.subject,g.classes.map(c=>c.cls).join('، '),...C(g.a)])]);
  add('تصنيف الطلاب',[['الرقم','الاسم','الشعبة','المادة','الدرجة','من','النسبة %','التصنيف'],...resultsAll(list,labels,pk).filter(x=>x.p.counted).map(x=>[x.st.id,x.st.name,x.st.cls,x.label,x.p.total,x.p.max,r(x.p.pct),!x.p.pass?'راسب':TIER_LABEL[tierKey(x.p.pct)]])]);
  if(d.availPkgs.includes('year')){ const yl=labelsIn(list,'year'); add('النتائج من 100',[['الرقم','الاسم','الشعبة',...yl,'المجموع الكلي','المتوسط','الحالة'],...[...list].sort((a,b)=>byCls(a.cls,b.cls)||a.name.localeCompare(b.name,'ar')).map(s=>{const m=studentSum(s,'year'); return [s.id,s.name,s.cls,...yl.map(l=>{const p=RR(s,l,'year')&&s.subj[l].pkg.year; return p?(p.special||(p.total??'')):'';}),m.total??'',m.offAvg!=null?r(m.offAvg):r(m.avg),m.status];})]); }
  add('الإنذار المبكر',[['الرقم','الاسم','الشعبة','درجة الخطورة','المتوسط %','راسب','ضعيف','الأسباب'],...list.map(s=>({s,r:riskOf(s,d,pk)})).filter(x=>x.r.score>0).sort((a,b)=>b.r.score-a.r.score).map(x=>[x.s.id,x.s.name,x.s.cls,x.r.score,r(x.r.sm.avg),x.r.sm.fails,x.r.sm.weak,x.r.reasons.join('، ')])]);
  return wb;
}

// ---------- قراءة Excel في Web Worker (مع رجوع تلقائي للقراءة العادية) ----------
const XLSX_URL = (document.querySelector('script[src*="xlsx"]')||{}).src || '';
let PARSE_WORKER=null, WORKER_OFF=false, WJOB=0; const WPEND=new Map();
function getWorker(){
  if(WORKER_OFF || !XLSX_URL || typeof Worker==='undefined') return null;
  if(PARSE_WORKER) return PARSE_WORKER;
  try{
    const src=`importScripts(${JSON.stringify(XLSX_URL)});\n${CORE_SRC}\n`+
      `self.onmessage=e=>{const m=e.data;try{if(m.kind==='analyze'){self.postMessage({id:m.id,ok:true,r:analyze(m.sheets,m.tb)});return;}const wb=XLSX.read(new Uint8Array(m.buf),{type:'array'});self.postMessage({id:m.id,ok:true,r:parseWorkbook(wb,m.name,m.mtime,m.expect)});}catch(err){self.postMessage({id:m.id,ok:false,msg:String(err&&err.message||err)});}};`;
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
    w.onmessage=e=>{ const j=WPEND.get(e.data.id); if(!j) return; WPEND.delete(e.data.id); e.data.ok?j.res(e.data.r):j.rej(new Error(e.data.msg)); };
    w.onerror=e=>{ if(e&&e.preventDefault) e.preventDefault(); WORKER_OFF=true; PARSE_WORKER=null; for(const j of WPEND.values()) j.rej(Object.assign(new Error('worker'),{worker:true})); WPEND.clear(); try{ w.terminate(); }catch(_){} };
    return PARSE_WORKER=w;
  }catch(e){ WORKER_OFF=true; return null; }
}
const parseMain=(buf,name,mtime,expect)=>parseWorkbook(XLSX.read(new Uint8Array(buf),{type:'array'}),name,mtime,expect);
async function parseFile(f, expect){
  const mtime=f.lastModified||Date.now(), w=getWorker();
  if(w){
    try{ const buf=await f.arrayBuffer(); return await new Promise((res,rej)=>{ const id=++WJOB; WPEND.set(id,{res,rej}); w.postMessage({id,buf,name:f.name,mtime,expect},[buf]); }); }
    catch(e){ if(!e.worker) throw e; }
  }
  return parseMain(await f.arrayBuffer(), f.name, mtime, expect);
}

//   ملاحظة: المنصة تعمل دون خادم، فالحماية هنا تنظيمية داخل المتصفح (تقييد العرض)،
//   وكلمات المرور تُحفظ مُجزّأة (SHA-256 مع ملح) لا نصاً صريحاً.
// ===================================================================
const ROLES = {
  admin:     {label:'مدير النظام',      deny:[]},
  principal: {label:'مدير المدرسة',     deny:['data','audit']},
  vp:        {label:'النائب الأكاديمي',  deny:['data','audit']},
  coord:     {label:'منسق مادة',        deny:['data','settings','quality','audit']},
  teacher:   {label:'معلم',             deny:['data','settings','quality','audit']},
};
const FULL_ROLES = ['admin','principal','vp'];
const EMERGENCY = {u:'admin', n:'مدير النظام (حساب الطوارئ)', r:'admin', s:'', emergency:true};
function roleOf(t){
  const x=norm(t);
  if(!x) return null;
  if(/مدير\s*(ال)?نظام|admin/i.test(x)) return 'admin';
  if(/مدير\s*(ال)?مدرس/.test(x)) return 'principal';
  if(/نائب/.test(x)) return 'vp';
  if(/منسق/.test(x)) return 'coord';
  if(/معلم|مدرس/.test(x)) return 'teacher';
  return null;
}

// ---------- SHA-256 (تنفيذ داخلي يعمل دون اتصال وعلى file://) ----------
function sha256(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(str), l=b.length, n=((l+9+63)>>6)<<6, m=new Uint8Array(n); m.set(b); m[l]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4, l*8>>>0); dv.setUint32(n-8, Math.floor(l/0x20000000));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const W=new Uint32Array(64), r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++) W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3), s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10); W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0; }
    let [a,b2,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&b2)^(a&c)^(b2&c)))>>>0; h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b2; b2=a; a=(t1+t2)>>>0; }
    H=H.map((v,i)=>(v+[a,b2,c,d,e,f,g,h][i])>>>0);
  }
  return H.map(v=>v.toString(16).padStart(8,'0')).join('');
}
const newSalt = () => Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('');
const hashPw = (pw,salt) => sha256(salt+'|'+String(pw));
const userKey = u => String(u||'').trim().toLowerCase();

const PROJ = new WeakMap();
// اسم المعلم في قوائم المعلمين المطابق لاسم المستخدم
function teacherNameIn(d, u){ const nm=norm(u.n); for(const rows of Object.values(d.teachersByPkg||{})) for(const t of rows) if(norm(t.name)===nm) return t.name; return null; }
function projectData(d, u){
  if(!d || !u || FULL_ROLES.includes(u.r)) return d;
  let cache=PROJ.get(d); if(!cache){ cache=new Map(); PROJ.set(d,cache); }
  const ck=u.r+'|'+u.u+'|'+u.n+'|'+u.s; if(cache.has(ck)) return cache.get(ck);
  const subj=d.subjects.filter(l=>u.s && sameSubject(l,u.s));
  let allowed=null, tname=null;
  if(u.r==='teacher'){
    tname=teacherNameIn(d,u);
    const rows=Object.values(d.teachersByPkg||{}).flat().filter(t=>tname && t.name===tname && t.subjectKey && subj.includes(t.subjectKey));
    allowed=new Set(rows.map(t=>t.cls));
  }
  let out=null;
  if(subj.length && (!allowed || allowed.size)){
    const students=d.students.filter(s=>subj.some(l=>s.subj[l]) && (!allowed || allowed.has(normClass(s.cls))))
      .map(s=>({id:s.id, name:s.name, cls:s.cls, grade:s.grade, subj:Object.fromEntries(subj.filter(l=>s.subj[l]).map(l=>[l,s.subj[l]]))}));   // دون المجموع العام لبقية المواد
    if(students.length){
      const teachersByPkg=Object.fromEntries(Object.entries(d.teachersByPkg||{}).map(([k,rows])=>[k, rows.filter(t=>t.subjectKey && subj.includes(t.subjectKey) && (!allowed || t.name===tname))]));
      const availPkgs=d.availPkgs.filter(pk=>students.some(s=>Object.values(s.subj).some(R=>R.pkg&&R.pkg[pk])));
      out={...d, students, subjects:subj, teachersByPkg, availPkgs,
        grades:[...new Set(students.map(s=>s.grade).filter(g=>g!=null))].sort((a,b)=>a-b),
        classes:[...new Set(students.map(s=>s.cls).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true})),
        scoped:{role:u.r, subject:subj[0], teacher:tname}};
    }
  }
  cache.set(ck,out); return out;
}

function parseUsersSheet(rows){
  const H=['الاسم','الماده','الوظيفه','اسم المستخدم','كلمه المرور'];
  let hr=-1, col={};
  for(let i=0;i<Math.min(rows.length,12);i++){
    const r=(rows[i]||[]).map(x=>norm(x));
    const ui=r.findIndex(x=>/اسم\s*المستخدم|username|user/i.test(x)), pi=r.findIndex(x=>/كلمه\s*(ال)?(مرور|سر)|password/i.test(x));
    if(ui>=0 && pi>=0){ hr=i; col={u:ui, p:pi, n:r.findIndex((x,j)=>j!==ui && /^الاسم|اسم الموظف|الاسم الكامل/.test(x)), s:r.findIndex(x=>/ماده|قسم/.test(x)), r:r.findIndex(x=>/وظيف|صلاحي|الدور/.test(x))}; break; }
  }
  if(hr<0) return {error:`لم يُعثر على صف العناوين. الأعمدة المطلوبة: ${H.join('، ').replace(/ه\b/g,'ة')}.`};
  const users=[], errors=[], seen=new Set();
  rows.slice(hr+1).forEach((r,i)=>{
    const line=hr+i+2, g=k=>col[k]>=0 ? String(r[col[k]]??'').trim() : '';
    const u=userKey(g('u')), p=g('p'), n=g('n'), s=g('s'), rr=roleOf(g('r'));
    if(!u && !p && !n) return;
    if(!u){ errors.push(`السطر ${line}: اسم المستخدم فارغ.`); return; }
    if(!p){ errors.push(`السطر ${line} (${u}): كلمة المرور فارغة.`); return; }
    if(!rr){ errors.push(`السطر ${line} (${u}): الوظيفة "${g('r')}" غير معروفة. القيم المقبولة: مدير النظام، مدير المدرسة، النائب الأكاديمي، منسق مادة، معلم.`); return; }
    if(seen.has(u)){ errors.push(`السطر ${line}: اسم المستخدم "${u}" مكرر.`); return; }
    if((rr==='coord'||rr==='teacher') && !s){ errors.push(`السطر ${line} (${u}): ${ROLES[rr].label} يحتاج إلى المادة.`); return; }
    seen.add(u); const salt=newSalt();
    users.push({u, n:n||u, s, r:rr, salt, h:hashPw(p,salt), pw:p});
  });
  if(!CLOUD && !users.some(x=>x.r==="admin")) return {error:'يجب أن يحتوي الملف على مستخدم واحد على الأقل بوظيفة "مدير النظام"، حتى لا تُغلق المنصة على الجميع.', errors};
  return {users, errors};
}

}

// ---------- ضغط النص (لملفات الرصد المقروءة) ----------
async function gzipB64(text){
  if(typeof CompressionStream==='undefined') return 'raw:'+text;
  const s=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
  return 'gz:'+u8b64(new Uint8Array(await new Response(s).arrayBuffer()));
}
async function gunzipB64(s){
  if(s.startsWith('raw:')) return s.slice(4);
  const bin=atob(s.slice(3)), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(st).text();
}
const clean = o => JSON.parse(JSON.stringify(o));   // Firestore لا يقبل undefined

const cacheKey = y => `cloud:${(me()&&me().u)||''}:${role()}:${y}`;
async function cacheGet(y, stamp){ try{ const c=await STORE.get(cacheKey(y)); return c && stamp && c.stamp===stamp ? c : null; }catch(e){ return null; } }
function cachePut(y, v){ try{ STORE.set(cacheKey(y), v).catch(()=>{}); }catch(e){} }

async function loadYearCloud(y, stamp){
  const db=CLOUD.db, r=role(), yref=db.collection('years').doc(y);
  let c=await cacheGet(y, stamp);
  if(r==='admin'){
    if(!c){
      const parts=(await yref.collection('blob').get()).docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);
      let cards={};
      if(parts.length){ try{ cards=JSON.parse(await gunzipB64(parts.map(p=>p.data).join(''))); }catch(e){ console.error(e); } }
      c={stamp, cards}; cachePut(y, c);
    }
    YEARS[y]={cards:{...emptyYear().cards, ...c.cards}, data:null};
    await buildYearAsync(y);
    return;
  }
  if(!c){
    let q=yref.collection('units');
    if(r==='coord') q=q.where('subject','==',me().s);
    if(r==='teacher') q=q.where('teachers','array-contains',me().n);
    const [metaS, us, fs] = await Promise.all([
      yref.collection('meta').doc('info').get(), q.get(),
      isFull() ? yref.collection('finals').get() : Promise.resolve({docs:[]}) ]);
    c={stamp, meta:metaS.exists?metaS.data():{subjects:[], byPkg:{}}, units:us.docs.map(d=>d.data()), finals:fs.docs.map(d=>d.data())};
    cachePut(y, c);
  }
  YEARS[y]={cards:emptyYear().cards, data:c.units.length?dataFromUnits(c.units,c.finals,c.meta):null};
}

// إعادة بناء كائن البيانات من وحدات (مادة × شعبة)
function dataFromUnits(units, finals, meta){
  const people=new Map();
  units.forEach(u=>(u.students||[]).forEach(s=>{
    let P=people.get(s.id); if(!P){ P={id:s.id, name:s.name, cls:s.cls, grade:s.grade, subj:{}}; people.set(s.id,P); }
    P.subj[u.subject]={keys:new Set(s.keys||[]), comps:s.comps||{}};
  }));
  finals.forEach(f=>(f.rows||[]).forEach(x=>{ const P=people.get(x.id); if(P) P.final=x.final; }));
  const students=[...people.values()];
  students.forEach(P=>Object.values(P.subj).forEach(R=>{ R.pkg={}; PKG_ORDER.forEach(pk=>{ R.pkg[pk]=pkgCalc(R,pk); }); }));
  const present=new Set(units.map(u=>u.subject));
  const subjects=(meta.subjects||[]).filter(l=>present.has(l)).concat([...present].filter(l=>!(meta.subjects||[]).includes(l)));
  const availPkgs=PKG_ORDER.filter(pk=>students.some(P=>Object.values(P.subj).some(R=>R.pkg[pk])));
  const displayKeys=KEY_ORDER.filter(k=>students.some(P=>Object.values(P.subj).some(R=>R.keys.has(k))));
  const grades=[...new Set(students.map(s=>s.grade).filter(g=>g!=null))].sort((a,b)=>a-b);
  const classes=[...new Set(students.map(s=>s.cls).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar',{numeric:true}));
  return {students, subjects, teachersByPkg:meta.byPkg||{}, grades, classes, sources:[], displayKeys, availPkgs, cloud:true};
}

async function cloudCommit(ops){ for(let i=0;i<ops.length;i+=400){ const b=CLOUD.db.batch(); ops.slice(i,i+400).forEach(o=>o.del?b.delete(o.ref):b.set(o.ref,o.data)); await b.commit(); } }
async function cloudPublishYear(y){
  if(!CLOUD || role()!=='admin') return;
  const db=CLOUD.db, yref=db.collection('years').doc(y), Y=YEARS[y], d=Y&&Y.data;
  busy(`جارٍ الحفظ في قاعدة البيانات (${y})…`);
  try{
    const ops=[], old=[];
    for(const sub of ['units','finals','blob','meta']) (await yref.collection(sub).get()).docs.forEach(x=>old.push(x.ref));
    const stamp=new Date().toISOString();
    ops.push({ref:yref, data:{year:y, updatedAt:stamp, students:d?d.students.length:0}});
    // ملفات الرصد المقروءة (لإعادة البناء عند مدير النظام)
    const blob=await gzipB64(JSON.stringify(Y.cards)), CH=700000;
    for(let i=0,n=0;i<blob.length;i+=CH,n++) ops.push({ref:yref.collection('blob').doc(String(n)), data:{i:n, data:blob.slice(i,i+CH)}});
    if(d){
      ops.push({ref:yref.collection('meta').doc('info'), data:clean({subjects:d.subjects, byPkg:d.teachersByPkg})});
      for(const l of d.subjects) for(const c of d.classes){
        const L=d.students.filter(s=>s.cls===c && s.subj[l]); if(!L.length) continue;
        const teachers=[...new Set(Object.values(d.teachersByPkg).flat().filter(t=>t.subjectKey===l && t.cls===normClass(c)).map(t=>t.name))];
        ops.push({ref:yref.collection('units').doc(cellId(`${l}__${c}`)), data:clean({subject:l, cls:c, grade:gradeOf(c), teachers,
          students:L.map(s=>({id:s.id, name:s.name, cls:s.cls, grade:s.grade, keys:[...s.subj[l].keys], comps:s.subj[l].comps}))})});
      }
      for(const c of d.classes){ const rows=d.students.filter(s=>s.cls===c && s.final).map(s=>({id:s.id, final:s.final})); if(rows.length) ops.push({ref:yref.collection('finals').doc(cellId(c)), data:clean({cls:c, rows})}); }
    }
    // حذف الوثائق القديمة التي لم تعد موجودة فقط، ثم الكتابة
    const keepPaths=new Set(ops.map(o=>o.ref.path));
    await cloudCommit(old.filter(r=>!keepPaths.has(r.path)).map(ref=>({del:true, ref})));
    await cloudCommit(ops);
    cachePut(y, {stamp, cards:Y.cards});
    setSaveState('محفوظة في قاعدة البيانات');
  }catch(e){ console.error(e); setSaveState('تعذّر الحفظ في قاعدة البيانات'); alert('تعذّر الحفظ في قاعدة البيانات: '+(e.message||e)); }
  finally{ busy(''); }
}

// رسوم بيانية احترافية (SVG) — تُطبع وتُصدَّر PDF بوضوح

const CC = {navy:'#14365d', blue:'#2a62a6', blue2:'#1f4e85', green:'#1d7a4e', amber:'#b0701a', red:'#b3322d', gold:'#b08a2e', gray:'#94a3b8', grid:'#dbe1e8', txt:'#475569', ink:'#17212e'};
const TEST_COLORS = {mid1:'#a9c1e0', end1:'#6d93c9', mid2:'#3b6db0', end2:'#1f4e85', year:'#b08a2e'};
const TIER_COLORS = {exc:CC.green, mid:CC.blue, weak:CC.amber, fail:CC.red};
const r0 = x => Math.round(x);
// تقسيم التسمية الطويلة على سطرين
function wrapLabel(s, max){
  s=String(s); if(s.length<=max) return [s];
  const w=s.split(' '); let a='', i=0;
  while(i<w.length && (a+' '+w[i]).trim().length<=max){ a=(a+' '+w[i]).trim(); i++; }
  if(!a){ a=w[0]; i=1; }
  let b=w.slice(i).join(' '); if(b.length>max+2) b=b.slice(0,max)+'…';
  return b?[a,b]:[a];
}
const svgText = (x,y,lines,cls='',anchor='middle',lh=13) => `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${lines.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join('')}</text>`;
const chartLegend = items => `<div class="legend">${items.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;

// أعمدة رأسية مجمّعة: cats = تسميات الفئات، series = [{name,color,data:[...]}]
// opt: lo, hi, target (رقم أو مصفوفة لكل فئة), unit, H, labels
function colChart(cats, series, opt={}){
  const vals=series.flatMap(s=>s.data).filter(v=>v!=null);
  if(!vals.length) return '<p class="note">لا توجد بيانات.</p>';
  const unit=opt.unit??'%';
  const lo = opt.lo ?? (unit==='%' ? floorOf([...vals, ...(Array.isArray(opt.target)?opt.target:opt.target!=null?[opt.target]:[])]) : 0);
  const hi = opt.hi ?? (unit==='%' ? 100 : Math.max(1,...vals)*1.12);
  const W=opt.W||720, H=opt.H||270, pr=40, pl=12, pt=22;
  const cw=(W-pl-pr)/cats.length, maxChars=Math.max(4, Math.floor(cw/6.6));
  const lines=cats.map(c=>wrapLabel(c,maxChars)), pb=16+Math.max(...lines.map(l=>l.length))*13;
  const ih=H-pt-pb, y=v=>pt+ih-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo)*ih;
  const n=series.length, gw=cw*(n>1?0.82:0.56), bw=Math.min(46, gw/n), gap=n>1?Math.min(2,bw*.12):0;
  const step = unit==='%' ? ((hi-lo)>50?25:(hi-lo)>20?10:5) : niceStep((hi-lo)/4);
  let g='';
  for(let t=lo; t<=hi+1e-9; t+=step) g+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${W-pr+6}" y="${y(t)+4}" text-anchor="start">${r1(t)}${unit==='%'?'':''}</text>`;
  g+=`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${y(lo)}" y2="${y(lo)}"/>`;
  const showVals = opt.labels!==false && bw>=13;
  const fs = bw>=26?11:bw>=18?10:9;
  let bars='';
  cats.forEach((c,i)=>{
    const cx=W-pr-(i+0.5)*cw, x0=cx+ (n*bw)/2;     // الترتيب من اليمين إلى اليسار
    series.forEach((s,j)=>{
      const v=s.data[i]; if(v==null) return;
      const x=x0-(j+1)*bw+gap/2, yy=y(v), h=Math.max(1,y(lo)-yy);
      const col=typeof s.color==='function'?s.color(v,i):s.color;
      bars+=`<rect class="tp" data-tip="${esc(c)}${n>1?' — '+esc(s.name):''}: ${unit==='%'?r1(v)+'%':r0(v)}${opt.tipExtra?esc(opt.tipExtra(i,j)):''}" x="${x}" y="${yy}" width="${bw-gap}" height="${h}" rx="2" fill="${col}"/>`;
      if(showVals) bars+=`<text class="vt" x="${x+(bw-gap)/2}" y="${yy-4}" text-anchor="middle" style="font-size:${fs}px">${unit==='%'?r1(v):r0(v)}</text>`;
    });
    bars+=svgText(cx, H-pb+16, lines[i], cw<34?'cl sm':'cl');
  });
  let tg='';
  if(Array.isArray(opt.target)) cats.forEach((c,i)=>{ const t=opt.target[i]; if(t==null) return; const cx=W-pr-(i+0.5)*cw; tg+=`<line class="tg" x1="${cx-gw/2-3}" x2="${cx+gw/2+3}" y1="${y(t)}" y2="${y(t)}"/>`; });
  else if(opt.target!=null) tg=`<line class="tg" x1="${pl}" x2="${W-pr}" y1="${y(opt.target)}" y2="${y(opt.target)}"/>`;
  const leg = (n>1||opt.target!=null) ? chartLegend([...(n>1?series:[]), ...(opt.target!=null?[{name:Array.isArray(opt.target)?'المستهدف لكل مادة':`المستهدف ${opt.target}%`,color:CC.red}]:[])]) : '';
  return `<figure class="chart">${opt.title?`<figcaption>${esc(opt.title)}</figcaption>`:''}<svg class="ch" direction="ltr" viewBox="0 0 ${W} ${H}" role="img">${g}${bars}${tg}</svg>${leg}</figure>`;
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1e-9)))), m=x/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }

// أعمدة مكدّسة 100% لتوزيع المستويات: rows=[{exc,mid,weak,fail}] بالأعداد (الضعيف هنا بدون الراسب)
function tierCols(cats, rows, opt={}){
  if(!rows.some(r=>r && (r.exc+r.mid+r.weak+r.fail))) return '<p class="note">لا توجد بيانات.</p>';
  const W=opt.W||720, H=opt.H||250, pr=40, pl=12, pt=14;
  const cw=(W-pl-pr)/cats.length, maxChars=Math.max(4,Math.floor(cw/6.6)), lines=cats.map(c=>wrapLabel(c,maxChars)), pb=16+Math.max(...lines.map(l=>l.length))*13;
  const ih=H-pt-pb, bw=Math.min(64, cw*0.6);
  let g=''; for(let t=0;t<=100;t+=25){ const yy=pt+ih-t/100*ih; g+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${W-pr+6}" y="${yy+4}" text-anchor="start">${t}%</text>`; }
  let b='';
  cats.forEach((c,i)=>{
    const r=rows[i]; const cx=W-pr-(i+0.5)*cw; b+=svgText(cx,H-pb+16,lines[i],cw<34?'cl sm':'cl');
    if(!r) return; const tot=r.exc+r.mid+r.weak+r.fail; if(!tot) return;
    let acc=0;
    for(const k of ['fail','weak','mid','exc']){
      const v=r[k]/tot*100; if(!v) continue;
      const y1=pt+ih-(acc+v)/100*ih, h=v/100*ih;
      b+=`<rect class="tp" data-tip="${esc(c)} — ${TIER_TIP[k]}: ${r[k]} (${r1(v)}%)" x="${cx-bw/2}" y="${y1}" width="${bw}" height="${h}" fill="${TIER_COLORS[k]}"/>`;
      if(h>=13 && bw>=24) b+=`<text class="iv" x="${cx}" y="${y1+h/2+4}" text-anchor="middle">${r1(v)}%</text>`;
      acc+=v;
    }
  });
  return `<figure class="chart">${opt.title?`<figcaption>${esc(opt.title)}</figcaption>`:''}<svg class="ch" direction="ltr" viewBox="0 0 ${W} ${H}" role="img">${g}${b}</svg>${chartLegend([{name:'متفوق ≥ 90%',color:CC.green},{name:'متوسط 65 – 89.9%',color:CC.blue},{name:'ضعيف 50 – 64.9%',color:CC.amber},{name:'راسب أقل من 50%',color:CC.red}])}</figure>`;
}
const TIER_TIP={exc:'متفوق ≥ 90%',mid:'متوسط 65 – 89.9%',weak:'ضعيف 50 – 64.9%',fail:'راسب أقل من 50%'};
const tierRow = a => a ? {exc:a.exc, mid:a.mid, weak:Math.max(0,a.weak-a.fail), fail:a.fail} : null;

// حلقة توزيع المستويات
function donut(parts, center, sub, opt={}){
  const tot=parts.reduce((s,p)=>s+p.n,0); if(!tot) return '<p class="note">لا توجد بيانات.</p>';
  const R=62, S=26, C=2*Math.PI*R; let off=0;
  const arcs=parts.filter(p=>p.n).map(p=>{ const len=p.n/tot*C; const s=`<circle class="tp" data-tip="${esc(p.label)}: ${p.n} (${r1(p.n/tot*100)}%)" cx="90" cy="90" r="${R}" fill="none" stroke="${p.color}" stroke-width="${S}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`; off+=len; return s; }).join('');
  return `<figure class="chart donut">${opt.title?`<figcaption>${esc(opt.title)}</figcaption>`:''}<div class="dn"><svg class="dsv" direction="ltr" width="180" height="180" viewBox="0 0 180 180">${arcs}<text class="dc" x="90" y="92" text-anchor="middle">${esc(center)}</text><text class="ds" x="90" y="112" text-anchor="middle">${esc(sub||'')}</text></svg>
    <table class="dl">${parts.map(p=>`<tr><td><i style="background:${p.color}"></i>${esc(p.label)}</td><td><b>${p.n}</b></td><td><bdi dir="ltr">${r1(p.n/tot*100)}%</bdi></td></tr>`).join('')}</table></div></figure>`;
}
const tierDonut = (a, title) => donut([{label:'متفوق ≥ 90%',n:a.exc,color:CC.green},{label:'متوسط 65 – 89.9%',n:a.mid,color:CC.blue},{label:'ضعيف 50 – 64.9%',n:Math.max(0,a.weak-a.fail),color:CC.amber},{label:'راسب أقل من 50%',n:a.fail,color:CC.red}], `${r1(a.ach??0)}%`, 'نسبة التحصيل', {title});
const achColor = v => v>=EXC?CC.green:v>=80?CC.blue:v>=WEAK?'#6d93c9':v>=PASS?CC.amber:CC.red;

// ===================================================================
// تقرير المعلم التراكمي: مقارنة أدائه في الاختبار المحدد بكل الاختبارات التي قبله
// ===================================================================
function teacherCompare(d, name, hist, cur){
  const H=hist.filter(h=>h.g.length), ci=H.indexOf(cur);
  const subjects=[...new Set(H.flatMap(h=>h.g.map(x=>x.subject)))];
  const grades=[...new Set(H.flatMap(h=>h.classes.map(c=>gradeOf(c))))];
  const dept=k=>{ const L=d.students.filter(s=>grades.includes(s.grade)); return agg(resultsAll(L,subjects,k).map(x=>x.p)); };
  const rows=hist.map(h=>{
    if(!h.g.length) return `<tr><td class="l">${PKG[h.k].label}</td><td colspan="10" class="c-mut">لا يوجد في قائمة المعلمين لهذا الاختبار</td></tr>`;
    const i=H.indexOf(h), p=i>0?H[i-1]:null, dA=p&&h.a.ach!=null&&p.a.ach!=null?h.a.ach-p.a.ach:null, dP=p&&h.a.passRate!=null&&p.a.passRate!=null?h.a.passRate-p.a.passRate:null;
    return `<tr${h===cur?' style="font-weight:700;background:var(--navy-soft)"':''}><td class="l">${PKG[h.k].label}</td><td class="l" style="white-space:normal">${esc(h.classes.join('، '))}</td>${aggCells(h.a)}<td class="${dA==null?'':dA>=0?'c-exc':'c-fail'}">${sgn(dA)}</td><td class="${dP==null?'':dP>=0?'c-exc':'c-fail'}">${sgn(dP)}</td></tr>`;
  }).join('');
  const tbl=T('<th class="l">الاختبار</th><th class="l">الشعب</th>'+AGG_HEAD+'<th>تغيّر التحصيل</th><th>تغيّر النجاح</th>', rows);
  const changes=[]; for(let i=1;i<H.length;i++){ if(H[i].k==='year') continue; const a=new Set(H[i-1].classes), b=new Set(H[i].classes); const add=[...b].filter(x=>!a.has(x)), rem=[...a].filter(x=>!b.has(x)); if(add.length||rem.length) changes.push(`${PK_SHORT[H[i].k]}: ${add.length?'أُضيفت '+add.join('، '):''}${add.length&&rem.length?' — ':''}${rem.length?'لم يعد يدرّس '+rem.join('، '):''}`); }
  const chNote = changes.length?`<p class="note"><b>تغيّر الشعب بين الاختبارات:</b> ${esc(changes.join(' · '))}. التغيّر في النسب يتأثر بتغيّر الشعب.</p>`:'';
  if(H.length<2) return sec('نتائج الاختبار', tbl + '<p class="note">لا توجد اختبارات سابقة لهذا المعلم للمقارنة.</p>');
  // ملخص المقارنة نصاً
  const first=H[0], dd=cur.a.ach!=null&&first.a.ach!=null?cur.a.ach-first.a.ach:null, prev=ci>0?H[ci-1]:null, dp=prev&&cur.a.ach!=null&&prev.a.ach!=null?cur.a.ach-prev.a.ach:null;
  const dc=dept(cur.k), gap=cur.a.ach!=null&&dc.ach!=null?cur.a.ach-dc.ach:null;
  const lines=[];
  if(dp!=null) lines.push(`نسبة التحصيل في ${PKG[cur.k].label} ${r1(cur.a.ach)}%، ${Math.abs(dp)<0.5?'مستقرة':dp>0?`بارتفاع ${r1(dp)} نقطة`:`بانخفاض ${r1(-dp)} نقطة`} عن ${PKG[prev.k].label}.`);
  if(dd!=null && H.length>2) lines.push(`مقارنةً بأول اختبار (${PKG[first.k].label}): ${dd>=0?'+':''}${r1(dd)} نقطة.`);
  if(gap!=null) lines.push(Math.abs(gap)<0.05 ? 'نسبة تحصيل طلابه مساوية لمتوسط المادة في الصفوف نفسها.' : `نسبة تحصيل طلابه ${gap>0?'أعلى':'أقل'} من متوسط المادة في الصفوف نفسها بـ ${r1(Math.abs(gap))} نقطة.`);
  const best=H.filter(h=>h.a.ach!=null).sort((a,b)=>b.a.ach-a.a.ach)[0];
  if(best) lines.push(`أعلى نسبة تحصيل له خلال الفترة: ${PKG[best.k].label} (${r1(best.a.ach)}%).`);
  const summary=`<div class="lead"><ul style="margin:0;padding-inline-start:20px">${lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
  const cats=H.map(h=>PK_SHORT[h.k]);
  const charts=`<div class="chart-row">
     <figure class="chart"><figcaption>اتجاه نسبة التحصيل والنجاح</figcaption>${lineChart([{name:'نسبة التحصيل',data:H.map(h=>h.a.ach),color:CC.blue2},{name:'نسبة النجاح',data:H.map(h=>h.a.passRate),color:CC.green}], cats)}</figure>
     ${colChart(cats, [{name:'طلاب المعلم',color:CC.navy,data:H.map(h=>h.a.ach)},{name:'متوسط المادة في الصفوف نفسها',color:'#a9b8cc',data:H.map(h=>dept(h.k).ach)}], {W:420,H:250,title:'تحصيل طلابه مقابل متوسط المادة'})}</div>
     ${tierCols(cats, H.map(h=>tierRow(h.a)), {H:230, title:'توزيع مستويات طلابه في كل اختبار'})}`;
  // الشعب عبر الاختبارات
  const keys=[...new Map(H.flatMap(h=>h.g.flatMap(g=>g.classes.map(c=>[c.cls+'|'+g.subject,{cls:c.cls,subject:g.subject}])))).values()].sort((a,b)=>byCls(a.cls,b.cls)||a.subject.localeCompare(b.subject,'ar'));
  const cell=(h,k)=>{ const g=h.g.find(x=>x.subject===k.subject); const c=g&&g.classes.find(x=>x.cls===k.cls); return c?c.a:null; };
  const multiSub=subjects.length>1;
  const cT=T('<th>الشعبة</th>'+(multiSub?'<th class="l">المادة</th>':'')+H.map(h=>`<th>${PK_SHORT[h.k]}</th>`).join('')+'<th>التغيّر</th><th>متوسط الصف '+PK_SHORT[cur.k]+'</th>',
    keys.map(k=>{ const v=H.map(h=>cell(h,k)); const vals=v.map(a=>a&&a.ach).filter(x=>x!=null); const ch=vals.length>1?vals[vals.length-1]-vals[0]:null;
      const ga=aggSubject(d.students.filter(s=>s.grade===gradeOf(k.cls)),k.subject,cur.k);
      return `<tr><td><b>${esc(k.cls)}</b></td>${multiSub?`<td class="l">${esc(k.subject)}</td>`:''}${v.map(a=>a?`<td class="h ${heat(a.ach)}">${nf(a.ach)}</td>`:'<td class="c-mut">—</td>').join('')}<td class="${ch==null?'':ch>=0?'c-exc':'c-fail'}">${sgn(ch)}</td><td>${pc(ga.ach)}</td></tr>`; }).join(''), '', 'heat');
  return sec(cur.k==='year'?'أداؤه في جميع اختبارات العام':`مقارنة أدائه في ${PKG[cur.k].label} بالاختبارات السابقة`, summary + tbl + chNote + charts)
    + sec('نسبة التحصيل لكل شعبة عبر الاختبارات', cT + LEG_HEAT + '<p class="note">"—" = لم يدرّس الشعبة في هذا الاختبار. "التغيّر" = الفرق بين أول وآخر اختبار درّس فيه الشعبة (بالنقاط).</p>');
}
// تقدّم الطلاب وتراجعهم مقارنةً بالاختبار السابق
function teacherMovers(d, hist, cur){
  const H=hist.filter(h=>h.g.length), ci=H.indexOf(cur); if(ci<1) return '';
  const prev=H[ci-1], out=[];
  for(const g of cur.g) for(const x of g.items){ if(!x.p.counted) continue; const R=x.st.subj[g.subject], q=R&&R.pkg&&R.pkg[prev.k]; if(q&&q.counted) out.push({st:x.st, subject:g.subject, a:q.pct, b:x.p.pct, d:x.p.pct-q.pct}); }
  if(!out.length) return '';
  const up=out.filter(x=>x.d>=5).sort((a,b)=>b.d-a.d), dn=out.filter(x=>x.d<=-5).sort((a,b)=>a.d-b.d), stable=out.length-up.length-dn.length;
  const multi=new Set(out.map(x=>x.subject)).size>1;
  const t=arr=>arr.length?T('<th class="l">الاسم</th><th>الشعبة</th>'+(multi?'<th class="l">المادة</th>':'')+`<th>${PK_SHORT[prev.k]}</th><th>${PK_SHORT[cur.k]}</th><th>الفرق</th>`, arr.slice(0,12).map(x=>`<tr class="click" data-act="student" data-v="${esc(x.st.id)}"><td class="nm">${esc(x.st.name)}</td><td>${esc(x.st.cls)}</td>${multi?`<td class="l">${esc(x.subject)}</td>`:''}<td>${pc(x.a)}</td><td class="${toneCls(x.b)}">${pc(x.b)}</td><td class="${x.d>=0?'c-exc':'c-fail'}"><b>${sgn(x.d)}</b></td></tr>`).join('')):'<p class="note">لا يوجد.</p>';
  return sec(`تقدّم الطلاب مقارنةً بـ${PKG[prev.k].label}`, `<div class="kpis">${kpi('طلاب مشتركون في الاختبارين',out.length)}${kpi('تحسّنوا 5 نقاط فأكثر',up.length,pc(up.length/out.length*100),'exc')}${kpi('مستقرون',stable,pc(stable/out.length*100),'mid')}${kpi('تراجعوا 5 نقاط فأكثر',dn.length,pc(dn.length/out.length*100),'fail')}</div>
    <div class="cols"><div><div class="sub-h">الأكثر تحسّناً</div>${t(up)}</div><div><div class="sub-h">الأكثر تراجعاً</div>${t(dn)}</div></div>
    <p class="note">المقارنة بالنسبة المئوية لدرجة الطالب في المادة نفسها، لأن الدرجة العظمى تختلف بين الاختبارات (30 و50 و100).</p>`);
}

// ===================================================================
// تصدير التقارير إلى PDF (A4) — يُرسم التقرير كما يظهر ثم يُقسَّم على الصفحات
// دون قطع الصفوف، مع تكرار رأس الجدول في كل صفحة جديدة
// ===================================================================
const MM = 96/25.4;              // بكسل لكل مليمتر
let PDF_CSS_READY = false;
// قواعد الطباعة نفسها مطبّقة على حاوية PDF
function ensurePdfCss(){
  if(PDF_CSS_READY) return;
  const css=document.querySelector('style').textContent;
  const i=css.indexOf('@media print{'); let out='';
  if(i>=0){
    let depth=0, j=i+'@media print{'.length, start=j;
    for(; j<css.length; j++){ if(css[j]==='{') depth++; else if(css[j]==='}'){ if(depth===0) break; depth--; } }
    const body=css.slice(start,j);
    out = body.replace(/([^{}]+)\{([^{}]*)\}/g, (m,sel,decl)=>{
      const s=sel.split(',').map(x=>x.trim()).filter(Boolean).map(x=>/^(:root|html|body|\*)$/.test(x)?'.pdfmode':'.pdfmode '+x).join(',');
      return `${s}{${decl}}`;
    });
  }
  const st=document.createElement('style');
  st.textContent = out + `
.pdfmode{position:absolute;left:-30000px;top:0;background:#fff;color:#000;font-family:var(--font);direction:rtl}
.pdfmode .sheet{box-shadow:none;border:0;padding:0;margin:0 0 40px;max-width:none;background:#fff}
.pdfmode .only-print{display:block}
.pdfmode .noprint,.pdfmode .r-tools,.pdfmode .tabs,.pdfmode textarea,.pdfmode button,.pdfmode input,.pdfmode select{display:none!important}
.pdfmode .tw{overflow:visible}
.pdfmode *{letter-spacing:0!important;word-spacing:normal!important}`;
  document.head.appendChild(st); PDF_CSS_READY=true;
}
function cleanHtml(html){
  const t=document.createElement('template'); t.innerHTML=html;
  t.content.querySelectorAll('.noprint,.r-tools,.tabs,textarea,input,select,button').forEach(e=>e.remove());
  t.content.querySelectorAll('[data-act]').forEach(e=>{ e.removeAttribute('data-act'); e.removeAttribute('data-v'); e.classList.remove('click'); });
  return t.innerHTML;
}
const frame = () => new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));

// نقاط القطع المسموح بها داخل ورقة: أسفل الصفوف والفقرات وأعلى الأقسام (بالبكسل من أعلى الورقة)
function breakPoints(sheet){
  const top=sheet.getBoundingClientRect().top, pts=[], forced=[], zones=[];
  const R=e=>{ const r=e.getBoundingClientRect(); return {t:r.top-top, b:r.bottom-top}; };
  const inCols = e => e.closest('.cols, .chart-row, .chart') && !e.matches('.cols, .chart-row, .chart');
  const add=(y,info)=>pts.push({y, ...info});
  sheet.querySelectorAll('tbody tr').forEach(tr=>{
    if(inCols(tr)) return;
    const tbl=tr.closest('table'), th=tbl.querySelector('thead');
    const r=tr.getBoundingClientRect(), tr2=tbl.getBoundingClientRect(), hr=th?th.getBoundingClientRect():null;
    add(r.bottom-top, {table:{top:tr2.top-top, bottom:tr2.bottom-top, head: hr?{top:hr.top-top, bottom:hr.bottom-top}:null}});
  });
  sheet.querySelectorAll('.sec, .sig, .keep, .pb, .cols, .kpis, .profile, .to, .chart, .chart-row, .sub-h, .tw, .bars, .legend, .note, .lead').forEach(e=>{ if(!inCols(e)) add(R(e).t,{}); });
  sheet.querySelectorAll('.bar, .dv, li, p, .legend, .kpis, .rh, .cols, .profile, .lead, .sub-h, .warn, .chart, .chart-row, .tw, .bars, .axis').forEach(e=>{ if(!inCols(e)) add(R(e).b,{}); });
  sheet.querySelectorAll('.pb').forEach(e=>forced.push(R(e).t));
  // مناطق يُمنع القطع داخلها
  sheet.querySelectorAll('.sec>h2').forEach(h=>{ const s=R(h.parentElement), r=R(h); zones.push([s.t, Math.min(s.b, r.b+110)]); });   // العنوان مع بداية محتواه
  sheet.querySelectorAll('.sub-h').forEach(h=>{ const r=R(h), n=h.nextElementSibling; zones.push([r.t, n?Math.min(R(n).b, r.b+90):r.b]); });
  sheet.querySelectorAll('.chart, .chart-row, .kpis, .profile, .to, .rh, .sig, .keep, .dn, .lead, .legend, .axis').forEach(e=>{ const r=R(e); zones.push([r.t, r.b]); });
  sheet.querySelectorAll('table').forEach(t=>{ if(inCols(t)) return; const rows=t.querySelectorAll('tbody tr'); if(!rows.length) return; const r=R(t), k=rows[Math.min(2,rows.length-1)]; zones.push([r.t, R(k).b-1]); const last=rows[rows.length-1], pre=rows[Math.max(0,rows.length-3)]; if(rows.length>4) zones.push([R(pre).t+1, R(last).b-1]); });
  sheet.querySelectorAll('.bars').forEach(e=>{ if(inCols(e)) return; const bs=e.querySelectorAll('.bar, .dv'); if(bs.length>2){ zones.push([R(e).t, R(bs[2]).b-1]); zones.push([R(bs[Math.max(0,bs.length-3)]).t+1, R(e).b-1]); } });
  const ok = y => !zones.some(([a,b])=>y>a+1 && y<b-1);
  const uniq=[...new Map(pts.filter(p=>ok(p.y)).sort((a,b)=>a.y-b.y).map(p=>[Math.round(p.y*2)/2+(p.table?'t':''),p])).values()];
  return {pts:uniq.sort((a,b)=>a.y-b.y), forced:forced.sort((a,b)=>a-b)};
}

async function htmlToPdf(html, onSheet){
  ensurePdfCss();
  const host=document.createElement('div'); host.className='pdfmode';
  host.innerHTML = cleanHtml(html);
  document.body.appendChild(host);
  let sheets=[...host.querySelectorAll(':scope > .sheet, :scope .view > .sheet')];
  if(!sheets.length){ sheets=[...host.querySelectorAll('.sheet')]; }
  if(!sheets.length){ const w=document.createElement('div'); w.className='sheet'; while(host.firstChild) w.appendChild(host.firstChild); host.appendChild(w); sheets=[w]; }
  const pdf = new jspdf.jsPDF({unit:'mm', format:'a4', orientation: sheets[0].classList.contains('wide')?'l':'p', compress:true});
  let first=true;
  try{
    for(const sh of sheets){
      const wide=sh.classList.contains('wide');
      const pw=wide?297:210, ph=wide?210:297, mx=wide?7:10, my=wide?7:10;
      const cwMm=pw-2*mx, chMm=ph-2*my;
      sh.style.width=(cwMm*MM)+'px';
      await frame();
      const scale=1.5;
      const canvas=await html2canvas(sh,{scale, backgroundColor:'#ffffff', logging:false, useCORS:true});
      const H=sh.getBoundingClientRect().height;
      const {pts, forced}=breakPoints(sh);
      const pageH=chMm*MM;
      let y=0, carryHead=null;
      while(y < H-1){
        const headH = carryHead ? (carryHead.bottom-carryHead.top) : 0;
        let end = y + pageH - headH;
        if(end < H){
          const f=forced.find(v=>v>y+20 && v<end);
          if(f!=null) end=f;
          else { let c=pts.filter(p=>p.y>y+(pageH-headH)*0.35 && p.y<=end); if(!c.length) c=pts.filter(p=>p.y>y+20 && p.y<=end); if(c.length) end=c[c.length-1].y; }
        } else end=H;
        // الصفحة: رأس جدول مكرر (إن وُجد) ثم الجزء [y, end]
        const sliceH=end-y, totalH=sliceH+headH;
        const pc=document.createElement('canvas'); pc.width=canvas.width; pc.height=Math.ceil(totalH*scale);
        const ctx=pc.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,pc.width,pc.height);
        if(carryHead) ctx.drawImage(canvas, 0, carryHead.top*scale, canvas.width, headH*scale, 0, 0, canvas.width, headH*scale);
        ctx.drawImage(canvas, 0, y*scale, canvas.width, sliceH*scale, 0, headH*scale, canvas.width, sliceH*scale);
        if(!first) pdf.addPage('a4', wide?'l':'p');
        first=false;
        pdf.addImage(pc.toDataURL('image/jpeg',0.8),'JPEG', mx, my, cwMm, totalH/MM, undefined, 'FAST');
        // هل انقطع جدول؟ نكرر رأسه في الصفحة التالية
        const bp=pts.find(p=>Math.abs(p.y-end)<0.5 && p.table);
        carryHead = (bp && bp.table.head && end < bp.table.bottom-1) ? bp.table.head : null;
        y=end;
      }
      if(onSheet) await onSheet();
    }
  } finally { host.remove(); }
  // ترقيم الصفحات
  const n=pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){ pdf.setPage(i); const w=pdf.internal.pageSize.getWidth(), h=pdf.internal.pageSize.getHeight(); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`${i} / ${n}`, w/2, h-3.5, {align:'center'}); }
  return pdf.output('blob');
}

// قراءة ملف النسخة (JSON، ويُقبل أيضاً ملف مضغوط يحتويه)
async function readBackupFile(f){
  let text;
  if(/\.zip$/i.test(f.name) && typeof JSZip!=='undefined'){
    const z=await JSZip.loadAsync(await f.arrayBuffer());
    const e=Object.values(z.files).find(x=>!x.dir && /\.json$/i.test(x.name));
    if(!e) throw new Error('الملف المضغوط لا يحتوي على نسخة احتياطية.');
    text=await e.async('string');
  } else text=await f.text();
  let p; try{ p=JSON.parse(text.replace(/^﻿/,'')); }catch(e){ throw new Error('الملف ليس نسخة احتياطية صالحة (تعذّرت قراءته).'); }
  if(!p || p.app!==BACKUP_APP || p.kind!=='backup' || typeof p.years!=='object') throw new Error('هذا الملف ليس نسخة احتياطية من منصة تحليل الدرجات.');
  return p;
}
async function restoreBackup(f){
  try{
    const p=await readBackupFile(f);
    const mode=RESTORE_MODE;
    if(mode==='replace') YEARS={};
    const done=[];
    for(const [y,cards] of Object.entries(p.years)){
      YEARS[y]={cards:{...emptyYear().cards, ...cards}, data:null};
      buildYear(y); done.push(y);
    }
    if(!Object.keys(YEARS).length) YEARS={'2025-2026':emptyYear()};
    if(p.settings){
      // الإعدادات: الأهداف والمنسقون والملاحظات من النسخة، مع الاحتفاظ بملاحظات هذا الجهاز غير الموجودة فيها
      const keepNotes = mode==='merge' ? SETTINGS.notes : {};
      SETTINGS = mergeSettings(p.settings);
      SETTINGS.notes = {...keepNotes, ...(p.settings.notes||{})};
    }
    currentYear = YEARS[p.currentYear] ? p.currentYear : (done[0] || Object.keys(YEARS)[0]);
    LAST_RESTORE = {ok:true, years:done.sort(), created:p.created, mode};
    syncFilters(); await save(); renderAll();
    if(CLOUD){ for(const y of Object.keys(YEARS)) await cloudPublishYear(y); cloudSaveSettings(); }
  }catch(e){
    LAST_RESTORE = {ok:false, msg:e.message||String(e)};
    renderView();
  }
}

// الإرسال بالبريد مع إرفاق التقرير تلقائياً
//   • Outlook: يُنشأ ملف رسالة (.eml) جاهزة فيها المستلم والموضوع والنص وملف PDF مرفق،
//     يفتحه Outlook كرسالة جديدة فيضغط المستخدم "إرسال" فقط
//   • المشاركة: قائمة المشاركة في النظام (Windows / iPad / الهاتف) مع الملف مرفقاً
// ===================================================================
const u8b64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const strB64 = s => u8b64(new TextEncoder().encode(s));
const wrap76 = s => s.replace(/.{1,76}/g, '$&\r\n');
const mimeWord = s => /^[\x20-\x7e]*$/.test(s) ? s : `=?UTF-8?B?${strB64(s)}?=`;
function mailHtml(text){
  return `<!doctype html><html><head><meta charset="utf-8"></head><body dir="rtl" style="direction:rtl;text-align:right;font-family:Tahoma,Arial,sans-serif;font-size:14px;line-height:1.8;color:#17212e">`
    + text.split('\n').map(l=>l.trim()?`<div>${esc(l)}</div>`:'<div><br></div>').join('') + '</body></html>';
}
async function buildEml({to, subject, text, files}){
  const B='----=_hamza_'+Math.random().toString(36).slice(2);
  const parts=[
    `To: ${to||''}`, `Subject: ${mimeWord(subject)}`, 'X-Unsent: 1', 'MIME-Version: 1.0',
    `Content-Type: multipart/mixed; boundary="${B}"`, '', 'This is a multi-part message in MIME format.', '',
    `--${B}`, 'Content-Type: text/html; charset="utf-8"', 'Content-Transfer-Encoding: base64', '', wrap76(strB64(mailHtml(text))),
  ];
  for(const f of files){
    const b64=u8b64(new Uint8Array(await f.blob.arrayBuffer()));
    parts.push(`--${B}`, `Content-Type: ${f.type||'application/pdf'}; name="${mimeWord(f.name)}"`, 'Content-Transfer-Encoding: base64',
      `Content-Disposition: attachment; filename="${mimeWord(f.name)}"; filename*=UTF-8''${encodeURIComponent(f.name)}`, '', wrap76(b64));
  }
  parts.push(`--${B}--`, '');
  return new Blob([parts.join('\r\n')], {type:'message/rfc822'});
}
const canShareFiles = () => { try{ return !!(navigator.canShare && navigator.canShare({files:[new File(['x'],'a.pdf',{type:'application/pdf'})]})); }catch(e){ return false; } };
// إرسال تقرير: html → PDF ثم رسالة جاهزة بالمرفق
async function sendReport({to, subject, text, pdfName, html}){
  if(!pdfReady()){ alert('مكتبات PDF لم تُحمَّل. افتح الصفحة مع اتصال بالإنترنت مرة واحدة.'); return; }
  busy('جارٍ تجهيز التقرير والرسالة…'); await frame();
  let blob;
  try{ blob=await htmlToPdf(html); } finally { busy(''); }
  const mode = SETTINGS.mailMode || 'outlook';
  if(mode==='share' && canShareFiles()){
    const file=new File([blob], pdfName, {type:'application/pdf'});
    try{ await navigator.share({files:[file], title:subject, text}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  const eml=await buildEml({to, subject, text, files:[{name:pdfName, blob}]});
  download(safeName(`رسالة - ${subject}`).slice(0,150)+'.eml', eml);
  flash('نُزّلت رسالة جاهزة (.eml) فيها التقرير مرفقاً. افتحها فتظهر في Outlook رسالة جديدة، ثم اضغط "إرسال".');

  else labelsIn(d.students,pk).forEach(l=>jobs.push({dir:'', name:l, to:(SETTINGS.coordinators[l]||{}).email||'',

  let noMail=0;

      const blob=await htmlToPdf(j.html());

    }
    box.textContent='جارٍ ضغط الملفات…'; await frame();

    box.textContent=`تم تجهيز ${jobs.length} رسالة، كل رسالة فيها تقريرها مرفقاً. افتح أي رسالة لتظهر في Outlook جاهزة للإرسال.${noMail?` ${noMail} رسالة بلا عنوان بريد (أضفه في الرسالة قبل الإرسال).`:''}`;
  } finally { btns.forEach(b=>b.disabled=false); }

function annualFindings(d, seq, Ms){
  const out={pos:[],neg:[],chal:[],rec:[]}, f=nf, P=x=>r1(x)+'%';
  const tests=seq.filter(k=>k!=='year');
  if(tests.length>=2){
    const a=Ms[tests[0]].A, b=Ms[tests[tests.length-1]].A;
    if(a.ach!=null&&b.ach!=null){ const dd=b.ach-a.ach;
      if(dd>=1) out.pos.push(`ارتفعت نسبة التحصيل العامة من ${P(a.ach)} في ${PKG[tests[0]].label} إلى ${P(b.ach)} في ${PKG[tests[tests.length-1]].label} (+${f(dd)} نقطة).`);
      else if(dd<=-1) out.neg.push(`انخفضت نسبة التحصيل العامة من ${P(a.ach)} في ${PKG[tests[0]].label} إلى ${P(b.ach)} في ${PKG[tests[tests.length-1]].label} (${f(dd)} نقطة).`); }
    const labels=d.subjects;
    const upS=[], dnS=[];
    labels.forEach(l=>{ const v=tests.map(k=>aggSubject(d.students,l,k).ach).filter(x=>x!=null); if(v.length<2) return; const dd=v[v.length-1]-v[0]; if(dd>=3) upS.push(`${l} (+${f(dd)})`); else if(dd<=-3) dnS.push(`${l} (${f(dd)})`); });
    if(upS.length) out.pos.push(`مواد تحسّنت خلال العام: ${upS.join('، ')}.`);
    if(dnS.length){ out.neg.push(`مواد تراجعت خلال العام: ${dnS.join('، ')}.`); out.rec.push(`دراسة أسباب التراجع في ${dnS.map(x=>x.split(' (')[0]).join('، ')} مع رؤساء الأقسام ووضع خطة للعام القادم.`); }
    // شعب تقل عن متوسط صفها في كل الاختبارات
    const low=d.classes.filter(c=>tests.every(k=>{ const x=Ms[k].classes.find(y=>y.c===c); return x && x.gap!=null && x.gap<0; }));
    if(low.length){ out.chal.push(`شعب بقيت دون متوسط صفها في جميع اختبارات العام: ${low.join('، ')}.`); out.rec.push(`خطة متابعة مبكرة من بداية العام القادم لطلاب الشعب ${low.join('، ')}.`); }
    const high=d.classes.filter(c=>tests.every(k=>{ const x=Ms[k].classes.find(y=>y.c===c); return x && x.gap!=null && x.gap>0; }));
    if(high.length) out.pos.push(`شعب تفوقت على متوسط صفها في جميع اختبارات العام: ${high.join('، ')}.`);
  }
  return out;
}

// تقرير ديناميكي: الطلاب ضمن نطاق نسبة يحدده المستخدم (من % إلى %)
// النسبة = مجموع درجات الطالب في الاختبار المحدد ÷ مجموع الدرجات العظمى × 100 (للمواد التي حضرها)
// أو نسبة الطالب في مادة واحدة

Object.assign(st, {rFrom:90, rTo:100, rSubj:'__total'});
const RANGE_PRESETS = [[90,100,'متفوقون 90% فأكثر'],[80,90,'80% – أقل من 90%'],[65,90,'متوسطون 65% – أقل من 90%'],[65,80,'65% – أقل من 80%'],[50,65,'50% – أقل من 65%'],[0,65,'ضعاف أقل من 65%'],[0,50,'أقل من 50%']];
function rangeBounds(){ let a=+st.rFrom, b=+st.rTo; if(isNaN(a)) a=0; if(isNaN(b)) b=100; a=Math.max(0,Math.min(100,a)); b=Math.max(0,Math.min(100,b)); if(a>b) [a,b]=[b,a]; return {a,b}; }

const rangeText = (a,b) => b>=100 ? `${a}% فأكثر` : a<=0 ? `أقل من ${b}%` : `من ${a}% إلى أقل من ${b}%`;

function stuRangeRow(s, pk, subj){
  if(subj && subj!=='__total'){
    const R=s.subj[subj], p=R&&R.pkg&&R.pkg[pk]; if(!p) return null;
    if(!p.counted) return {s, pct:null, special:p.special||'غير مرصود'};
    return {s, pct:p.pct, total:p.total, max:p.max, n:1, fails:p.pass?0:1, special:''};
  }
  const sm=studentSum(s,pk);
  if(!sm.subjects) return null;
  if(!sm.counted) return {s, pct:null, special:'غائب في جميع المواد'};
  const ps=Object.values(s.subj).map(R=>R.pkg&&R.pkg[pk]).filter(p=>p&&p.counted);
  const tot=ps.reduce((x,p)=>x+p.total,0), mx=ps.reduce((x,p)=>x+p.max,0);

  return {s, pct, total: off&&sm.total!=null ? sm.total : tot, max:mx, n:sm.counted, fails:sm.fails, weak:sm.weak, status: pk==='year'?sm.status:'',

function rangeData(){
  const d=D(), pk=st.pk, {a,b}=rangeBounds();

  const valid=rows.filter(r=>r.pct!=null), hit=valid.filter(r=>inRange(r.pct,a,b)).sort((x,y)=>y.pct-x.pct||x.s.name.localeCompare(y.s.name,'ar'));

function qdModel(d, name, pk){

  for(const g of teacherAgg(d,d.students,pk).filter(x=>x.name===name)){

        {label:'نسبة النجاح في الاختبار.', vals:cols.map(c=>c.a.passRate), total:tot.passRate, unit:'%', target:tot.passRate==null?'':(tot.passRate>=t.pass?'محقق':'غير محقق'), hint:`المستهدف ${t.pass}%`},
        {label:'نسبة التحصيل الأكاديمي.', vals:cols.map(c=>c.a.ach), total:tot.ach, unit:'%', target:tot.ach==null?'':(tot.ach>=t.ach?'محقق':'غير محقق'), hint:`المستهدف ${t.ach}%`},
        {label:'القيمة المضافة في التحصيل الأكاديمي بين التقييمات.', vals:cols.map(c=>va(c.a,c.pa)), total:va(tot,ptot), unit:'pt', target:pp&&va(tot,ptot)!=null?(va(tot,ptot)>=0?'محقق':'غير محقق'):'', hint:pp?`مقارنة بـ${PKG[pp].label}`:'لا يوجد تقييم سابق'},
        {label:'3.1 نسبة الطلبة الذين يحرزون أكثر من 70%.', vals:cols.map(c=>over70(c.a)), total:over70(tot), unit:'%', target:'', hint:''},
        {label:'5.2 نسبة الطلبة الحاصلين على 90% فأعلى.', vals:cols.map(c=>c.a.excRate), total:tot.excRate, unit:'%', target:'', hint:''},
      ];

// مقترحات مبنية على نتائج كل شعبة: الحفاظ على الثبات، ورفع نسب النجاح والتحصيل
function qdSuggest(cols, tot, t, pp, ptot){
  const keep=[], raise=[], names=arr=>arr.map(x=>x.st.name.split(/\s+/).slice(0,3).join(' ')).join('، ');
  const ok=cols.filter(c=>c.a.ach!=null && c.a.ach>=t.ach && c.a.passRate>=t.pass), low=cols.filter(c=>c.a.ach!=null && !(c.a.ach>=t.ach && c.a.passRate>=t.pass));
  const va=c=>(c.pa&&c.pa.ach!=null&&c.a.ach!=null)?c.a.ach-c.pa.ach:null;
  const best=[...cols].filter(c=>c.a.ach!=null).sort((a,b)=>b.a.ach-a.a.ach)[0];
  // الحفاظ على الثبات
  if(ok.length) keep.push(`الشعب المحققة للمستهدف (تحصيل ${t.ach}% ونجاح ${t.pass}%): ${ok.map(c=>`${c.cls} (${r1(c.a.ach)}%)`).join('، ')} — الاستمرار على الاستراتيجيات الحالية فيها مع تقويم تكويني أسبوعي قصير لرصد أي تراجع مبكراً.`);
  const up=cols.filter(c=>va(c)!=null&&va(c)>=1); if(up.length) keep.push(`تثبيت التحسّن المتحقق في ${up.map(c=>`${c.cls} (+${r1(va(c))})`).join('، ')} بمراجعات دورية للمفاهيم التي تحسّن فيها الطلاب.`);
  const edge=cols.flatMap(c=>c.items.filter(x=>x.p.counted && x.p.pct>=WEAK && x.p.pct<70));
  if(edge.length) keep.push(`متابعة ${edge.length} طالباً قريبين من حد الضعف (65% – 69.9%) حتى لا يتراجعوا: ${names(edge.slice(0,12))}${edge.length>12?'…':''}.`);
  if(tot.exc) keep.push(`المحافظة على مستوى ${tot.exc} طالباً متفوقاً (90% فأكثر) بأنشطة إثرائية ومهام تفكير عليا ومسابقات.`);
  if(best && cols.length>1) keep.push(`نقل الممارسات الناجحة في الشعبة الأعلى (${best.cls}) إلى بقية الشعب عبر تبادل أوراق العمل والأنشطة.`);
  keep.push('توثيق الاستراتيجيات الفعالة في ملف المادة ومشاركتها مع زملاء القسم.');
  // رفع النسب
  low.forEach(c=>{ const gapA=t.ach-c.a.ach, gapP=t.pass-c.a.passRate;
    raise.push(`الشعبة ${c.cls}: تحصيل ${r1(c.a.ach)}%${gapA>0?` (دون المستهدف بـ ${r1(gapA)} نقطة)`:''} ونجاح ${r1(c.a.passRate)}%${gapP>0?` (دون المستهدف بـ ${r1(gapP)} نقطة)`:''} — حصص دعم أسبوعية وتجميع الطلاب حسب الاحتياج داخل الحصة.`); });
  const down=cols.filter(c=>va(c)!=null&&va(c)<=-1); if(down.length) raise.push(`تحليل أسباب التراجع عن ${pp?PKG[pp].label:'التقييم السابق'} في ${down.map(c=>`${c.cls} (${r1(va(c))})`).join('، ')} ومراجعة نواتج التعلم ذات الأداء المنخفض في ورقة الاختبار.`);
  cols.forEach(c=>{ const f=c.items.filter(x=>x.p.counted && !x.p.pass), w=c.items.filter(x=>x.p.counted && x.p.pass && x.p.pct<WEAK);
    if(f.length) raise.push(`خطة علاجية فردية وتواصل مع أولياء أمور الراسبين في ${c.cls} (${f.length}): ${names(f)}.`);
    if(w.length) raise.push(`أوراق عمل علاجية متدرجة للطلاب الضعاف في ${c.cls} (${w.length}): ${names(w.slice(0,10))}${w.length>10?'…':''}.`); });
  const mid8=cols.flatMap(c=>c.items.filter(x=>x.p.counted && x.p.pct>=80 && x.p.pct<EXC));
  if(mid8.length) raise.push(`رفع نسبة المتفوقين من ${r1(tot.excRate)}% بتحدي ${mid8.length} طالباً بين 80% و89.9% بمهام إثرائية ومراجعة أخطائهم الشائعة.`);
  raise.push('تنويع أساليب التقويم (أسئلة مستويات عليا، اختبارات قصيرة متكررة) وتحليل نتائجها لتوجيه التدريس.');
  if(!low.length && !down.length) raise.unshift('جميع الشعب محققة للمستهدف؛ يُركَّز على رفع نسبة المتفوقين وخفض عدد الضعاف.');
  return {keep, raise};
}
const qdVal = (v,unit) => v==null ? '—' : unit==='pt' ? `${v>0?'+':''}${r1(v)}` : `${r1(v)}%`;

// ---------- العرض في المنصة ----------
function qdSheet(f){
  const n=f.cols.length;
  const head=`<tr><th class="qd-diag"><span>الشعب الدراسية</span><span>بنود التقرير</span></th>${f.cols.map(c=>`<th>الشعبة<br><b>${esc(c.cls)}</b></th>`).join('')}<th>إجمالي<br>المستوى</th><th>تحقيق<br>المستهدف</th></tr>`;
  const rows=f.rows.map(r=>`<tr><th class="qd-rh">${esc(r.label)}${r.hint?`<small>${esc(r.hint)}</small>`:''}</th>${r.vals.map(v=>`<td><bdi dir="ltr">${qdVal(v,r.unit)}</bdi></td>`).join('')}<td><b><bdi dir="ltr">${qdVal(r.total,r.unit)}</bdi></b></td><td>${r.target?`<span class="tag ${r.target==='محقق'?'exc':'fail'}">${r.target}</span>`:'<span class="c-mut">اختر</span>'}</td></tr>`).join('');
  const block=(t,arr)=>`<div class="qd-sub">${t}</div><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  return `<div class="sheet qd">
    <div class="qd-top"><img src="${LOGO}" alt=""></div>
    <h1 class="qd-title">نموذج تقرير كمي وصفي</h1>
    <p class="qd-sub1">لتحليل نتائج التقييم <b>${esc(PKG[f.pk].label)}</b> لمادة <b>${esc(f.subject)}</b> للعام الأكاديمي <b><bdi>${esc(currentYear)}</bdi></b> — الصف ${f.grade}</p>
    <p class="qd-p">المنسق الفاضل: ${f.coord?`<b>${esc(f.coord)}</b>`:''}</p>
    <p class="qd-p">بعد قراءة نتائج الطلبة للصفوف التي أقوم بتدريسها، في تقييم <b>${esc(PKG[f.pk].label)}</b> نقدم لكم تقريراً كمياً ووصفياً يوضح نسب النجاح والتحصيل الأكاديمي ومستويات الطلبة المختلفة، وأسباب ارتفاع أو انخفاض نتائج الطلبة.</p>
    <div class="tw"><table class="qd-t">
      <thead>${head}</thead><tbody>${rows}
      <tr><th class="qd-rh">تفسير النتائج<br>(الأسباب/ التحديات/ الحلول)</th><td colspan="${n+2}" class="qd-txt">${block('الأسباب:',f.reasons)}${block('التحديات:',f.chal)}${block('الحلول:',f.sol)}</td></tr>
      <tr><th class="qd-rh">مقترحات الحفاظ على ثبات نسب النجاح والتحصيل</th><td colspan="${n+2}" class="qd-txt"><ul>${f.keep.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></td></tr>
      <tr><th class="qd-rh">مقترحات رفع نسب النجاح والتحصيل</th><td colspan="${n+2}" class="qd-txt"><ul>${f.raise.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></td></tr>
      <tr><th class="qd-rh">التغذية الراجعة من المنسق</th><td colspan="${n+2}" class="qd-txt" style="height:70px"></td></tr>
      <tr><th class="qd-rh">اسم المعلم وتوقيعه</th><td colspan="${Math.ceil((n+2)/2)}">${esc(f.teacher)}</td><th class="qd-rh" colspan="1">اسم المنسق وتوقيعه</th><td colspan="${Math.max(1,(n+2)-Math.ceil((n+2)/2)-1)}">${esc(f.coord||'')}</td></tr>
      </tbody></table></div>
    <p class="qd-foot">*يستخدم المعلم هذا النموذج لقراءة نتائج الطلبة بعد كل تقييم. القيمة المضافة = الفرق في نسبة التحصيل بالنقاط عن التقييم السابق. النسب للطلاب الحاضرين فقط.</p>
  </div>`;
}
function pQD(){
  const d=D(), pk=st.pk;
  const names = role()==='teacher' ? [(d.scoped&&d.scoped.teacher)||me().n] : qdTeachers(d,pk);
  if(!names.length) return `<div class="sheet">${RH('التقرير الكمي والوصفي','')}${empty('لا توجد قائمة معلمين لهذا الاختبار','<br>ارفع قائمة المعلمين لتظهر النماذج.')}</div>`;
  if(!names.includes(st.qdT)) st.qdT=names[0];
  const forms=qdModel(d, st.qdT, pk);
  const tools=`<div class="panel noprint" style="max-width:1160px;margin:0 auto 12px"><div class="range-form">
      ${names.length>1?`<label>المعلم <select data-set="qdT">${names.map(n=>`<option ${n===st.qdT?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}
      <button class="btn pri" data-act="qdword">${ico('report')}تنزيل Word للمعلم</button>
      ${role()==='teacher'?'':`<button class="btn" data-act="qdall">تنزيل نماذج جميع المعلمين (Word في ملف مضغوط)</button> <span id="qdStatus" class="note"></span>`}
    </div><p class="note">يُصدَّر هذا التقرير بصيغة Word فقط ليعدّله المعلم والمنسق: خانة "تحقيق المستهدف" قائمة اختيار، وبنود تفسير النتائج والتغذية الراجعة نصوص قابلة للتعديل. يُنشأ نموذج لكل صف يدرّسه المعلم.</p></div>`;
  if(!forms.length) return tools+`<div class="sheet">${empty('لا توجد نتائج لهذا المعلم في الاختبار المحدد')}</div>`;
  return tools + forms.map(qdSheet).join('');
}

// قائمة اختيار (Content Control) مثل "Choose an item"
function wDrop(val, items=['محقق','محقق جزئياً','غير محقق']){
  return `<w:p><w:pPr><w:bidi/><w:spacing w:after="0"/><w:jc w:val="center"/></w:pPr><w:sdt><w:sdtPr><w:alias w:val="تحقيق المستهدف"/><w:tag w:val="target"/>${val?'':'<w:showingPlcHdr/>'}<w:dropDownList><w:listItem w:displayText="اختر" w:value=""/>${items.map(x=>`<w:listItem w:displayText="${x}" w:value="${x}"/>`).join('')}</w:dropDownList></w:sdtPr><w:sdtContent>${W.run(val||'اختر', {color:val?(/^(محقق|تحققت)$/.test(val)?'1D7A4E':/جزئي/.test(val)?'B0701A':'B3322D'):'808080', b:!!val, sz:24})}</w:sdtContent></w:sdt></w:p>`;
}
function wCell(content, o={}){
  const shd=o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:'';
  const span=o.span>1?`<w:gridSpan w:val="${o.span}"/>`:'';
  const diag=o.diag?'<w:tcBorders><w:tl2br w:val="single" w:sz="6" w:color="FFFFFF"/></w:tcBorders>':'';
  return `<w:tc><w:tcPr><w:tcW w:w="${o.w||0}" w:type="dxa"/>${span}${diag}${shd}<w:vAlign w:val="${o.va||'center'}"/></w:tcPr>${content||W.p('')}</w:tc>`;
}

  const body=forms.map((f,fi)=>{

    const sect=`<w:sectPr><w:pgSz w:w="${pageW}" w:h="${landscape?11906:16838}"${landscape?' w:orient="landscape"':''}/><w:pgMar w:top="700" w:right="${margin}" w:bottom="700" w:left="${margin}" w:header="400" w:footer="400" w:gutter="0"/><w:bidi/></w:sectPr>`;
    const content = logo

      + W.p(W.run('لتحليل نتائج التقييم ',{sz:26})+W.run(PKG[f.pk].label,{b:true,sz:26})+W.run(' لمادة ',{sz:26})+W.run(f.subject,{b:true,sz:26})+W.run(' للعام الأكاديمي ',{sz:26})+W.run(currentYear,{b:true,sz:26,ltr:true})+W.run(' — الصف '+f.grade,{sz:26}),{jc:'center',after:200})

// خطة تحسين أداء الطلبة لكل شعبة (حسب نموذج المدرسة) مع تتبع الطلاب عبر الاختبارات

const PL_ORDER = ['mid1','end1','mid2','end2','year'];

  {k:'weak', label:'الطلبة ذوو الأداء المتدني', short:'متدنٍ', range:'أقل من 65%'},

const plTarget = (k,i) => { const t=(SETTINGS.planTargets&&SETTINGS.planTargets[k])||PL_DEFAULT_TG[k]; return +(i===0?t[0]:t[1]); };
const PL_ACTIONS = {

  mid:['التنويع في استراتيجيات التدريس.','إشراك الطلاب في الأنشطة اللاصفية الداخلية والخارجية.','تدريب الطلاب على أوراق عمل إثرائية تحتوي على مستويات معرفية من المستوى الثاني والثالث.','زيادة مشاركة الطلاب في الحصص الصفية.','تكليف الطلاب بواجبات منزلية إضافية.','إشراك أولياء الأمور في تحسين مستوى أبنائهم من خلال اطلاعهم على التقييم السلوكي والأكاديمي الشهري والرسائل النصية.'],
  exc:['تكليف الطلاب بإعداد مشاريع ضمن المنهج المدرسي.','تفعيل أوراق العمل الإثرائية التفاعلية من خلال منصة التعلم عن بعد.','تفعيل الدور القيادي للطلاب في التعلم التعاوني من خلال قيادة المجموعات أو تعليم الآخرين.','التشجيع المستمر للطلاب على الجد والاجتهاد.','إشراك الطلاب في الأنشطة غير الصفية والمسابقات العلمية المختلفة والبحث العلمي.','إشراك الطلاب في تنفيذ بعض استراتيجيات التدريس مثل الكرسي الساخن والمعلم الصغير.'],
};
const PL_BANDS = [{lo:90,label:'تم تحقيق الأهداف لدى 90% من الطلبة فأكثر'},{lo:80,label:'تم تحقيق الأهداف لدى 80% إلى 89% من الطلبة'},{lo:70,label:'تم تحقيق الأهداف لدى 70% إلى 79% من الطلبة'},{lo:-1,label:'تم تحقيق الأهداف لدى أقل من 70% من الطلبة'}];
const PL_LEVELS = [{lo:90,l:'المستوى الثالث',r:'أكثر من 90%'},{lo:80,l:'المستوى الثاني',r:'من 80% إلى 89%'},{lo:70,l:'المستوى الأول',r:'من 70% إلى 79%'},{lo:-1,l:'دون المستوى',r:'أقل من 70%'}];
const plLevel = v => v==null ? null : PL_LEVELS.find(x=>v>=x.lo);
const plBand = v => v==null ? -1 : PL_BANDS.findIndex(x=>v>=x.lo);
const plHead = (pk) => pk==='mid1'?'منتصف الفصل الدراسي الأول':pk==='end1'?'نهاية الفصل الدراسي الأول':pk==='mid2'?'منتصف الفصل الدراسي الثاني':pk==='end2'?'نهاية الفصل الدراسي الثاني':'نهاية العام الدراسي (الدور الأول)';

// المراجعات: اختباران بعد الأساس ثم المراجعة النهائية (الدور الأول أو نهاية الفصل الثاني)
function plReviews(d, base){
  const fin = base==='year' ? null : (d.availPkgs.includes('year') ? 'year' : (d.availPkgs.includes('end2') && base!=='end2' ? 'end2' : 'year'));
  const mids = PL_ORDER.slice(PL_ORDER.indexOf(base)+1).filter(k=>k!==fin && k!=='year').slice(0,2);
  return [...mids, ...(fin?[fin]:[])];
}
// شعب المعلم في المادة (من قوائم المعلمين)
function plClassesOf(d, name){
  const out=new Map();
  for(const rows of Object.values(d.teachersByPkg||{})) for(const t of rows) if(t.name===name && t.subjectKey){
    const cls=d.classes.find(c=>normClass(c)===t.cls); if(cls) out.set(cls+'|'+t.subjectKey,{cls, subject:t.subjectKey});
  }
  return [...out.values()].sort((a,b)=>byCls(a.cls,b.cls)||a.subject.localeCompare(b.subject,'ar'));
}
// حركة الطالب مقارنةً بالاختبار الأساس: ارتفاع (+1 فأكثر) / ثبات / انخفاض (−1 فأكثر)
function plMove(b,v){ if(v==null) return null; if(b>=99.95 && v>=99.95) return 'same'; const d=v-b; return d>=1?'up':d<=-1?'down':'same'; }
const PL_MV = {up:{l:'ارتفاع',c:'c-exc',w:'1D7A4E',i:'▲'}, same:{l:'ثبات',c:'c-mid',w:'2A62A6',i:'■'}, down:{l:'انخفاض',c:'c-fail',w:'B3322D',i:'▼'}};
const plShort = s => s.name.split(/\s+/).slice(0,3).join(' ');
function plModel(d, teacher, cls, subject, base){
  const reviews=plReviews(d, base);
  const studs=d.students.filter(s=>s.cls===cls && s.subj[subject]);
  const pct=(s,k)=>{ const p=s.subj[subject].pkg&&s.subj[subject].pkg[k]; return p&&p.counted ? p.pct : null; };
  const rows=studs.map(s=>({s, base:pct(s,base), r:reviews.map(k=>pct(s,k))})).filter(x=>x.base!=null)
    .sort((a,b)=>b.base-a.base||a.s.name.localeCompare(b.s.name,'ar'));
  const trackKeys=PL_ORDER.slice(PL_ORDER.indexOf(base)).filter(k=>k===base||d.availPkgs.includes(k)||reviews.includes(k));
  rows.forEach(x=>{ x.tier=tierKey(x.base); x.full=x.base>=99.95;
    x.ok=x.r.map((v,i)=> v==null ? null : (x.tier==='exc' && x.full ? v>=99.95 : v-x.base >= plTarget(x.tier,i)-1e-9));
    x.mv=x.r.map(v=>plMove(x.base,v));
    x.all=trackKeys.map(k=>pct(x.s,k)); x.allMv=x.all.map(v=>plMove(x.base,v)); });
  const avail=reviews.map(k=>d.availPkgs.includes(k) && rows.some(x=>x.r[reviews.indexOf(k)]!=null));
  const groups=PL_TIERS.map(T=>{
    const g=rows.filter(x=>x.tier===T.k), bs=g.map(x=>x.base);
    const rev=reviews.map((k,i)=>{
      const m=g.filter(x=>x.r[i]!=null); if(!avail[i] || !m.length) return null;
      const b0=avg(m.map(x=>x.base)), now=avg(m.map(x=>x.r[i])), ok=m.filter(x=>x.ok[i]).length;
      return {k, n:m.length, b0, now, ch:now-b0, ok, up:m.filter(x=>x.mv[i]==='up'), same:m.filter(x=>x.mv[i]==='same'), down:m.filter(x=>x.mv[i]==='down'), absent:g.filter(x=>x.r[i]==null), rate:ok/m.length*100, target:plTarget(T.k,i), met: now-b0 >= plTarget(T.k,i)-1e-9 || (T.k==='exc' && b0>=99.95 && now>=99.95)};
    });
    const last=[...rev].reverse().find(Boolean)||null;
    return {...T, g, n:g.length, share:rows.length?g.length/rows.length*100:0, avg:avg(bs), min:bs.length?Math.min(...bs):null, max:bs.length?Math.max(...bs):null, full:g.filter(x=>x.full).length, rev, last};
  });
  const lastIdx=avail.lastIndexOf(true);
  const scored=groups.filter(g=>g.last);
  const overall = scored.length ? scored.reduce((a,g)=>a+g.last.ok,0)/scored.reduce((a,g)=>a+g.last.n,0)*100 : null;
  return {teacher, cls, subject, base, reviews, trackKeys, avail, rows, groups, overall, level:plLevel(overall), lastIdx, missing:studs.length-rows.length, coord:coordName(subject), grade:gradeOf(cls)};
}
// صياغة الأهداف والمخرجات المتوقعة كمياً
function plGoal(M,g){

function plOutcome(M,g){

  </div>`;
}
function pPlan(){
  const d=D();
  const names = role()==='teacher' ? [(d.scoped&&d.scoped.teacher)||me().n] : [...new Set(Object.values(d.teachersByPkg).flat().filter(t=>t.subjectKey).map(t=>t.name))].sort((a,b)=>a.localeCompare(b,'ar'));
  if(!names.length) return `<div class="sheet">${RH('خطة تحسين الأداء','')}${empty('لا توجد قوائم معلمين','<br>ارفع قائمة المعلمين لتُربط الشعب بمعلميها.')}</div>`;
  if(!names.includes(st.plT)) st.plT=names[0];
  const cl=plClassesOf(d, st.plT);
  const keys=cl.map(x=>x.cls+'|'+x.subject); if(!keys.includes(st.plC)) st.plC=keys[0];
  st.plB = d.availPkgs.includes('mid1') ? 'mid1' : d.availPkgs.filter(k=>k!=='year')[0];   // الأساس مُثبَّت على منتصف الفصل الأول
  const tools=`<div class="panel noprint" style="max-width:1160px;margin:0 auto 12px"><div class="range-form">
    ${names.length>1?`<label>المعلم <select data-set="plT">${names.map(n=>`<option ${n===st.plT?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}
    <label>الشعبة والمادة <select data-set="plC">${cl.map(x=>`<option value="${esc(x.cls+'|'+x.subject)}" ${st.plC===x.cls+'|'+x.subject?'selected':''}>${esc(x.cls)} — ${esc(x.subject)}</option>`).join('')}</select></label>
    <div class="note" style="align-self:center">الاختبار الأساس: <b>${PKG[st.plB].label}</b> (مُثبَّت)${st.plB!=='mid1'?' — لم يُرفع منتصف الفصل الأول':''}</div>
    <button class="btn pri" data-act="plword">${ico('report')}تنزيل Word للشعبة</button>
    <button class="btn" data-act="plwordall">Word لجميع شعب المعلم</button>
    ${role()==='teacher'?'':`<button class="btn" data-act="plzip">خطط جميع المعلمين (ملف مضغوط)</button> <span id="plStatus" class="note"></span>`}</div>
    <p class="note">الفئات تُحدَّد من الاختبار الأساس (متدنٍ أقل من 65%، متوسط 65–89.9%، مرتفع 90% فأكثر)، ثم يُتابَع كل طالب في الاختبارات التالية. الزيادة المستهدفة بالنقاط: المتدني +${plTarget('weak',0)} ثم +${plTarget('weak',1)}، المتوسط +${plTarget('mid',0)} ثم +${plTarget('mid',1)}، المرتفع +${plTarget('exc',0)} ثم +${plTarget('exc',1)} مع ثبات أصحاب الدرجة الكاملة. يمكن تعديل نصوص الخطة في ملف Word.</p></div>`;
  if(!cl.length) return tools+`<div class="sheet">${empty('لا توجد شعب مسندة لهذا المعلم في قوائم المعلمين')}</div>`;
  const [c,s]=st.plC.split('|');
  return tools + plSheet(plModel(d, st.plT, c, s, st.plB));
}
