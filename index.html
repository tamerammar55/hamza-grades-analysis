function ycCalc(dd, pk, dim, key){
  let L=ycFilter(dd), labels=ycLabels(dd);
  if(dim==='grade') L=L.filter(s=>s.grade===key);
  if(dim==='class') L=L.filter(s=>s.cls===key);

  if(!L.length || !labels.length) return null;
  const a=aggAll(L,labels,pk); if(!a.taught) return null;

}
function ycItems(rows, dim){
  const set=new Set();
  rows.forEach(r=>{ const dd=r.dd, L=ycFilter(dd);
    if(dim==='grade') L.forEach(s=>set.add(s.grade));

const CW = {
  navy:'14365D', ink:'17212E', muted:'5D6878', line:'C3CCD7', soft:'F6F8FB', head:'14365D',
  tone:{'c-exc':'1D7A4E','c-mid':'2A62A6','c-weak':'B0701A','c-fail':'B3322D','c-mut':'808080'},
  heat:{h1:'B7E1C6',h2:'E2F0C4',h3:'FBE9AC',h4:'F8CFA3',h5:'F1B0AA'},

const cwTxt = el => (el.innerText||el.textContent||'').replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,'\n').trim();
const cwNum = t => /^[\s\d.,%+\-–−\/():]+$/.test(t) && /\d/.test(t);
// فقرة من نص قد يحتوي أسطراً متعددة
function cwPara(text, o={}){
  const lines=String(text).split('\n').filter(x=>x!=='');
  const runs=lines.map((l,i)=>(i?'<w:r><w:br/></w:r>':'')+W.run(l,{b:o.b, sz:o.sz||24, color:o.color, ltr:o.ltr??cwNum(l)})).join('');

}
function cwToneOf(el){ for(const k of Object.keys(CW.tone)) if(el.classList.contains(k) || el.querySelector('.'+k)) return CW.tone[k];
  const t=el.querySelector('.tag'); if(t){ for(const k of Object.keys(CW.tag)) if(t.classList.contains(k)) return CW.tag[k]; } return null; }
function cwTable(tbl, usable){
  const rows=[...tbl.querySelectorAll(':scope > thead > tr, :scope > tbody > tr')];
  if(!rows.length) return '';
  // أعمدة الشبكة من عرض خلايا أطول صف
  const ref=rows.reduce((a,r)=>{ const n=[...r.cells].reduce((s,c)=>s+(c.colSpan||1),0); return n>a.n?{n,r}:a; },{n:0,r:rows[0]});
  let ws=[]; [...ref.r.cells].forEach(c=>{ const span=c.colSpan||1, w=c.getBoundingClientRect().width/span; for(let i=0;i<span;i++) ws.push(Math.max(20,w)); });
  const sum=ws.reduce((a,b)=>a+b,0)||1, tblW=Math.round(usable*(ws.length>=4 ? 1 : Math.max(0.6, Math.min(1, tbl.getBoundingClientRect().width/(tbl.closest('.sheet').getBoundingClientRect().width||1)))));
  const grid=ws.map(w=>Math.max(300,Math.round(w/sum*tblW)));

  const tr=rows.map(r=>{
    const isHead=r.parentElement.tagName==='THEAD', isFoot=r.parentElement.classList.contains('ft'), grp=r.classList.contains('grp-row');
    let ci=0;
    const cells=[...r.cells].map(c=>{
      const span=c.colSpan||1, w=grid.slice(ci,ci+span).reduce((a,b)=>a+b,0); ci+=span;
      const t=cwTxt(c), th=c.tagName==='TH';
      const heat=Object.keys(CW.heat).find(k=>c.classList.contains(k));
      const fill = isHead ? CW.head : grp ? 'E8EFF8' : isFoot ? 'EEF1F5' : heat ? CW.heat[heat] : th ? 'E8EFF8' : null;
      const color = isHead ? 'FFFFFF' : cwToneOf(c);
      const bold = isHead || isFoot || grp || th || !!c.querySelector('b') || c.classList.contains('nm')&&false;
      const jc = c.classList.contains('l') || c.classList.contains('nm') ? 'left' : 'center';

  }).join('');
  return `<w:tbl><w:tblPr><w:bidiVisual/><w:tblW w:w="${grid.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:color="${CW.line}"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="30" w:type="dxa"/><w:left w:w="60" w:type="dxa"/><w:bottom w:w="30" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${grid.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${tr}</w:tbl>` + W.p('',{after:80});
}
function cwKpis(el, usable){
  const ks=[...el.querySelectorAll('.kpi')]; if(!ks.length) return '';
  const per=Math.min(4,ks.length), w=Math.floor(usable/per), out=[];
  for(let i=0;i<ks.length;i+=per){

      const t=['exc','mid','weak','fail'].find(x=>k.classList.contains('t-'+x));
      return wCell(cwPara(g('.l'),{sz:19,color:CW.muted,after:0,jc:'center'})+cwPara(g('.v'),{b:true,sz:34,color:t?CW.tag[t]:CW.ink,after:0,jc:'center'})+(g('.s')?cwPara(g('.s'),{sz:17,color:CW.muted,after:0,jc:'center'}):''),{w,fill:CW.soft});

async function htmlToDocx(html, title){
  ensurePdfCss();
  const host=document.createElement('div'); host.className='pdfmode'; host.innerHTML=cleanHtml(html); document.body.appendChild(host);
  const sheet=host.querySelector('.sheet')||host; const PAGE_W=11906, MARGIN=800, usable=PAGE_W-2*MARGIN;
  sheet.style.width='1000px'; await frame();
  const sheetW=sheet.getBoundingClientRect().width||1000, EMU=usable*635;
  const imgs=[]; let body='';
  const snap=async el=>{
    if(typeof html2canvas==='undefined') return cwPara('[رسم بياني — يظهر في نسخة PDF]',{color:CW.muted,jc:'center'});
    const r=el.getBoundingClientRect(); if(r.width<5||r.height<5) return '';
    const cv=await html2canvas(el,{scale:2, backgroundColor:'#ffffff', logging:false});
    const blob=await new Promise(res=>cv.toBlob(res,'image/png')); const bytes=new Uint8Array(await blob.arrayBuffer());
    imgs.push(bytes); const id=imgs.length;
    const cx=Math.round(Math.min(EMU, Math.max(EMU*(el.classList.contains('legend')?0.5:0.78), EMU*r.width/sheetW))), cy=Math.round(cx*r.height/r.width);

  const walk=async el=>{
    if(el.nodeType===3){ const t=el.textContent.trim(); if(t) body+=cwPara(t); return; }
    if(el.nodeType!==1) return;
    const cs=getComputedStyle(el); if(cs.display==='none') return;
    const c=el.classList;
    if(c.contains('rh')){
      const h1=el.querySelector('h1'), sub=el.querySelector('.ttl p'), meta=[...el.querySelectorAll('.meta > span')];
      body+=W.p(W.run(cwTxt(h1),{b:true,sz:36,color:CW.navy}),{jc:'center',after:40});

      <span class="tr"><i class="${(x.v||0)>=0?'pos':'neg'}" style="${(x.v||0)>=0?'left:50%':'left:'+(50-w)+'%'};width:${w}%"></i></span>

// ---------- أبرز الملاحظات ----------
function insights(d, list, pk){
  const out=[], labels=labelsIn(list,pk), pv=prevOf(d,pk), A=aggAll(list,labels,pk), P=x=>'\u2066'+r1(x)+'%\u2069';
  const grades=[...new Set(list.map(s=>s.grade))].filter(g=>g!=null).sort();
  if(pv){
    const B=aggAll(list,labelsIn(list,pv),pv);
    if(A.ach!=null && B.ach!=null){ const dd=A.ach-B.ach; if(Math.abs(dd)>=1) out.push({w:Math.abs(dd)*1.5, t:dd>0?'pos':'neg', text:`نسبة التحصيل العامة ${dd>0?'ارتفعت':'انخفضت'} ${r1(Math.abs(dd))} نقطة عن ${PK_SHORT[pv]} (من ${P(B.ach)} إلى ${P(A.ach)}).`}); }
    const ch=[];
    for(const g of grades){ const L=list.filter(s=>s.grade===g); for(const l of labels){ const a=aggSubject(L,l,pk), b=aggSubject(L,l,pv); if(a.n>=10 && b.n>=10 && a.ach!=null && b.ach!=null) ch.push({g,l,dd:a.ach-b.ach,a:a.ach}); } }
    const dn=ch.filter(x=>x.dd<=-3).sort((x,y)=>x.dd-y.dd), up=ch.filter(x=>x.dd>=3).sort((x,y)=>y.dd-x.dd);
    if(dn.length) out.push({w:-dn[0].dd*1.3, t:'neg', act:'subject', v:dn[0].l, text:`أكبر تراجع: ${dn[0].l} للصف ${dn[0].g} انخفضت ${r1(-dn[0].dd)} نقطة عن ${PK_SHORT[pv]}${dn.length>1?`، ومعها ${dn.length-1} ${dn.length-1===1?'مادة أخرى':'مواد أخرى'} تراجعت 3 نقاط فأكثر`:''}.`});
    if(up.length) out.push({w:up[0].dd*1.0, t:'pos', act:'subject', v:up[0].l, text:`أكبر تحسّن: ${up[0].l} للصف ${up[0].g} ارتفعت ${r1(up[0].dd)} نقطة عن ${PK_SHORT[pv]}.`});
  }
  // الفجوة بين شعب الصف الواحد في المادة نفسها
  const gaps=[];
  for(const g of grades){ const L=list.filter(s=>s.grade===g), cs=[...new Set(L.map(s=>s.cls))];
    if(cs.length<2) continue;
    for(const l of labels){ const v=cs.map(c=>({c, a:aggSubject(L.filter(s=>s.cls===c),l,pk)})).filter(x=>x.a.n>=5 && x.a.ach!=null).sort((x,y)=>y.a.ach-x.a.ach);
      if(v.length>=2){ const gp=v[0].a.ach-v[v.length-1].a.ach; if(gp>=10) gaps.push({g,l,hi:v[0],lo:v[v.length-1],gp}); } } }
  gaps.sort((x,y)=>y.gp-x.gp).slice(0,2).forEach(x=>out.push({w:x.gp*0.7, t:'warn', act:'cls', v:x.lo.c, text:`فجوة بين الشعب في ${x.l} للصف ${x.g}: الشعبة ${x.hi.c} (${P(x.hi.a.ach)}) والشعبة ${x.lo.c} (${P(x.lo.a.ach)})، بفارق ${r1(x.gp)} نقطة.`}));
  // المستهدفات
  const below=labels.map(l=>({l,a:aggSubject(list,l,pk),t:targetOf(l)})).filter(x=>x.a.n && x.a.passRate!=null && x.a.passRate<x.t.pass).sort((x,y)=>(x.a.passRate-x.t.pass)-(y.a.passRate-y.t.pass));
  if(below.length) out.push({w:(below[0].t.pass-below[0].a.passRate)*1.4+below.length, t:'neg', act:'subject', v:below[0].l, text:`${below.length===1?'مادة واحدة':below.length+' مواد'} دون مستهدف النجاح، أبعدها ${below[0].l}: ${P(below[0].a.passRate)} مقابل ${below[0].t.pass}%${below[0].a.fail?` (${below[0].a.fail} نتيجة راسبة)`:''}.`});
  else if(labels.length && A.n) out.push({w:3, t:'pos', text:`جميع المواد حققت مستهدف النجاح في ${PK_SHORT[pk]}.`});
  // الإنذار المبكر
  const R=list.map(s=>({s, r:riskOf(s,d,pk)}));
  const hi=R.filter(x=>x.r.score>=60), edge=R.filter(x=>x.r.edge.length && !x.r.sm.fails);
  if(hi.length){ let fresh=0; if(pv) fresh=hi.filter(x=>riskOf(x.s,d,pv).score<60).length;
    out.push({w:Math.min(20,hi.length*0.8), t:'neg', act:'nav', v:'risk', text:`${hi.length} طالباً في الخطورة العالية بالإنذار المبكر${fresh?`، منهم ${fresh} لم يكونوا فيها في ${PK_SHORT[pv]}`:''}.`}); }
  if(edge.length) out.push({w:Math.min(14,edge.length*0.6), t:'warn', act:'nav', v:'risk', text:`${edge.length} طالباً ناجحون الآن لكنهم على حافة الرسوب (50–55%) في مادة واحدة على الأقل؛ التدخل قبل الاختبار القادم يمنع رسوبهم.`});
  // ملاحظة على صحة الرصد
  if(pk!=='year'){ const fm=[]; for(const l of labels){ const rs=results(list,l,pk).filter(x=>x.p.counted); if(rs.length>=20){ const full=rs.filter(x=>x.p.pct>=99.99).length/rs.length*100; if(full>=50) fm.push({l,full}); } }
    fm.sort((a,b)=>b.full-a.full);
    if(fm.length) out.push({w:8+fm.length, t:'warn', act:'nav', v:'quality', text:`نسبة الدرجة الكاملة غير معتادة في ${fm.length===1?'مادة':fm.length+' مواد'}: ${fm.slice(0,5).map(x=>`${x.l} (${r1(x.full)}%)`).join('، ')}${fm.length>5?'…':''}. يُستحسن التأكد من صحة الرصد قبل اعتماد النتائج.`}); }
  // أفضل شعبة
  const cs=[...new Set(list.map(s=>s.cls))].map(c=>({c,a:aggAll(list.filter(s=>s.cls===c),labels,pk)})).filter(x=>x.a.ach!=null).sort((x,y)=>y.a.ach-x.a.ach);
  if(cs.length>2) out.push({w:2.5, t:'pos', act:'cls', v:cs[0].c, text:`الشعبة ${cs[0].c} الأعلى تحصيلاً (${P(cs[0].a.ach)})، والشعبة ${cs[cs.length-1].c} الأدنى (${P(cs[cs.length-1].a.ach)}).`});
  return out.sort((x,y)=>y.w-x.w).slice(0,6);
}
function insightsBox(d, list, pk){
  let items=[]; try{ items=insights(d,list,pk); }catch(e){ console.error(e); }

  const I={pos:'▲',neg:'▼',warn:'!'};

    <ol>${items.map(x=>`<li class="i-${x.t} ${x.act?'click':''}" ${x.act?`data-act="${x.act}" data-v="${esc(x.v)}"`:''}><i>${I[x.t]}</i><span>${esc(x.text)}</span></li>`).join('')}</ol></div>`;
}

// ---------- الإنذار الاستباقي (داخل صفحة الإنذار المبكر) ----------
function proactiveSection(d, list, pk){
  const R=list.map(s=>({s, r:riskOf(s,d,pk)})).filter(x=>!x.r.sm.fails && (x.r.edge.length || x.r.drop.length)).sort((a,b)=>b.r.score-a.r.score||byCls(a.s.cls,b.s.cls));
  const cell=(s,l)=>{ const p=s.subj[l].pkg[pk]; return `${esc(l)} <b class="${toneCls(p.pct)}">${pc(p.pct)}</b>`; };
  const dcell=(s,l,pv)=>{ const p=s.subj[l].pkg[pk], q=s.subj[l].pkg[pv]; return `${esc(l)} <span class="c-fail"><bdi dir="ltr">${r1(p.pct-q.pct)}</bdi></span>`; };
  return sec(`إنذار استباقي: ناجحون الآن ويحتاجون متابعة (${R.length})`, R.length ? T('<th>م</th><th class="l">اسم الطالب</th><th>الشعبة</th><th class="l">على حافة الرسوب (50–55%)</th><th class="l">تراجع حاد عن الاختبار السابق</th><th>المتوسط</th>',
    R.map((x,i)=>`<tr class="click" data-act="student" data-v="${esc(x.s.id)}"><td>${i+1}</td><td class="nm">${esc(x.s.name)}</td><td>${esc(x.s.cls)}</td><td class="l" style="white-space:normal">${x.r.edge.map(l=>cell(x.s,l)).join('، ')||'—'}</td><td class="l" style="white-space:normal">${x.r.drop.map(l=>dcell(x.s,l,x.r.pv)).join('، ')||'—'}</td><td class="${toneCls(x.r.sm.avg)}">${pc(x.r.sm.avg)}</td></tr>`).join(''), '', 'dense')
    + '<p class="note">هؤلاء لم يرسبوا في أي مادة، لكن نتيجتهم قريبة من حد النجاح أو انخفضت 15 نقطة فأكثر في مادة. التدخل معهم الآن أسهل وأقل كلفة من علاج الرسوب بعد وقوعه.</p>'
    : '<p class="note">لا يوجد طلاب على حافة الرسوب أو بتراجع حاد.</p>');
}

function studentExtras(s, d, cL){
  const pk=st.pk, r=riskOf(s,d,pk);
  const lvl = r.score>=60?['fail','عالية']:r.score>=30?['weak','متوسطة']:r.score>0?['mid','منخفضة']:['exc','لا يوجد'];
  const riskBox = `<div class="srisk ${lvl[0]}"><div><b>الإنذار المبكر: ${lvl[1]}</b>${r.score?` <small>(${r.score} من 100)</small>`:''}</div>${r.reasons.length?`<div>${esc(r.reasons.join(' · '))}</div>`:'<div>لا توجد مؤشرات خطر في هذا الاختبار.</div>'}</div>`;
  // القوة والضعف مقارنة بمتوسط الشعبة
  const rows=d.subjects.filter(l=>s.subj[l]).map(l=>{ const p=s.subj[l].pkg&&s.subj[l].pkg[pk]; if(!p||!p.counted) return null; const ca=aggSubject(cL,l,pk).ach; return {l, p:p.pct, ca, df:ca==null?null:p.pct-ca}; }).filter(Boolean).sort((a,b)=>b.df-a.df);
  const strong=rows.filter(x=>x.df>=2 && x.p>=80).slice(0,3), weak=rows.filter(x=>x.df<0 || x.p<WEAK).slice(-3).reverse();
  const sw = rows.length ? sec('نقاط القوة والضعف مقارنة بمتوسط الشعبة', `<div class="cols"><div>${vaBars(rows.map(x=>({label:x.l, v:x.df})))}<p class="note">الفرق بالنقاط بين نسبة الطالب ومتوسط شعبته في كل مادة (${esc(PK_SHORT[pk])}).</p></div><div>
      <div class="sub-h">نقاط القوة</div>${strong.length?`<ul class="ul">${strong.map(x=>`<li>${esc(x.l)}: ${pc(x.p)} <small class="c-exc">(<bdi dir="ltr">${fx(x.df)}</bdi> عن الشعبة)</small></li>`).join('')}</ul>`:'<p class="note">لا توجد مادة يتفوق فيها على متوسط شعبته بوضوح.</p>'}
      <div class="sub-h">تحتاج دعماً</div>${weak.length?`<ul class="ul">${weak.map(x=>`<li>${esc(x.l)}: ${pc(x.p)} <small class="c-fail">(<bdi dir="ltr">${fx(x.df)}</bdi> عن الشعبة)</small></li>`).join('')}</ul>`:'<p class="note">لا توجد مادة دون متوسط الشعبة.</p>'}</div></div>`) : '';
  // عبر الأعوام الدراسية (بالرقم نفسه)
  const ys=Object.keys(YEARS).sort(), hist=[];
  for(const y of ys){ let dd=null; try{ dd=y===currentYear?d:DY(y); }catch(e){} if(!dd) continue; const x=dd.students.find(q=>q.id===s.id); if(!x) continue;
    const row={y, cls:x.cls, pk:{}}; for(const k of ['mid1','end1','mid2','end2','year']) if(dd.availPkgs.includes(k)){ const m=studentSum(x,k); row.pk[k]=m.counted?(k==='year'&&m.offAvg!=null?m.offAvg:m.avg):null; }
    const fm=dd.availPkgs.includes('year')?studentSum(x,'year'):null; row.status=fm&&fm.status||''; hist.push(row); }
  const KS=['mid1','end1','mid2','end2','year'];
  const yearsSec = hist.length>1 ? sec('الأداء عبر الأعوام الدراسية', lineChart([{name:'متوسط الطالب',data:hist.map(h=>{ const v=KS.map(k=>h.pk[k]).filter(v=>v!=null); return v.length?v[v.length-1]:null; }),color:'var(--navy-2)'}], hist.map(h=>h.y))
      + T('<th>العام</th><th>الشعبة</th>'+KS.map(k=>`<th>${PK_SHORT[k]}</th>`).join('')+'<th>النتيجة</th>', hist.map(h=>`<tr${h.y===currentYear?' class="cur"':''}><td><bdi dir="ltr">${esc(h.y)}</bdi></td><td>${esc(h.cls)}</td>${KS.map(k=>`<td class="${toneCls(h.pk[k])}">${h.pk[k]===undefined?'<span class="c-mut">—</span>':pc(h.pk[k])}</td>`).join('')}<td>${esc(h.status)||'—'}</td></tr>`).join(''))
      + '<p class="note">يُربط الطالب بين الأعوام برقمه. المتوسط في الرسم هو آخر اختبار متاح في كل عام.</p>') : '';
  return riskBox + sw + yearsSec;
}

// ---------- تحليل النمو ----------
function pGrowth(){
  const d=D(), seq=d.availPkgs.filter(k=>k!=='year');
  if(seq.length<2) return `<div class="sheet">${RH('تحليل النمو','')}${empty('يحتاج تحليل النمو اختبارين على الأقل','<br>ارفع ملف اختبار ثانٍ لهذا العام.')}</div>`;
  if(!seq.includes(st.gA)) st.gA=seq[0];
  if(!seq.includes(st.gB) || st.gB===st.gA) st.gB=seq.filter(k=>k!==st.gA).slice(-1)[0];
  const A=st.gA, B=st.gB, list=scope(), labels=labelsIn(list,B), teacherRole=role()==='teacher';
  const pair=(s,l)=>{ const R=s.subj[l], a=R&&R.pkg&&R.pkg[A], b=R&&R.pkg&&R.pkg[B]; return a&&b&&a.counted&&b.counted ? {a:a.pct,b:b.pct,g:b.pct-a.pct} : null; };
  const stat=ps=>({n:ps.length, a:avg(ps.map(x=>x.a)), b:avg(ps.map(x=>x.b)), g:avg(ps.map(x=>x.g)), up:ps.length?ps.filter(x=>x.g>1).length/ps.length*100:null, down:ps.length?ps.filter(x=>x.g<-1).length/ps.length*100:null, wg:avg(ps.filter(x=>x.a<WEAK).map(x=>x.g)), wn:ps.filter(x=>x.a<WEAK).length});
  const subj={}; for(const l of labels) subj[l]=stat(list.map(s=>pair(s,l)).filter(Boolean));
  const TG=teacherAgg(d,list,B).map(g=>{ const ps=g.items.map(x=>pair(x.st,g.subject)).filter(Boolean); const S=stat(ps); const sg=subj[g.subject]&&subj[g.subject].g;
    return {...g, S, va:(S.g!=null&&sg!=null)?S.g-sg:null, cls:g.classes.map(c=>({cls:c.cls, S:stat(c.items.map(x=>pair(x.st,g.subject)).filter(Boolean))}))}; }).filter(g=>g.S.n);
  const units=TG.flatMap(g=>g.cls.filter(c=>c.S.n).map(c=>({t:g.name, l:g.subject, cls:c.cls, S:c.S, va:(c.S.g!=null&&subj[g.subject].g!=null)?c.S.g-subj[g.subject].g:null})));
  const opt=k=>seq.map(x=>`<option value="${x}" ${k===x?'selected':''}>${PK_SHORT[x]}</option>`).join('');
  const tools=`<div class="r-tools noprint"><label class="f">من <select data-set="gA">${opt(A)}</select></label><label class="f">إلى <select data-set="gB">${opt(B)}</select></label></div>`;
  const head='<th>طلاب</th><th>البداية</th><th>الآن</th><th>النمو</th><th>تحسّن</th><th>تراجع</th><th>نمو الضعاف</th>';
  const cells=S=>`<td>${S.n}</td><td>${pc(S.a)}</td><td class="${toneCls(S.b)}">${pc(S.b)}</td><td class="${S.g>=0?'c-exc':'c-fail'}"><b>${sgn(S.g)}</b></td><td>${pc(S.up)}</td><td>${pc(S.down)}</td><td>${S.wn?`${sgn(S.wg)} <small class="c-mut">(${S.wn})</small>`:'<span class="c-mut">—</span>'}</td>`;
  const vaSorted=[...TG].sort((x,y)=>(y.va??-99)-(x.va??-99));
  return `<div class="sheet">${RH('تحليل النمو', `تقدّم الطلاب أنفسهم من ${PK_SHORT[A]} إلى ${PK_SHORT[B]}`, [['العام الدراسي',currentYear],['الفترة',`${PK_SHORT[A]} ← ${PK_SHORT[B]}`],['النطاق',scopeName()],['تاريخ الإصدار',TODAY]])}
  ${tools}
  <p class="note">النمو = متوسط تغيّر نسبة الطالب نفسه بين الاختبارين، ولا يدخل فيه إلا الطالب الذي له نتيجة في الاختبارين. ${teacherRole?'':'<b>الأثر المضاف</b> = نمو طلاب المعلم ناقص نمو المادة نفسها في المدرسة؛ وهو أعدل من الدرجة المطلقة لأنه يلغي اختلاف صعوبة الاختبارين ومستوى الطلاب عند البداية.'} "نمو الضعاف" لمن بدأ أقل من 65%.</p>
  ${sec('النمو حسب المادة', T('<th class="l">المادة</th>'+head, labels.filter(l=>subj[l].n).map(l=>`<tr class="click" data-act="subject" data-v="${esc(l)}"><td class="l">${esc(l)}</td>${cells(subj[l])}</tr>`).join('')))}
  ${!teacherRole && TG.length>1 ? sec('الأثر المضاف للمعلمين', vaBars(vaSorted.filter(g=>g.va!=null).map(g=>({label:`${g.name} — ${g.subject}`, v:g.va, act:'teacher', key:g.name}))) + '<p class="note">يمين الخط: نمو طلاب المعلم أعلى من نمو المادة في المدرسة. يسار الخط: أقل منه. الفرق أقل من نقطتين لا يُعد فارقاً حقيقياً.</p>') : ''}
  ${sec('النمو حسب المعلم', T('<th class="l">المعلم</th><th class="l">المادة</th><th>الشعب</th>'+head+(teacherRole?'':'<th>الأثر المضاف</th>'), vaSorted.map(g=>`<tr class="click" data-act="teacher" data-v="${esc(g.name)}"><td class="nm">${esc(g.name)}</td><td class="l">${esc(g.subject)}</td><td>${esc(g.cls.map(c=>c.cls).join('، '))}</td>${cells(g.S)}${teacherRole?'':`<td class="${g.va==null?'':g.va>=2?'c-exc':g.va<=-2?'c-fail':''}"><b>${sgn(g.va)}</b></td>`}</tr>`).join(''), '', 'dense'))}
  ${sec('النمو حسب الشعبة والمادة', T('<th>الشعبة</th><th class="l">المادة</th><th class="l">المعلم</th>'+head+(teacherRole?'':'<th>الأثر المضاف</th>'), units.sort((x,y)=>(y.S.g??-99)-(x.S.g??-99)).map(u=>`<tr class="click" data-act="cls" data-v="${esc(u.cls)}"><td><b>${esc(u.cls)}</b></td><td class="l">${esc(u.l)}</td><td class="l">${esc(u.t)}</td>${cells(u.S)}${teacherRole?'':`<td class="${u.va==null?'':u.va>=2?'c-exc':u.va<=-2?'c-fail':''}">${sgn(u.va)}</td>`}</tr>`).join(''), '', 'dense'))}
  </div>`;
}

// ---------- جودة البيانات ----------
const Q_SEV={high:['fail','عالية'],mid:['weak','متوسطة'],low:['mid','منخفضة']};
function qualityChecks(d){
  const out=[], add=(sev,cat,pk,l,cls,text)=>out.push({sev,cat,pk,l,cls,text});
  const seq=d.availPkgs.filter(k=>k!=='year');
  for(const pk of d.availPkgs){
    for(const l of d.subjects){
      const rs=results(d.students,l,pk); if(!rs.length) continue;
      const byC={}, fullC=[]; rs.forEach(x=>(byC[x.st.cls]=byC[x.st.cls]||[]).push(x));
      for(const [c,xs] of Object.entries(byC)){
        const miss=xs.filter(x=>!x.p.counted && !x.p.special);
        if(miss.length) add(miss.length/xs.length>0.2?'high':'mid','درجات غير مرصودة',pk,l,c,`${miss.length} من ${xs.length} طالباً دون درجة: ${miss.slice(0,4).map(x=>x.st.name.split(' ').slice(0,2).join(' ')).join('، ')}${miss.length>4?'…':''}`);
        const bad=xs.filter(x=>x.p.total!=null && (x.p.total>x.p.max+1e-9 || x.p.total<0));
        if(bad.length) add('high','درجة خارج المدى',pk,l,c,`${bad.length} درجة أكبر من ${xs[0].p.max} أو سالبة: ${bad.slice(0,3).map(x=>`${x.st.name.split(' ')[0]} (${nf(x.p.total)})`).join('، ')}`);
        if(pk==='year') continue;
        const cn=xs.filter(x=>x.p.counted);
        if(cn.length>=8){
          const full=cn.filter(x=>x.p.pct>=99.99).length/cn.length*100;
          if(full>=60) fullC.push({c, full});
          const sd=stddev(cn.map(x=>x.p.pct)); if(sd!=null && sd<0.01 && cn[0].p.pct<99.99) add('mid','درجات متطابقة',pk,l,c,`كل الطلاب (${cn.length}) لهم الدرجة نفسها ${nf(cn[0].p.total)} من ${cn[0].p.max}`);
        }
      }
      if(fullC.length){ const nc=Object.keys(byC).length; fullC.sort((a,b)=>byCls(a.c,b.c));
        add(fullC.length/nc>=0.8?'low':'mid','نسبة درجات كاملة مرتفعة',pk,l,'',`في ${fullC.length} من ${nc} شعبة حصل 60% فأكثر من الطلاب على الدرجة الكاملة: ${fullC.slice(0,10).map(x=>`${x.c} (${r1(x.full)}%)`).join('، ')}${fullC.length>10?'…':''}. إن كان هذا طبيعياً في المادة فلا إجراء.`); }
      // تغيّر مفاجئ عن الاختبار السابق في الشعبة
      const i=seq.indexOf(pk); if(i>0){ const pv=seq[i-1];
        for(const c of Object.keys(byC)){ const L=d.students.filter(s=>s.cls===c), a=aggSubject(L,l,pk), b=aggSubject(L,l,pv);
          if(a.n>=8 && b.n>=8 && a.ach!=null && b.ach!=null && Math.abs(a.ach-b.ach)>=20) add('low','تغيّر مفاجئ',pk,l,c,`متوسط الشعبة ${a.ach>b.ach?'ارتفع':'انخفض'} ${r1(Math.abs(a.ach-b.ach))} نقطة عن ${PK_SHORT[pv]} (من ${r1(b.ach)}% إلى ${r1(a.ach)}%)`); }
        const gone=d.students.filter(s=>{ const R=s.subj[l]; return R&&R.pkg&&R.pkg[pv]&&!R.pkg[pk]; });
        if(gone.length && gone.length<rs.length) add('low','طلاب غير موجودين في الملف',pk,l,'',`${gone.length} طالباً لهم نتيجة في ${PK_SHORT[pv]} وليس لهم سطر في ${PK_SHORT[pk]}`);
      }
    }
    // شعب دون معلم
    if(pk!=='year'){ const T_=teachersFor(d,pk); if(T_.length){ const miss=[];
      for(const l of d.subjects){ const cs=[...new Set(results(d.students,l,pk).map(x=>x.st.cls))]; cs.forEach(c=>{ if(!T_.some(t=>t.cls===normClass(c) && t.subjectKey===l)) miss.push({c,l}); }); }
      if(miss.length){ const g={}; miss.forEach(x=>{ (g[x.c]=g[x.c]||[]).push(x.l); });
        add('mid','شعب دون معلم في قائمة المعلمين',pk,'','',Object.entries(g).sort((a,b)=>byCls(a[0],b[0])).map(([c,ls])=>`${c}: ${ls.length>=d.subjects.length-1?'كل المواد':ls.join('، ')}`).join(' · ')); } } }
  }
  // أسماء مكررة بأرقام مختلفة في الشعبة نفسها
  const seen=new Map(); d.students.forEach(s=>{ const k=s.cls+'|'+norm(s.name); if(!seen.has(k)) seen.set(k,[]); seen.get(k).push(s); });
  for(const [k,v] of seen) if(v.length>1) add('mid','اسم مكرر بأرقام مختلفة','', '', v[0].cls, `${v[0].name}: ${v.map(s=>s.id).join(' و ')}`);
  const o={high:0,mid:1,low:2}; return out.sort((a,b)=>o[a.sev]-o[b.sev]||String(a.cat).localeCompare(b.cat,'ar')||byCls(a.cls||'',b.cls||''));
}
let QCACHE={d:null, r:null};
const qualityOf = d => { if(QCACHE.d!==d){ QCACHE={d, r:qualityChecks(d)}; } return QCACHE.r; };
function pQuality(){
  const d=D(), Q=qualityOf(d), n=k=>Q.filter(x=>x.sev===k).length;
  const cats=[...new Set(Q.map(x=>x.cat))];
  const f=st.qCat&&cats.includes(st.qCat)?st.qCat:'all', L=f==='all'?Q:Q.filter(x=>x.cat===f);
  return `<div class="sheet">${RH('جودة البيانات','فحص تلقائي لملفات الرصد المرفوعة قبل اعتماد التقارير',[['العام الدراسي',currentYear],['الملاحظات',String(Q.length)],['تاريخ الإصدار',TODAY]])}
  <div class="kpis">${kpi('أهمية عالية',n('high'),'تُصحَّح قبل الاعتماد','fail')}${kpi('أهمية متوسطة',n('mid'),'تُراجع','weak')}${kpi('أهمية منخفضة',n('low'),'للعلم','mid')}${kpi('الطلاب',d.students.length)}</div>
  ${Q.length?`<div class="r-tools noprint"><label class="f">النوع <select data-set="qCat"><option value="all">الكل (${Q.length})</option>${cats.map(c=>`<option ${f===c?'selected':''} value="${esc(c)}">${esc(c)} (${Q.filter(x=>x.cat===c).length})</option>`).join('')}</select></label></div>`:''}
  ${sec('الملاحظات', L.length?T('<th>الأهمية</th><th class="l">النوع</th><th>الاختبار</th><th class="l">المادة</th><th>الشعبة</th><th class="l">التفاصيل</th>', L.slice(0,500).map(x=>`<tr><td><span class="tag ${Q_SEV[x.sev][0]}">${Q_SEV[x.sev][1]}</span></td><td class="l">${esc(x.cat)}</td><td>${x.pk?esc(PK_SHORT[x.pk]):'—'}</td><td class="l">${esc(x.l)||'—'}</td><td>${esc(x.cls)||'—'}</td><td class="l" style="white-space:normal">${esc(x.text)}</td></tr>`).join(''),'','dense'):'<div class="empty"><b>لا توجد ملاحظات</b><br>البيانات المرفوعة مكتملة ومتسقة في كل الفحوص.</div>')}
  <p class="note">الفحوص: الدرجات غير المرصودة، الدرجات خارج المدى، نسبة الدرجة الكاملة 60% فأكثر في شعبة، الدرجات المتطابقة لكل الطلاب، تغيّر متوسط الشعبة 20 نقطة فأكثر بين اختبارين متتاليين، الطلاب الذين اختفوا من ملف لاحق، الشعب التي ليس لها معلم في قائمة المعلمين، والأسماء المكررة بأرقام مختلفة. الملاحظة لا تعني بالضرورة خطأ، لكنها تستحق التأكد.</p>
  </div>`;
}
function qualityBanner(){
  const d=D(); if(!d || !canSee('quality')) return '';
  let Q=[]; try{ Q=qualityOf(d); }catch(e){ return ''; }
  const h=Q.filter(x=>x.sev==='high').length;
  return `<div class="panel qb ${h?'bad':Q.length?'mid':'ok'}"><b>فحص جودة البيانات:</b> ${Q.length?`${Q.length} ملاحظة${h?`، منها ${h} عالية الأهمية`:''}.`:'لا توجد ملاحظات.'} ${Q.length?'<button class="btn sm" data-act="nav" data-v="quality">عرض التفاصيل</button>':''}</div>`;
}

// ---------- مهامي ----------
function pMy(){
  const d=D(), pk=st.pk, r=role(), u=me();
  const TG=teacherAgg(d,d.students,pk);
  const units=TG.flatMap(g=>g.classes.map(c=>{ const t=targetOf(g.subject); return {t:g.name, l:g.subject, cls:c.cls, a:c.a, tg:t, gap:Math.min((c.a.ach??0)-t.ach, (c.a.passRate??0)-t.pass), below:(c.a.ach!=null&&c.a.ach<t.ach)||(c.a.passRate!=null&&c.a.passRate<t.pass)}; })).sort((x,y)=>x.gap-y.gap);
  const below=units.filter(x=>x.below);
  const R=d.students.map(s=>({s, r:riskOf(s,d,pk)}));
  const risk=R.filter(x=>x.r.score>=30).sort((a,b)=>b.r.score-a.r.score), edge=R.filter(x=>!x.r.sm.fails && x.r.edge.length);
  const fails=R.reduce((n,x)=>n+x.r.sm.fails,0);
  const title = r==='teacher' ? `مهامي — ${u.n}` : r==='coord' ? `مهام منسق ${d.scoped&&d.scoped.subject||u.s}` : 'متابعة المدرسة';
  const tasks=[];
  below.slice(0,8).forEach(x=>tasks.push({h:`خطة تحسين للشعبة ${x.cls} في ${x.l}`, s:`التحصيل ${r1(x.a.ach)}% والنجاح ${r1(x.a.passRate)}% مقابل المستهدف ${x.tg.ach}% و${x.tg.pass}%${r==='teacher'?'':` · ${x.t}`}`, btn:canSee('plan')?`<button class="btn sm" data-act="goplan" data-v="${esc(x.t+'§'+x.cls+'|'+x.l)}">فتح الخطة</button>`:''}));
  if(below.length>8) tasks.push({h:`و${below.length-8} شعب أخرى دون المستهدف`, s:'تظهر كلها في الجدول أدناه.'});
  if(edge.length) tasks.push({h:`متابعة ${edge.length} طالباً على حافة الرسوب`, s:'ناجحون الآن بنسبة 50–55% في مادة على الأقل؛ تدخل مبكر قبل الاختبار القادم.', btn:`<button class="btn sm" data-act="nav" data-v="risk">الإنذار المبكر</button>`});
  if(fails) tasks.push({h:`علاج ${fails} نتيجة راسبة`, s:`لدى ${R.filter(x=>x.r.sm.fails).length} طالباً.`, btn:`<button class="btn sm" data-act="nav" data-v="risk">الأسماء</button>`});
  if(canSee('quality')){ const h=qualityOf(d).filter(x=>x.sev==='high').length; if(h) tasks.push({h:`مراجعة ${h} ملاحظة عالية الأهمية في جودة البيانات`, s:'قبل اعتماد التقارير.', btn:`<button class="btn sm" data-act="nav" data-v="quality">جودة البيانات</button>`}); }

// ---------- النسخ السابقة والتراجع ----------
const VER_KEEP=5;
let SNAP_Q=Promise.resolve();
function snapshotYear(y, reason){ const r=SNAP_Q.then(()=>snapshotNow(y, reason)); SNAP_Q=r.catch(()=>{}); return r; }   // واحدة بعد الأخرى
async function snapshotNow(y, reason){
  try{
    const Y=YEARS[y]; if(!Y) return;
    if(!CARDS.some(c=>(Y.cards[c.id].sheets||[]).length || (Y.cards[c.id].teachers||[]).length)) return;
    const meta={id:String(Date.now()), at:new Date().toISOString(), by:(AUTH.user&&(AUTH.user.name||AUTH.user.n))||'', reason, students:Y.data?Y.data.students.length:0, files:CARDS.reduce((n,c)=>n+(Y.cards[c.id].files||[]).length,0)};
    if(CLOUD){
      busy('جارٍ حفظ النسخة السابقة…');
      const yref=CLOUD.db.collection('years').doc(y), blob=await gzipB64(JSON.stringify(Y.cards)), CH=700000, ops=[]; let n=0;
      for(let i=0;i<blob.length;i+=CH,n++) ops.push({ref:yref.collection('versions').doc(meta.id+'_'+n), data:{v:meta.id, i:n, data:blob.slice(i,i+CH)}});
      ops.push({ref:yref.collection('vmeta').doc(meta.id), data:clean({...meta, parts:n})});
      await cloudCommit(ops);
      const all=(await yref.collection('vmeta').get()).docs.map(d=>d.data()).sort((a,b)=>b.id.localeCompare(a.id)), old=all.slice(VER_KEEP);
      if(old.length){ const dels=[]; for(const o of old){ dels.push({del:true, ref:yref.collection('vmeta').doc(o.id)}); for(let i=0;i<(o.parts||1);i++) dels.push({del:true, ref:yref.collection('versions').doc(o.id+'_'+i)}); } await cloudCommit(dels); }
      busy('');
    } else {
      const k='hist:'+y, a=(await STORE.get(k))||[]; a.unshift({...meta, cards:JSON.parse(JSON.stringify(Y.cards))}); await STORE.set(k, a.slice(0,VER_KEEP));
    }
    VERS=null;
  }catch(e){ busy(''); console.warn('snapshot', e); }
}
let VERS=null;
async function versionsLoad(y){
  try{
    if(CLOUD) VERS={y, list:(await CLOUD.db.collection('years').doc(y).collection('vmeta').get()).docs.map(d=>d.data())};
    else VERS={y, list:((await STORE.get('hist:'+y))||[]).map(({cards,...m})=>m)};
    VERS.list.sort((a,b)=>b.id.localeCompare(a.id));
  }catch(e){ VERS={y, list:[], err:e.message||String(e)}; }

}
function versionsPanel(){

  const L=VERS.list;
  return `<div class="panel" id="versions"><h3>النسخ السابقة لعام <bdi dir="ltr">${esc(currentYear)}</bdi></h3>
    <p class="note" style="margin-top:0">قبل كل رفع أو مسح أو استعادة تُحفظ نسخة من بيانات العام كما كانت، ويُحتفظ بآخر ${VER_KEEP} نسخ. إذا رُفع ملف خاطئ استعد النسخة التي قبله.</p>
    ${VERS.err?`<div class="warn">تعذّر تحميل النسخ: ${esc(VERS.err)}</div>`:''}
    ${L.length?T('<th>التاريخ</th><th class="l">بواسطة</th><th class="l">السبب</th><th>الطلاب</th><th>الملفات</th><th></th>', L.map(v=>`<tr><td><bdi dir="ltr">${esc(fmtAt(v.at))}</bdi></td><td class="l">${esc(v.by)}</td><td class="l">${esc(v.reason)}</td><td>${v.students||'—'}</td><td>${v.files||'—'}</td><td><button class="btn sm" data-act="verrestore" data-v="${esc(v.id)}">استعادة</button></td></tr>`).join(''),'','dense'):'<p class="note">لا توجد نسخ سابقة بعد. تُنشأ تلقائياً عند الرفع التالي.</p>'}</div>`;
}
async function restoreVersion(y, id){
  const v=(VERS&&VERS.list||[]).find(x=>x.id===id); if(!v) return;
  let cards=null;
  try{
    busy('جارٍ استعادة النسخة…');
    if(CLOUD){ const parts=(await CLOUD.db.collection('years').doc(y).collection('versions').where('v','==',id).get()).docs.map(d=>d.data()).sort((a,b)=>a.i-b.i); cards=JSON.parse(await gunzipB64(parts.map(p=>p.data).join(''))); }
    else { const h=((await STORE.get('hist:'+y))||[]).find(x=>x.id===id); cards=h&&h.cards; }
    if(!cards) throw new Error('النسخة غير موجودة');
    await snapshotYear(y, 'قبل الاستعادة من نسخة سابقة');
    YEARS[y]={cards:{...emptyYear().cards, ...cards}, data:null};
    await buildYearAsync(y);
    if(CLOUD) await cloudPublishYear(y);
    syncFilters(); renderAll(); await save();
    audit('استعادة نسخة سابقة', `عام ${y}: نسخة ${fmtAt(v.at)} (${v.reason})`);
  }catch(e){ alert('تعذّرت الاستعادة: '+(e.message||e)); }
  finally{ busy(''); }
}

const HK={pk:'pk',g:'grade',c:'cls',s:'subject',t:'teacher',st:'student'};
function hashOf(){ const q=new URLSearchParams(); q.set('p',st.page); if(currentYear) q.set('y',currentYear); for(const [k,f] of Object.entries(HK)){ const v=st[f]; if(v!=null && v!=='all' && v!=='') q.set(k,v); } return '#'+q.toString(); }

// ---------- البحث السريع ----------
let PAL=null;
function palItems(q){
  const n=norm(q).toLowerCase(), toks=n.split(' ').filter(Boolean), hit=t=>toks.every(k=>t.includes(k));
  const out=[];
  NAV.forEach(g=>g.items.forEach(([id,l,ic])=>{ if(canSee(id) && (!toks.length || hit(norm(l)))) out.push({k:'تقرير',ic,label:l,sub:g.g,run:()=>ACT.nav(id)}); }));
  const d=D(); if(d && toks.length){
    if(canSee('student')) for(const s of d.students){ if(hit(norm(s.name)+' '+s.id)) out.push({k:'طالب',ic:'id',label:s.name,sub:`الشعبة ${s.cls} · ${s.id}`,run:()=>ACT.student(s.id)}); if(out.length>60) break; }
    if(canSee('class')) d.classes.forEach(c=>{ if(hit('الشعبه '+c+' '+c)) out.push({k:'شعبة',ic:'cls',label:'الشعبة '+c,sub:'الصف '+gradeOf(c),run:()=>ACT.cls(c)}); });
    if(canSee('subjects')) d.subjects.forEach(l=>{ if(hit(norm(l))) out.push({k:'مادة',ic:'book',label:l,sub:'تحليل المادة',run:()=>ACT.subject(l)}); });
    if(canSee('teachers')) [...new Set(teachersFor(d,st.pk).map(t=>t.name))].forEach(t=>{ if(hit(norm(t))) out.push({k:'معلم',ic:'user',label:t,sub:'تقرير المعلم',run:()=>ACT.teacher(t)}); });
  }
  const o={'تقرير':0,'طالب':1,'معلم':2,'شعبة':3,'مادة':3};
  return out.sort((a,b)=>o[a.k]-o[b.k]).slice(0,40);
}
function palOpen(){
  if(!me()) return; palClose();
  const el=document.createElement('div'); el.id='pal';
  el.innerHTML=`<div class="pal-box" role="dialog" aria-label="بحث سريع"><div class="pal-in">${ico('search')}<input placeholder="ابحث عن طالب أو معلم أو شعبة أو مادة أو تقرير…" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-list"></div><div class="pal-ft">↑ ↓ للتنقل · Enter للفتح · Ctrl + K للفتح من أي صفحة</div></div>`;
  document.body.appendChild(el);
  PAL={el, i:0, items:[]};
  const inp=el.querySelector('input'), draw=()=>{ PAL.items=palItems(inp.value); PAL.i=Math.min(PAL.i,Math.max(0,PAL.items.length-1));
    el.querySelector('.pal-list').innerHTML=PAL.items.length?PAL.items.map((x,i)=>`<div class="pal-it ${i===PAL.i?'on':''}" data-i="${i}">${ico(x.ic)}<span><b>${esc(x.label)}</b><small>${esc(x.sub)}</small></span><em>${esc(x.k)}</em></div>`).join(''):'<p class="note" style="padding:12px">لا توجد نتائج.</p>';
    const on=el.querySelector('.pal-it.on'); if(on) on.scrollIntoView({block:'nearest'}); };
  inp.addEventListener('input',()=>{ PAL.i=0; draw(); });
  inp.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); PAL.i=Math.min(PAL.items.length-1,PAL.i+1); draw(); } else if(e.key==='ArrowUp'){ e.preventDefault(); PAL.i=Math.max(0,PAL.i-1); draw(); } else if(e.key==='Enter'){ e.preventDefault(); palRun(PAL.i); } else if(e.key==='Escape'){ palClose(); } });
  el.addEventListener('click',e=>{ const it=e.target.closest('.pal-it'); if(it) palRun(+it.dataset.i); else if(e.target===el) palClose(); });

function prevPk(d,pk){ const seq=d.availPkgs.filter(k=>k!=='year'); const i=seq.indexOf(pk); return i>0?seq[i-1]:null; }
function committeeModel(d, pk, compare=false){
  const list=d.students, labels=labelsIn(list,pk);
  const A=aggAll(list,labels,pk), S=studentsAgg(list,pk);
  const pp=compare?prevPk(d,pk):null, AP=pp?aggAll(list,labelsIn(list,pp),pp):null;
  const TG=teacherAgg(d,list,pk);
  const subs=labels.map(l=>{ const a=aggSubject(list,l,pk), p=pp?aggSubject(list,l,pp):null, t=targetOf(l), tg=TG.filter(g=>g.subject===l);
    const achs=tg.map(g=>g.a.ach).filter(v=>v!=null);
    return {l,a,p,t,tg, delta:(p&&p.ach!=null&&a.ach!=null)?a.ach-p.ach:null, spread:achs.length>1?Math.max(...achs)-Math.min(...achs):null, rec:a.taught?(a.n+a.out)/a.taught*100:null}; });
  const grades=d.grades.map(g=>{ const L=list.filter(s=>s.grade===g); return {g,L,a:aggAll(L,labels,pk),s:studentsAgg(L,pk)}; }).filter(x=>x.a.taught);
  const classes=d.classes.map(c=>{ const L=list.filter(s=>s.cls===c); const G=grades.find(x=>x.g===gradeOf(c)); const a=aggAll(L,labels,pk); return {c,L,a,s:studentsAgg(L,pk),gap:(a.ach!=null&&G&&G.a.ach!=null)?a.ach-G.a.ach:null}; }).filter(x=>x.a.taught);
  const risks=list.map(s=>riskOf(s,d,pk).score);
  return {list,labels,A,S,pp,AP,TG,subs,grades,classes,riskHigh:risks.filter(x=>x>=60).length,riskMid:risks.filter(x=>x>=30&&x<60).length};
}
function autoFindings(M){
  const pos=[],neg=[],chal=[],rec=[], P=x=>r1(x)+'%', f=nf;
  const tp=yearTargets().pass, ta=yearTargets().ach;
  if(M.A.passRate!=null){ if(M.A.passRate>=tp) pos.push(`بلغت نسبة النجاح العامة ${P(M.A.passRate)} محققةً المستهدف (${tp}%).`); else neg.push(`نسبة النجاح العامة ${P(M.A.passRate)} أقل من المستهدف (${tp}%) بفارق ${f(tp-M.A.passRate)} نقطة.`); }
  if(M.A.ach!=null){ if(M.A.ach>=ta) pos.push(`بلغت نسبة التحصيل العامة ${P(M.A.ach)} متجاوزةً المستهدف (${ta}%).`); else neg.push(`نسبة التحصيل العامة ${P(M.A.ach)} دون المستهدف (${ta}%).`); }
  if(M.AP && M.AP.ach!=null && M.A.ach!=null){ const dd=M.A.ach-M.AP.ach; if(dd>=1) pos.push(`ارتفعت نسبة التحصيل العامة ${f(dd)} نقطة مقارنةً بـ${PKG[M.pp].label}.`); else if(dd<=-1) neg.push(`انخفضت نسبة التحصيل العامة ${f(-dd)} نقطة مقارنةً بـ${PKG[M.pp].label}.`); }
  if(M.S.allPassRate!=null && M.S.allPassRate>=90) pos.push(`${P(M.S.allPassRate)} من الطلاب (${M.S.allPass} طالباً) ناجحون في جميع المواد.`);
  if(M.A.excRate!=null && M.A.excRate>=50) pos.push(`${P(M.A.excRate)} من النتائج في مستوى التفوق (90% فأكثر).`);
  const strong=M.subs.filter(x=>x.a.ach!=null && x.a.ach>=x.t.ach && x.a.passRate>=x.t.pass).sort((a,b)=>b.a.ach-a.a.ach);
  if(strong.length) pos.push(`مواد حققت المستهدف في التحصيل والنجاح معاً: ${strong.map(x=>`${x.l} (${P(x.a.ach)})`).join('، ')}.`);
  const up=M.subs.filter(x=>x.delta!=null&&x.delta>=2); if(up.length) pos.push(`تحسّن واضح مقارنةً بالاختبار السابق في: ${up.map(x=>`${x.l} (+${f(x.delta)})`).join('، ')}.`);
  if(M.grades.length>1){ const gs=M.grades.filter(g=>g.a.ach!=null).sort((a,b)=>b.a.ach-a.a.ach); const top=gs[0], bot=gs[gs.length-1];
    pos.push(`الصف ${top.g} الأعلى تحصيلاً بين الصفوف (${P(top.a.ach)}).`); if(top.a.ach-bot.a.ach>=2) neg.push(`الصف ${bot.g} الأدنى تحصيلاً (${P(bot.a.ach)}) بفارق ${f(top.a.ach-bot.a.ach)} نقطة عن الصف ${top.g}.`); }
  const cs=M.classes.filter(c=>c.a.ach!=null).sort((a,b)=>b.a.ach-a.a.ach);
  if(cs.length>3) pos.push(`أعلى الشعب تحصيلاً: ${cs.slice(0,3).map(c=>`${c.c} (${P(c.a.ach)})`).join('، ')}.`);
  const weakSub=M.subs.filter(x=>x.a.ach!=null && (x.a.ach<x.t.ach || x.a.passRate<x.t.pass)).sort((a,b)=>a.a.ach-b.a.ach);
  weakSub.forEach(x=>neg.push(`مادة ${x.l}: تحصيل ${P(x.a.ach)} ونجاح ${P(x.a.passRate)} مقابل المستهدف (${x.t.ach}% و${x.t.pass}%)، وفيها ${x.a.weak} نتيجة ضعيفة منها ${x.a.fail} راسبة.`));
  const down=M.subs.filter(x=>x.delta!=null&&x.delta<=-2); if(down.length) neg.push(`تراجع مقارنةً بالاختبار السابق في: ${down.map(x=>`${x.l} (${f(x.delta)})`).join('، ')}.`);
  const lowC=cs.filter(c=>c.gap!=null&&c.gap<=-2); if(lowC.length) neg.push(`شعب تقل عن متوسط صفها بنقطتين فأكثر: ${lowC.map(c=>`${c.c} (${f(c.gap)})`).join('، ')}.`);
  const spread=M.subs.filter(x=>x.spread!=null&&x.spread>=5).sort((a,b)=>b.spread-a.spread); if(spread.length) chal.push(`تفاوت في نسبة التحصيل بين معلمي المادة الواحدة: ${spread.map(x=>`${x.l} (${f(x.spread)} نقطة)`).join('، ')}.`);
  const hv=M.subs.filter(x=>x.a.sd!=null&&x.a.sd>=15); if(hv.length) chal.push(`تشتّت مرتفع في درجات ${hv.map(x=>`${x.l} (انحراف ${f(x.a.sd)})`).join('، ')}، ما يدل على تباين كبير في مستويات الطلاب.`);
  const failC=cs.filter(c=>c.a.fail>=3).sort((a,b)=>b.a.fail-a.a.fail); if(failC.length) chal.push(`تركّز النتائج الراسبة في الشعب: ${failC.slice(0,6).map(c=>`${c.c} (${c.a.fail})`).join('، ')}.`);

  if(M.A.out) chal.push(`${M.A.out} نتيجة لم تدخل في النسب (غائب ${M.A.absent}، معذور ${M.A.excused}، محروم ${M.A.deprived}).`);
  const inc=M.subs.filter(x=>x.rec!=null&&x.rec<99.5); if(inc.length) chal.push(`الرصد غير مكتمل في: ${inc.map(x=>`${x.l} (${P(x.rec)})`).join('، ')}.`);
  weakSub.forEach(x=>rec.push(`إعداد خطة علاجية في مادة ${x.l} تستهدف ${x.a.weak} طالباً ضعيفاً، وقياس أثرها في الاختبار القادم.`));
  if(lowC.length) rec.push(`متابعة الشعب ${lowC.map(c=>c.c).join('، ')} بزيارات صفية وتحليل أسباب انخفاضها عن متوسط صفها.`);
  if(spread.length) rec.push(`تبادل الخبرات داخل أقسام ${spread.slice(0,4).map(x=>x.l).join('، ')} عبر دروس تطبيقية ومجتمع تعلّم مهني لتقليص الفارق بين الشعب، بدءاً بالأقسام الأعلى تفاوتاً.`);
  if(down.length) rec.push(`مراجعة أسباب التراجع في ${down.map(x=>x.l).join('، ')} مع رؤساء الأقسام ووضع إجراءات تصحيحية.`);
  if(M.riskHigh+M.riskMid) rec.push(`متابعة ${M.riskHigh+M.riskMid} طالباً في الإنذار المبكر بالتنسيق مع المرشد الأكاديمي وأولياء الأمور، وخطة فردية لحالات الخطورة العالية.`);
  if(M.A.exc) rec.push(`برامج إثرائية وتحفيزية للمتفوقين (${M.A.exc} نتيجة بنسبة 90% فأكثر) للمحافظة على مستواهم.`);
  if(inc.length) rec.push(`استكمال رصد الدرجات في ${inc.map(x=>x.l).join('، ')} قبل اعتماد النتائج.`);
  if(!neg.length) neg.push('لم تظهر جوانب سلبية واضحة في المؤشرات العامة لهذا الاختبار.');
  if(!chal.length) chal.push('لا توجد تحديات بارزة في البيانات؛ تضيف اللجنة ما تراه من الميدان.');
  return {pos,neg,chal,rec};
}

async function exportZip(){
  const d=D(), pk=st.pk, box=$('#zipStatus');
  if(typeof JSZip==='undefined' || !pdfReady()){ box.textContent='مكتبات الضغط وPDF لم تُحمَّل. افتح الصفحة مع اتصال بالإنترنت مرة واحدة.'; return; }
  const btn=document.querySelector('[data-act="zip"]'); if(btn) btn.disabled=true;
  const o=st.exp, zip=new JSZip(), root=safeName(`تقارير ${currentYear} - ${PKG[pk].label}`);
  const jobs=[];
  const add=(path,title,fn)=>jobs.push({path,title,fn});
  if(o.general){
    const g='01 - التقارير العامة';
    if(canSee('committee')) add(`${g}/تقرير لجنة التحصيل الأكاديمي.html`,'تقرير لجنة التحصيل الأكاديمي',()=>renderWith({...base,page:'committee',pk},pCommittee));
    add(`${g}/لوحة القياس.html`,'لوحة القياس',()=>renderWith({...base,page:'exec',pk},pExec));
    add(`${g}/مقارنة الصفوف والشعب.html`,'مقارنة الصفوف والشعب',()=>renderWith({...base,page:'compare',pk},pCompare));
    add(`${g}/توزيع الدرجات.html`,'توزيع الدرجات',()=>renderWith({...base,page:'dist',pk},pDist));
    add(`${g}/لوحة الشرف.html`,'لوحة الشرف',()=>renderWith({...base,page:'honor',pk},pHonor));
    add(`${g}/الإنذار المبكر.html`,'الإنذار المبكر',()=>renderWith({...base,page:'risk',pk},pRisk));
    if(d.availPkgs.includes('year')) add(`${g}/نتائج الدور الأول من 100.html`,'نتائج الدور الأول من 100',()=>renderWith({...base,page:'final',pk:'year'},pFinal));
  }
  const labels=labelsIn(d.students,pk);
  if(o.subjects) labels.forEach(l=>add(`02 - المواد/${safeName(l)}/تقرير المادة (القسم).html`,`تقرير مادة ${l}`,()=>deptHtml(l,pk)));
  if(o.teachers) teacherAgg(d,d.students,pk).forEach(g=>add(`03 - المعلمون/${safeName(g.subject)}/${safeName(g.name)}/التقرير الشامل - ${safeName(g.name)}.html`,`تقرير ${g.name}`,()=>teacherHtml(g.name,pk)));
  if(o.classes) d.classes.forEach(c=>{
    const dir=`04 - الصفوف والشعب/الصف ${gradeOf(c)}/الشعبة ${safeName(c)}`;
    add(`${dir}/تقرير الشعبة - جميع المواد.html`,`تقرير الشعبة ${c}`,()=>classHtml(c,pk));
    if(o.classSubjects) labelsIn(d.students.filter(s=>s.cls===c),pk).forEach(l=>add(`${dir}/${safeName(l)}.html`,`الشعبة ${c} — ${l}`,()=>classHtml(c,pk,l)));
  });
  for(let i=0;i<jobs.length;i++){
    const j=jobs[i]; box.textContent=`جارٍ إنشاء ملفات PDF… ${i+1} من ${jobs.length}`; await frame();
    zip.file(`${root}/${j.path.replace(/\.html$/,'.pdf')}`, await htmlToPdf(j.fn()));
  }
  if(o.excel){
    zip.file(`${root}/05 - Excel/تحليل الدرجات - جميع البيانات.xlsx`, XLSX.write(buildWorkbook(d.students,pk),{type:'array',bookType:'xlsx'}));
    if(o.teachers) teacherAgg(d,d.students,pk).forEach(g=>{
      const wb=XLSX.utils.book_new(); const ws=XLSX.utils.aoa_to_sheet([['الرقم','الاسم','الشعبة','الدرجة','من','النسبة %','التصنيف'],...g.items.filter(x=>x.p.counted).sort((a,b)=>byCls(a.st.cls,b.st.cls)||a.st.name.localeCompare(b.st.name,'ar')).map(x=>[x.st.id,x.st.name,x.st.cls,x.p.total,x.p.max,r1(x.p.pct),!x.p.pass?'راسب':TIER_LABEL[tierKey(x.p.pct)]])]);
      ws['!views']=[{RTL:true}]; XLSX.utils.book_append_sheet(wb,ws,'الطلاب');
      zip.file(`${root}/03 - المعلمون/${safeName(g.subject)}/${safeName(g.name)}/درجات طلاب ${safeName(g.name)}.xlsx`, XLSX.write(wb,{type:'array',bookType:'xlsx'}));
    });
  }
  box.textContent='جارٍ ضغط الملفات…'; await new Promise(r=>setTimeout(r,0));
  const blob=await zip.generateAsync({type:'blob', compression:'DEFLATE'});
  download(`${root}.zip`, blob);
  box.textContent=`تم: ${jobs.length} تقريراً بصيغة PDF${o.excel?' مع ملفات Excel':''} في الملف "${root}.zip".`; if(btn) btn.disabled=false;
}

    <label class="chk"><input type="radio" name="mm" data-act="mailmode" data-v="share" ${m==='share'?'checked':''} ${sh?'':'disabled'}> <span><b>المشاركة من النظام</b><small>${sh?'تفتح قائمة المشاركة (البريد، Outlook، Teams…) والتقرير مرفق. اكتب عنوان المستلم فيها.':'غير متاحة في هذا المتصفح؛ تعمل في Edge/Chrome على Windows وفي iPad والهاتف.'}</small></span></label></div>`;
}

// ---------- تتبع الدفعات عبر الأعوام ----------
function cohortRows(){
  const ys=Object.keys(YEARS).filter(y=>DY(y)).sort(), out=[];
  const pkOf=y=>DY(y).availPkgs.includes('year')?'year':DY(y).availPkgs.slice(-1)[0];
  for(let i=0;i<ys.length-1;i++){
    const A=DY(ys[i]), B=DY(ys[i+1]), pa=pkOf(ys[i]), pb=pkOf(ys[i+1]); const ids=new Map(B.students.map(s=>[s.id,s]));
    A.grades.forEach(g=>{ const LA=A.students.filter(s=>s.grade===g && ids.has(s.id)); if(LA.length<5) return; const LB=LA.map(s=>ids.get(s.id));
      const a=studentsAgg(LA,pa), b=studentsAgg(LB,pb), gb=[...new Set(LB.map(s=>s.grade))].sort().join('/');
      out.push({from:`الصف ${g} في ${ys[i]}`, to:`الصف ${gb} في ${ys[i+1]}`, n:LA.length, pa, pb, a:a.avg, b:b.avg, ap:a.allPassRate, bp:b.allPassRate}); });
  }
  return out;
}
